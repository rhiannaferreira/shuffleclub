const cmpScore = (a,b) => { for(let i=0;i<Math.max(a.length,b.length);i++){ const d=(a[i]||0)-(b[i]||0); if(d) return d; } return 0; };
function best7(cards){
  let best=null; const n=cards.length;
  for(let a=0;a<n;a++) for(let b=a+1;b<n;b++){
    const five = cards.filter((_,i)=>i!==a && i!==b);
    if(five.length!==5) continue;
    const s = eval5(five); if(!best || cmpScore(s,best)>0) best=s;
  }
  if(n===5) best = eval5(cards);
  return best;
}
function handName(s){
  if(!s) return '';
  if(s[0]===8 && s[1]===14) return 'Royal flush';
  const w = RANK_WORD[s[1]];
  if(s[0]===1) return `Pair of ${w}`;
  if(s[0]===2) return `Two pair, ${w} and ${RANK_WORD[s[2]]}`;
  if(s[0]===3) return `Three ${w}`;
  if(s[0]===6) return `${w} full of ${RANK_WORD[s[2]]}`;
  if(s[0]===7) return `Four ${w}`;
  if(s[0]===0) return `${rankLabel(s[1]===14?1:s[1])} high`;
  return HAND_NAMES[s[0]];
}
// Monte Carlo share of the pot against `opp` random hands.
function equity(hole, board, opp, sims = 140){
  const known = new Set([...hole, ...board].map(c => c.s+c.r));
  const rest = makeDeck().filter(c => !known.has(c.s+c.r));
  let total = 0;
  for(let n=0;n<sims;n++){
    const need = 2*opp + (5-board.length);
    for(let i=0;i<need;i++){ const j=i+Math.floor(Math.random()*(rest.length-i)); [rest[i],rest[j]]=[rest[j],rest[i]]; }
    const b = board.concat(rest.slice(2*opp, need));
    const mine = best7(hole.concat(b));
    let lose=false, ties=0;
    for(let o=0;o<opp;o++){ const s = best7([rest[2*o], rest[2*o+1], ...b]); const d=cmpScore(mine,s); if(d<0){ lose=true; break; } if(d===0) ties++; }
    if(!lose) total += 1/(ties+1);
  }
  return total/sims;
}

function Holdem(root, ui){
  const wrap = h('div','pk'); root.appendChild(wrap);
  const SEATS = [['You',0],['Mags',0.8],['Dutch',1.4],['Lou',0.5]];
  const SB=10, BB=20, START=1000;
  let P, dealer, deck, board, street, curBet, minRaise, turn, over, timer, raiseTo, result, handNo, busted;
  const later = (fn,ms) => { clearTimeout(timer); timer=setTimeout(fn,ms); };
  const pot = () => P.reduce((s,p)=>s+p.total,0);
  const canAct = p => !p.out && !p.folded && !p.allin;
  const needsAct = p => canAct(p) && (!p.acted || p.bet<curBet);
  const nextIdx = (i, pred) => { for(let k=1;k<=P.length;k++){ const j=(i+k)%P.length; if(pred(P[j])) return j; } return -1; };

  function newGame(){
    clearTimeout(timer); handNo=0; busted=false;
    P = SEATS.map(([name,agg],i) => ({name, agg, human:i===0, chips:START, hole:[], bet:0, total:0, folded:false, allin:false, acted:false, last:'', out:false, won:0}));
    dealer = Math.floor(Math.random()*P.length);
    newHand();
  }
  function newHand(){
    P.forEach(p => { if(p.chips<=0) p.out=true; Object.assign(p, {hole:[], bet:0, total:0, folded:p.out, allin:false, acted:false, last:'', won:0, score:null}); });
    if(P[0].out){ busted=true; return render(); }
    if(P.filter(p=>!p.out).length<2) return render();
    handNo++; dealer = nextIdx(dealer, p=>!p.out);
    deck = shuffle(makeDeck()); deck.forEach(c=>c.up=true); board=[]; street=0; over=false; result='';
    P.forEach(p => { if(!p.out) p.hole=[deck.pop(), deck.pop()]; });
    const heads = P.filter(p=>!p.out).length===2;
    const sb = heads ? dealer : nextIdx(dealer, p=>!p.out), bb = nextIdx(sb, p=>!p.out);
    post(sb, SB, 'Small blind'); post(bb, BB, 'Big blind');
    curBet=BB; minRaise=BB;
    turn = nextIdx(bb, needsAct);
    proceed();
  }
  function post(i, amt, label){ const p=P[i]; const a=Math.min(amt,p.chips); p.chips-=a; p.bet+=a; p.total+=a; if(!p.chips) p.allin=true; p.last=label; }
  function act(i, type, to){
    const p=P[i]; if(over || i!==turn) return;
    if(type==='fold'){ p.folded=true; p.last='Fold'; }
    else if(type==='call'){
      const need=Math.min(curBet-p.bet, p.chips); p.chips-=need; p.bet+=need; p.total+=need; if(!p.chips) p.allin=true;
      p.last = need===0 ? 'Check' : (p.allin ? 'All in' : `Call ${need}`);
    } else {
      to = Math.min(to, p.bet+p.chips); const add = to-p.bet; p.chips-=add; p.total+=add; p.bet=to; if(!p.chips) p.allin=true;
      const opened = curBet===0;
      if(to>curBet){ minRaise = Math.max(minRaise, to-curBet); curBet=to; P.forEach(q => { if(q!==p) q.acted=false; }); }
      p.last = p.allin ? 'All in' : (opened ? `Bet ${to}` : `Raise to ${to}`);
    }
    p.acted = true;
    turn = nextIdx(i, needsAct);
    proceed();
  }
  function proceed(){
    const inHand = P.filter(p=>!p.out && !p.folded);
    if(inHand.length===1){ const w=inHand[0]; const amt=pot(); w.chips+=amt; w.won=amt; over=true; result=`${w.human?'You take':w.name+' takes'} the pot of ${amt}. Everyone else folded.`; return render(); }
    const actors = P.filter(canAct);
    if(turn<0 || !actors.some(needsAct)){ render(); return later(nextStreet, actors.length<=1 ? 1000 : 650); }
    render();
    if(!P[turn].human) later(() => bot(turn), 650 + Math.random()*500);
  }
  function nextStreet(){
    P.forEach(p => { p.bet=0; p.acted=false; if(!p.folded && !p.allin && !p.out && street<3) p.last=''; });
    curBet=0; minRaise=BB; street++;
    if(street===1) board.push(deck.pop(), deck.pop(), deck.pop());
    else if(street<=3) board.push(deck.pop());
    else return showdown();
    turn = nextIdx(dealer, needsAct);
    if(P.filter(canAct).length<2) turn=-1;
    proceed();
  }
  function showdown(){
    const inHand = P.filter(p=>!p.out && !p.folded);
    inHand.forEach(p => p.score = best7([...p.hole, ...board]));
    const levels = [...new Set(P.filter(p=>p.total>0).map(p=>p.total))].sort((a,b)=>a-b);
    let prev=0;
    for(const L of levels){
      const amount = P.reduce((s,p)=> s + Math.min(p.total,L) - Math.min(p.total,prev), 0);
      let elig = inHand.filter(p=>p.total>=L); if(!elig.length) elig = inHand;
      prev = L;
      let top=[]; for(const p of elig){ if(!top.length || cmpScore(p.score, top[0].score)>0) top=[p]; else if(cmpScore(p.score, top[0].score)===0) top.push(p); }
      const share = Math.floor(amount/top.length); top.forEach(p => { p.chips+=share; p.won+=share; }); top[0].chips += amount - share*top.length; top[0].won += amount - share*top.length;
    }
    over=true; street=4;
    const ws = P.filter(p=>p.won>0);
    result = ws.map(p => `${p.human?'You win':p.name+' wins'} ${p.won} with ${handName(p.score).toLowerCase()}`).join(' · ') + '.';
    render();
  }
  function bot(i){
    if(over || i!==turn) return;
    const p=P[i], need=curBet-p.bet, potNow=pot();
    const opp = P.filter(q=>!q.out && !q.folded && q!==p).length;
    const eq = equity(p.hole, board, opp);
    const edge = eq*(opp+1);              // 1.0 = an average hand at this table
    const odds = need/(potNow+need || 1);
    const r = Math.random();
    const raiseSize = () => { const base = Math.max(minRaise, Math.round(potNow*(0.45+0.55*r)/10)*10); return curBet + base; };
    if(edge>1.75 || (edge>1.3 && r<0.35*p.agg) || (r<0.05*p.agg && street<3)){
      if(p.chips + p.bet > curBet) return act(i,'raise', edge>2.4 && r<0.25 ? p.bet+p.chips : raiseSize());
    }
    if(need===0) return act(i,'call');
    if(eq >= odds*0.95 || (need<=BB && edge>0.7) || r<0.04*p.agg) return act(i,'call');
    return act(i,'fold');
  }

  // ---- drawing ----
  function seatEl(p, i){
    const s = h('div','pk-seat' + (i===turn && !over ? ' turn':'') + (p.folded&&!p.out ? ' folded':'') + (p.out ? ' out':'') + (p.won ? ' won':''));
    const cards = h('div','pk-hole');
    const show = over && street===4 && !p.folded;
    p.hole.forEach(c => cards.appendChild(cardEl(c, show)));
    if(!p.hole.length) cards.appendChild(h('div','slot'));
    s.append(h('div','pk-name', `${p.name}${i===dealer?' <span class="dbtn" title="Dealer">D</span>':''}`), cards,
      h('div','pk-chips', p.out ? 'Out' : `${p.chips}`),
      h('div','pk-act', p.won ? `+${p.won}` : (p.last || (i===turn && !over ? 'Thinking…' : '&nbsp;'))));
    if(show && p.score) s.appendChild(h('div','pk-hn', handName(p.score)));
    return s;
  }
  function render(){
    wrap.innerHTML='';
    if(busted || P.filter(p=>!p.out).length<2){
      const box = h('div','sp-over');
      const won = !busted;
      box.innerHTML = `<h3>${won ? 'Table cleared' : 'Busted'}</h3><p>${won ? `You took every chip in ${handNo} hands.` : `You ran out of chips after ${handNo} hands.`}</p>`;
      const b=h('button','btn primary big', won ? 'New table' : 'Buy back in'); b.addEventListener('click', newGame); box.appendChild(b);
      wrap.appendChild(box); ui.status(won ? '<span class="win">Every chip is yours.</span>' : '<span class="lose">Out of chips.</span>'); return;
    }
    const opps = h('div','pk-opps'); [1,2,3].forEach(i => opps.appendChild(seatEl(P[i], i))); wrap.appendChild(opps);
    const mid = h('div','pk-mid');
    const bd = h('div','pk-board'); for(let k=0;k<5;k++) bd.appendChild(board[k] ? cardEl(board[k]) : h('div','slot'));
    mid.append(h('div','pk-pot', `<span class="label">Pot</span><strong>${pot()}</strong>`), bd);
    wrap.appendChild(mid);
    // you
    const me = P[0];
    const you = h('div','pk-you' + (turn===0 && !over ? ' turn':'') + (me.folded ? ' folded':''));
    const hole = h('div','pk-hole big'); me.hole.forEach(c => hole.appendChild(cardEl(c, true)));
    const cur = me.hole.length && board.length>=3 ? handName(best7([...me.hole, ...board])) : (me.hole.length===2 ? (hv(me.hole[0])===hv(me.hole[1]) ? `Pocket ${RANK_WORD[hv(me.hole[0])].toLowerCase()}` : `${rankLabel(me.hole[0].r)}-${rankLabel(me.hole[1].r)}${me.hole[0].s===me.hole[1].s?' suited':''}`) : '');
    const info = h('div','pk-info', `<div class="pk-name">You${dealer===0?' <span class="dbtn">D</span>':''}</div><div class="pk-stack">${me.chips}</div><div class="pk-act">${me.won?`+${me.won}`:(me.last||'&nbsp;')}</div><div class="pk-hn">${cur}</div>`);
    you.append(hole, info); wrap.appendChild(you);
    // controls
    const ctr = h('div','pk-ctrl');
    if(over){
      const b=h('button','btn primary big','Next hand'); b.addEventListener('click', newHand); ctr.appendChild(b);
    } else if(turn===0){
      const need = curBet-me.bet, maxTo = me.bet+me.chips;
      const minTo = Math.min(maxTo, curBet + minRaise);
      if(raiseTo==null || raiseTo<minTo || raiseTo>maxTo) raiseTo = minTo;
      const row = h('div','controls');
      const fold=h('button','btn','Fold'); fold.addEventListener('click',()=>act(0,'fold'));
      const call=h('button','btn primary', need===0 ? 'Check' : (need>=me.chips ? `All in ${me.chips}` : `Call ${need}`)); call.addEventListener('click',()=>act(0,'call'));
      row.append(fold, call);
      if(maxTo > curBet){
        const rb=h('button','btn hot', raiseTo>=maxTo ? `All in ${maxTo}` : `${curBet===0?'Bet':'Raise to'} ${raiseTo}`); rb.addEventListener('click',()=>{ const t=raiseTo; raiseTo=null; act(0,'raise',t); });
        row.appendChild(rb);
        const sl = h('div','pk-size');
        const range = h('input'); range.type='range'; range.id='raise'; range.min=minTo; range.max=maxTo; range.step=10; range.value=raiseTo; range.setAttribute('aria-label','Raise amount');
        range.addEventListener('input', () => { raiseTo = Math.min(maxTo, Math.max(minTo, +range.value)); rb.textContent = raiseTo>=maxTo ? `All in ${maxTo}` : `${curBet===0?'Bet':'Raise to'} ${raiseTo}`; });
        const quick = h('div','pk-quick');
        [['Min',minTo],['½ pot', curBet + Math.round((pot()+need)/2/10)*10],['Pot', curBet + Math.round((pot()+need)/10)*10],['All in',maxTo]].forEach(([t,v]) => {
          const q=h('button','btn',t); q.addEventListener('click',()=>{ raiseTo=Math.min(maxTo,Math.max(minTo,v)); range.value=raiseTo; range.dispatchEvent(new Event('input')); }); quick.appendChild(q); });
        sl.append(range, quick); ctr.append(row, sl);
      } else ctr.appendChild(row);
    } else ctr.appendChild(h('div','label', me.folded ? 'You folded. Watching the hand play out…' : (turn<0 ? 'Dealing…' : `${P[turn].name} to act…`)));
    wrap.appendChild(ctr);
    const streetName = ['Pre-flop','Flop','Turn','River','Showdown'][street];
    ui.status(over ? result : `Hand <b>${handNo}</b> · ${streetName} · Blinds ${SB}/${BB}${curBet ? ` · To call <b>${Math.max(0,curBet-me.bet)}</b>`:''}`);
  }
  return { newGame, stop(){ clearTimeout(timer); } };
}

// ======================= SIX-CARD GOLF =======================
function Golf(root, ui){
  const wrap = h('div','golf'); root.appendChild(wrap);
  const HOLES = 9;
  let H, stock, discard, turn, phase, held, heldFrom, final, hole, totals, msg, timer, peeks, starter;
  const val = c => c.r===2 ? -2 : c.r===13 ? 0 : c.r>=11 ? 10 : c.r;
  const later = (fn,ms) => { clearTimeout(timer); timer=setTimeout(fn,ms); };
  function score(hand, known=false){ // known: only count face-up (unknowns as 0)
    let s=0; for(let k=0;k<3;k++){ const a=hand[k], b=hand[k+3];
      const av = (!known||a.up) ? val(a.c) : 0, bv = (!known||b.up) ? val(b.c) : 0;
      if((!known || (a.up && b.up)) && a.c.r===b.c.r) continue; s += av+bv; }
    return s;
  }
  // computer's estimate: unknown cards count as 5
  function est(hand){ let s=0; for(let k=0;k<3;k++){ const a=hand[k], b=hand[k+3]; if(a.up && b.up && a.c.r===b.c.r) continue; s += (a.up?val(a.c):5) + (b.up?val(b.c):5); } return s; }
  function newGame(){ clearTimeout(timer); hole=1; totals=[0,0]; starter=0; deal(); }
  function deal(){
    const d = shuffle(makeDeck());
    H = [0,1].map(() => d.splice(0,6).map(c => ({c:{...c, up:true}, up:false})));
    discard = [{...d.pop(), up:true}]; stock = d; held=null; heldFrom=null; final=null; peeks=0;
    // computer turns two of its cards
    shuffle([0,1,2,3,4,5]).slice(0,2).forEach(k => H[1][k].up=true);
    phase='peek'; turn=0; msg='Turn over any two of your cards to start.'; render();
  }
  const allUp = p => H[p].every(x=>x.up);
  function refill(){ if(stock.length) return; const top=discard.pop(); stock=shuffle(discard.map(c=>({...c}))); discard=[top]; }
  function clickStock(){ if(phase!=='draw' || turn!==0) return; refill(); held={...stock.pop(), up:true}; heldFrom='stock'; phase='hold'; msg='Swap it into your grid, or tap the discard pile to throw it away.'; render(); }
  function clickDiscard(){
    if(turn!==0) return;
    if(phase==='draw'){ held=discard.pop(); heldFrom='discard'; phase='hold'; msg='Tap one of your cards to swap it out.'; return render(); }
    if(phase==='hold' && heldFrom==='stock'){ discard.push(held); held=null;
      if(H[0].some(x=>!x.up)){ phase='flip'; msg='Now turn over one of your face-down cards.'; render(); } else endTurn(0); }
  }
  function clickMine(k){
    const x=H[0][k];
    if(phase==='peek'){ if(x.up) return; x.up=true; peeks++; if(peeks<2) return render(); phase='wait'; return startHole(); }
    if(turn!==0) return;
    if(phase==='hold'){ discard.push(x.c); H[0][k]={c:held, up:true}; held=null; return endTurn(0); }
    if(phase==='flip' && !x.up){ x.up=true; return endTurn(0); }
  }
  function startHole(){ turn=starter; if(turn===0){ phase='draw'; msg='Your turn. Draw from the deck or take the discard.'; render(); } else { phase='cpu'; render(); later(cpu, 900); } }
  function endTurn(p){
    held=null;
    if(final===null && allUp(p)) final=p;
    const next=1-p;
    if(final!==null && next===final) return endRound();
    turn=next;
    if(turn===1){ phase='cpu'; render(); later(cpu, 900); }
    else { phase='draw'; msg = (final===1 ? 'The computer has turned every card. This is your last turn. ' : '') + msg; render(); }
  }
  function bestSpot(hand, card){
    let best=null;
    for(let k=0;k<6;k++){ const copy=hand.map(x=>({...x})); copy[k]={c:card, up:true}; const d=est(copy)-est(hand); if(!best || d<best.d) best={k,d}; }
    return best;
  }
  function cpu(){
    const me=H[1], top=discard[discard.length-1];
    const take = bestSpot(me, top);
    const name = c => `${rankLabel(c.r)}${c.s}`;
    const lastTurn = final===0;
    if(take.d <= -3 || val(top)<=1){
      discard.pop(); discard.push(me[take.k].c); me[take.k]={c:top, up:true};
      msg=`Computer took the ${name(top)} from the discard pile. Your turn.`;
    } else {
      refill(); const card={...stock.pop(), up:true}; const spot=bestSpot(me, card);
      const down = me.map((x,k)=>x.up?-1:k).filter(k=>k>=0);
      if(spot.d < -1 || (down.length===0) || lastTurn && spot.d<0){
        discard.push(me[spot.k].c); me[spot.k]={c:card, up:true}; msg=`Computer drew a card and kept it. Your turn.`;
      } else {
        discard.push(card);
        // flipping the last face-down card would end the hole; avoid that while it is behind
        const k = down[Math.floor(Math.random()*down.length)]; me[k].up=true;
        msg=`Computer threw away the ${name(card)} and turned over a card. Your turn.`;
      }
    }
    endTurn(1);
  }
  function endRound(){
    H.forEach(hd => hd.forEach(x => x.up=true));
    const s=[score(H[0]), score(H[1])]; totals[0]+=s[0]; totals[1]+=s[1];
    phase='end';
    msg = s[0]<s[1] ? `<span class="win">You win the hole, ${s[0]} to ${s[1]}.</span>` : s[0]>s[1] ? `<span class="lose">Computer wins the hole, ${s[1]} to ${s[0]}.</span>` : `Tied hole at ${s[0]}.`;
    render();
  }
  function grid(p){
    const g=h('div','golf-grid');
    H[p].forEach((x,k) => {
      const el = cardEl(x.c, x.up);
      const clickable = p===0 && ((phase==='peek' && !x.up) || (turn===0 && (phase==='hold' || (phase==='flip' && !x.up))));
      if(clickable){ el.classList.add('can','live'); el.setAttribute('role','button'); el.tabIndex=0; el.addEventListener('click',()=>clickMine(k)); el.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); clickMine(k);} }); }
      g.appendChild(el);
    });
    return g;
  }
  function render(){
    wrap.innerHTML='';
    const scoreLine = p => phase==='end' ? `scores ${score(H[p])}` : `showing ${score(H[p], true)}`;
    const top = h('div','seat'); top.append(h('div','label', `Computer · ${scoreLine(1)} · total ${totals[1]}`), grid(1)); wrap.appendChild(top);
    const mid = h('div','mid');
    const st = stock.length ? cardEl({}, false) : h('div','slot');
    if(turn===0 && phase==='draw'){ st.classList.add('can','live'); st.setAttribute('role','button'); st.setAttribute('aria-label','Draw from the deck'); }
    st.addEventListener('click', clickStock);
    const dc = discard.length ? cardEl(discard[discard.length-1], true) : h('div','slot');
    if(turn===0 && (phase==='draw' || (phase==='hold' && heldFrom==='stock'))){ dc.classList.add('can','live'); dc.setAttribute('role','button'); dc.setAttribute('aria-label', phase==='draw' ? 'Take the discard' : 'Throw away the drawn card'); }
    dc.addEventListener('click', clickDiscard);
    const col = (el, label) => { const s=h('div','seat'); s.style.width='auto'; s.append(el, h('div','label',label)); return s; };
    mid.append(col(st,'Deck'), col(dc,'Discard'));
    if(held){ const hc=cardEl(held,true); hc.classList.add('sel'); mid.append(col(hc,'In hand')); }
    wrap.appendChild(mid);
    const me = h('div','seat'); me.append(grid(0), h('div','label', `You · ${scoreLine(0)} · total ${totals[0]}`)); wrap.appendChild(me);
    if(phase==='end'){
      const ctr=h('div','controls');
      if(hole<HOLES){ const b=h('button','btn primary big',`Tee off hole ${hole+1}`); b.addEventListener('click',()=>{ hole++; starter=1-starter; deal(); }); ctr.appendChild(b); }
      else { const res = totals[0]<totals[1] ? 'You win the round' : totals[0]>totals[1] ? 'Computer wins the round' : 'All square'; ctr.appendChild(h('div','total', `${res}: ${totals[0]} to ${totals[1]}`)); const b=h('button','btn primary big','Play 9 more'); b.addEventListener('click',newGame); ctr.appendChild(b); }
      wrap.appendChild(ctr);
    }
    ui.status(`<span class="label">Hole ${hole}/${HOLES}</span> ${phase==='cpu' ? 'Computer is playing…' : msg}`);
  }
  return { newGame, stop(){ clearTimeout(timer); } };
}

// ======================= EGYPTIAN RATSCREW =======================
function Ratscrew(root, ui){
  const wrap = h('div','rat'); root.appendChild(wrap);
  const CHANCES = {1:4, 11:1, 12:2, 13:3};
  let hands, pile, turn, chances, challenger, over, msg, pv, timers=[], react=750, keyH=null, started=false;
  const later = (fn, ms) => { const t=setTimeout(fn, ms); timers.push(t); return t; };
  const clear = () => { timers.forEach(clearTimeout); timers=[]; };
  function newGame(){
    clear();
    if(!started){ return picker(); }
    const d = shuffle(makeDeck()).map(c => ({...c, up:true}));
    hands=[d.slice(0,26), d.slice(26)]; pile=[]; turn=0; chances=null; challenger=null; over=false; pv=0;
    msg='Your flip. Slap doubles (7, 7) and sandwiches (7, 2, 7) before the computer does.';
    bindKeys(); render();
  }
  function picker(){
    wrap.innerHTML='';
    const box = h('div','sp-over'); box.innerHTML = '<h3>Ratscrew</h3><p>How quick are the computer\'s hands?</p>';
    const row = h('div','controls');
    [['Sleepy',1100],['Sharp',750],['Lightning',480]].forEach(([t,ms],i) => { const b=h('button','btn'+(i===1?' primary':''),t); b.addEventListener('click',()=>{ react=ms; started=true; newGame(); }); row.appendChild(b); });
    box.appendChild(row); wrap.appendChild(box); ui.status('Pick a speed to deal in.');
  }
  const slappable = () => { const n=pile.length; if(n>=2 && pile[n-1].r===pile[n-2].r) return 'Double'; if(n>=3 && pile[n-1].r===pile[n-3].r) return 'Sandwich'; return null; };
  function flip(p){
    if(over || turn!==p) return;
    if(!hands[p].length) return finish(1-p);
    const c = hands[p].shift(); pile.push(c); pv++;
    if(CHANCES[c.r]){ chances=CHANCES[c.r]; challenger=p; turn=1-p; msg = `${p===0?'You':'Computer'} played a${c.r===1?'n Ace':' '+({11:'Jack',12:'Queen',13:'King'})[c.r]}. ${p===0?'Computer has':'You have'} ${chances} ${chances===1?'chance':'chances'} to answer with a face card.`; }
    else if(challenger!=null){
      chances--;
      if(chances===0){ turn=null; const w=challenger, v=pv; msg=`No face card. ${w===0?'You collect':'Computer collects'} the pile…`;
        later(() => { if(pv===v) take(w, `${w===0?'You':'Computer'} won the face-card fight.`); }, 1100); }
      else msg = `${chances} ${chances===1?'chance':'chances'} left.`;
    } else turn=1-p;
    if(turn!==null && !hands[turn].length && !slappable()){ const loser=turn, v=pv; later(() => { if(pv===v) finish(1-loser); }, react+300); }
    afterChange();
  }
  function take(p, why){
    hands[p].push(...pile); pile=[]; chances=null; challenger=null; turn=p; pv++;
    msg = `${why} ${p===0?'You':'Computer'} now hold${p===0?'':'s'} ${hands[p].length}.`;
    if(!hands[1-p].length) return finish(p);
    afterChange();
  }
  function slap(p){
    if(over || !pile.length) return;
    const kind = slappable();
    if(kind) return take(p, `${kind}! ${p===0?'You':'Computer'} slapped first.`);
    if(p===0){ if(hands[0].length){ pile.unshift(hands[0].shift()); msg='Bad slap. One of your cards goes under the pile.'; pv++; render(); } else finish(1); }
  }
  function finish(w){ over=true; clear(); msg = w===0 ? '<span class="win">The computer is out of cards. You win!</span>' : '<span class="lose">You ran out of cards. The computer wins.</span>'; render(); }
  function afterChange(){
    render();
    const v=pv;
    if(slappable() && Math.random() > 0.12) later(() => { if(pv===v && !over) slap(1); }, react*(0.7+Math.random()*0.6));
    if(turn===1) later(() => { if(pv===v && !over) flip(1); }, 650 + Math.random()*350);
  }
  function bindKeys(){
    if(keyH) return;
    keyH = e => { if(e.code==='Space' || e.key==='s'){ e.preventDefault(); slap(0); } else if(e.key==='Enter' || e.key==='f'){ e.preventDefault(); flip(0); } };
    window.addEventListener('keydown', keyH);
  }
  function render(){
    wrap.innerHTML='';
    wrap.appendChild(h('div','sp-meta', `<span class="pill">Computer · ${hands[1].length} cards</span>`));
    const p = h('div','rat-pile');
    const shown = pile.slice(-3);
    if(!shown.length) p.appendChild(h('div','slot'));
    shown.forEach((c,i) => { const el=cardEl(c); el.classList.add('abs'); el.style.left=`calc(var(--cw) * ${i*0.42})`; el.style.transform=`rotate(${[-6,3,-2][i]}deg)`; if(i===shown.length-1) el.classList.add('land'); p.appendChild(el); });
    p.addEventListener('pointerdown', e => { e.preventDefault(); slap(0); });
    wrap.appendChild(p);
    wrap.appendChild(h('div','label', `${pile.length} in the pile${chances!=null && turn!=null ? ` · ${chances} ${chances===1?'chance':'chances'} left` : ''}`));
    const ctr = h('div','controls');
    const f = h('button','btn primary big','Flip'); f.disabled = over || turn!==0; f.addEventListener('click',()=>flip(0));
    const s = h('button','btn hot big','Slap!'); s.disabled = over || !pile.length; s.addEventListener('pointerdown', e => { e.preventDefault(); slap(0); });
    ctr.append(f, s); wrap.appendChild(ctr);
    wrap.appendChild(h('div','sp-meta', `<span class="pill">You · ${hands[0].length} cards</span><kbd>Enter flips · Space slaps · or tap the pile</kbd>`));
    if(over){ const b=h('button','btn primary','Play again'); b.addEventListener('click', newGame); wrap.appendChild(b); }
    ui.status(msg);
  }
  return { newGame, stop(){ clear(); if(keyH){ window.removeEventListener('keydown', keyH); keyH=null; } } };
}

buildMenu(); route();
})();
</script>
<script>
// Offline support: cache the table so it opens with no signal (online play still needs a connection).
if('serviceWorker' in navigator && location.protocol !== 'file:'){
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
</script>
