<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Shuffle Club</title>
<meta name="description" content="Ten card games on one table. Race the computer, pass the phone, or play a friend online.">
<meta name="theme-color" content="#2443d6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Shuffle Club">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: a printed-poster card table. Cobalt halftone ground, cream card stock, ink outlines with hard offset shadows,
   tomato + butter as the two inks. Menu is a loose spread of oversized "game cards"; each game is one centred table column.
   Single committed look (works on any host theme). */
:root{
  --cobalt:#2443d6; --cobalt-deep:#172d9c; --dot:#3a58ec;
  --paper:#fff3d6; --paper-2:#f6e6bf; --ink:#15131c;
  --tomato:#ff4b2b; --red-suit:#d8321a; --butter:#ffd23f;
  --text:#fff8e6; --muted:#c9d1ff;
  --good:#9df2b0; --bad:#ffb4a3;
  --display:"Big Shoulders Display", "Oswald", "Arial Narrow", Impact, sans-serif;
  --body:"Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --line:3px solid var(--ink);
  --pop:4px 4px 0 var(--ink);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  background-color:var(--cobalt);
  background-image:radial-gradient(var(--dot) 1.2px, transparent 1.6px);
  background-size:9px 9px;
  color:var(--text);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-top:max(18px, calc(env(safe-area-inset-top, 0px) + 10px));padding-bottom:max(48px, calc(env(safe-area-inset-bottom, 0px) + 24px));
  -webkit-tap-highlight-color:transparent;
}
.wrap{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--butter);outline-offset:3px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;text-transform:uppercase;line-height:.9}

/* Masthead */
.mast{display:flex;align-items:flex-end;justify-content:space-between;gap:10px 18px;flex-wrap:wrap}
.mast h1{font-size:clamp(46px,11vw,92px);font-weight:900;color:var(--butter);letter-spacing:.01em;
  text-shadow:3px 3px 0 var(--ink), 6px 6px 0 var(--tomato);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill}
.mast p{margin:0 0 6px;max-width:28ch;font-weight:500;color:var(--paper)}
.mast.small h1{font-size:34px;text-shadow:2px 2px 0 var(--ink), 4px 4px 0 var(--tomato);-webkit-text-stroke:1.5px var(--ink)}
.mast.small p{display:none}

/* Menu: spread of game cards */
.spread{display:flex;flex-wrap:wrap;justify-content:center;gap:22px 18px;padding-block:8px}
.gcard{position:relative;width:min(220px, calc(50% - 9px));aspect-ratio:5/7;background:var(--paper);color:var(--ink);border:var(--line);border-radius:14px;
  box-shadow:var(--pop);text-align:left;padding:12px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;
  transition:transform .18s cubic-bezier(.3,1.6,.5,1), box-shadow .18s}
.gcard:nth-child(odd){transform:rotate(-2.5deg)} .gcard:nth-child(even){transform:rotate(2deg) translateY(6px)}
.gcard:hover,.gcard:focus-visible{transform:rotate(0) translateY(-6px);box-shadow:7px 9px 0 var(--ink)}
.gcard .glyph{font-family:var(--display);font-weight:900;font-size:clamp(64px,15vw,104px);line-height:.82;letter-spacing:-.02em}
.gcard .glyph.r{color:var(--red-suit)}
.gcard .corner{position:absolute;right:-14px;bottom:-34px;font-size:150px;line-height:1;opacity:.12;pointer-events:none}
.gcard h2{font-size:30px;font-weight:900}
.gcard p{margin:4px 0 0;font-size:12.5px;line-height:1.35;color:#3b3546}
.gcard .tag{display:inline-block;margin-top:8px;font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;border:2px solid var(--ink);border-radius:999px;padding:1px 8px}
.gcard.hero{background:var(--tomato);color:var(--ink)}
.gcard.hero p{color:var(--ink)}
.gcard.hero .tag{background:var(--butter)}
.note{color:var(--muted);font-size:13px;margin:0;text-align:center}
/* Install ticket: a torn-stub strip under the spread, only shown when the browser can install */
.ticket{display:flex;align-items:center;gap:12px 16px;flex-wrap:wrap;justify-content:space-between;margin:20px auto 0;max-width:560px;
  background:var(--ink);color:var(--paper);border:var(--line);border-radius:14px;padding:12px 14px 12px 18px;box-shadow:4px 4px 0 var(--tomato);
  -webkit-mask:radial-gradient(circle 9px at 0 50%, #0000 98%, #000) left/51% 100% no-repeat, radial-gradient(circle 9px at 100% 50%, #0000 98%, #000) right/51% 100% no-repeat}
.ticket[hidden]{display:none}
.ticket b{font-family:var(--display);font-size:22px;font-weight:900;text-transform:uppercase;color:var(--butter);letter-spacing:.02em;display:block;line-height:1}
.ticket span{font-size:13px;color:var(--muted)}
.ticket .row{display:flex;gap:8px;align-items:center}
.ticket .x{background:none;border:0;color:var(--muted);font-size:13px;text-decoration:underline;padding:6px}

/* Game chrome */
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bar h2{font-size:clamp(34px,8vw,48px);font-weight:900;flex:1;min-width:0;color:var(--paper)}
.btn{background:var(--paper);color:var(--ink);border:var(--line);border-radius:10px;padding:7px 14px;font-weight:700;font-size:14px;box-shadow:3px 3px 0 var(--ink);transition:transform .08s, box-shadow .08s}
.btn:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.btn:active:not(:disabled){transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.primary{background:var(--butter)}
.btn.hot{background:var(--tomato)}
.btn.big{font-family:var(--display);font-size:24px;font-weight:900;text-transform:uppercase;padding:10px 22px;letter-spacing:.02em}
.btn:disabled{opacity:.45;cursor:not-allowed}
.status{background:var(--ink);color:var(--paper);border-radius:12px;padding:10px 14px;min-height:46px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.status b{color:var(--butter)}
.status .win,.win{color:var(--good)} .status .lose,.lose{color:var(--bad)}
details.rules{font-size:14px;background:var(--cobalt-deep);border:2px solid var(--ink);border-radius:12px;padding:8px 14px}
details.rules summary{cursor:pointer;font-weight:600}
details.rules p{margin:8px 0;max-width:65ch;color:var(--paper)}
.board{position:relative;min-height:300px}
.controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.label{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* Cards: poster style. Rank strip top-left, oversized cropped suit (or outlined court letter) bottom-right. */
.card{--h:calc(var(--cw) * 1.4);width:var(--cw);height:var(--h);border-radius:calc(var(--cw) * .1);background:var(--paper);color:var(--ink);
  position:relative;flex:none;overflow:hidden;border:2px solid var(--ink);box-shadow:2px 3px 0 #15131c66;
  font-family:var(--display);font-weight:900;user-select:none;-webkit-user-select:none;transition:transform .12s, box-shadow .12s}
.card.red{color:var(--red-suit)}
.card .idx{position:absolute;top:calc(var(--cw) * .04);left:calc(var(--cw) * .08);font-size:calc(var(--cw) * .34);line-height:1;letter-spacing:-.02em;display:flex;align-items:baseline;gap:.04em}
.card .idx b{font-family:var(--body);font-size:.66em;font-weight:400}
.card .big{position:absolute;right:calc(var(--cw) * -.1);bottom:calc(var(--cw) * -.3);font-family:var(--body);font-size:calc(var(--cw) * 1.08);line-height:1}
.card .big.court{font-family:var(--display);font-weight:900;font-size:calc(var(--cw) * 1.05);right:calc(var(--cw) * -.06);bottom:calc(var(--cw) * -.2);color:transparent;-webkit-text-stroke:2px currentColor}
.card.red .big.court{-webkit-text-stroke-color:var(--red-suit)}
.card .big.ace{right:auto;left:50%;bottom:50%;transform:translate(-50%,58%);font-size:calc(var(--cw) * .9)}
.card.back{background-color:var(--tomato);background-image:radial-gradient(var(--butter) 22%, transparent 26%);background-size:calc(var(--cw) * .16) calc(var(--cw) * .16);
  box-shadow:inset 0 0 0 calc(var(--cw) * .05) var(--paper), 2px 3px 0 #15131c66}
.card.back::after{content:"";position:absolute;inset:26% 22%;border-radius:50%;background:var(--ink);box-shadow:0 0 0 calc(var(--cw) * .04) var(--paper)}
.card.sel{box-shadow:0 0 0 3px var(--butter), 4px 6px 0 var(--ink);transform:translateY(-4px)}
.card.can{cursor:pointer}
.card.can:hover{transform:translateY(-4px)}
.card.dim{filter:saturate(.4) brightness(.8)}
.slot{width:var(--cw);height:calc(var(--cw) * 1.4);border-radius:calc(var(--cw) * .1);border:2px dashed #ffffff66;position:relative;display:grid;place-items:center;color:#ffffff88;font-family:var(--display);font-weight:900;font-size:calc(var(--cw) * .42)}
.slot.hot{border-color:var(--butter);color:var(--butter)}
.abs{position:absolute;left:0}

/* Klondike */
.kl{--cw:min(84px, calc((min(100vw, 780px) - 32px - 6 * 8px) / 7));display:flex;flex-direction:column;gap:20px}
.kl .row{display:grid;grid-template-columns:repeat(7,var(--cw));gap:8px;justify-content:center}
.kl .pile{position:relative;width:var(--cw)}
.kl .stock{cursor:pointer}
.kl .count{position:absolute;bottom:-19px;left:0;right:0;text-align:center;font-size:11px;color:var(--muted);font-family:var(--body);font-weight:600}

/* Hands (Blackjack / War / Eights) */
.felt{--cw:min(80px, 19vw);display:flex;flex-direction:column;gap:18px;align-items:center}
.seat{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%}
.hand{display:flex;justify-content:center;min-height:calc(var(--cw) * 1.4);padding-inline:calc(var(--cw) * .2)}
.hand.overlap .card + .card{margin-left:calc(var(--cw) * -.5)}
.hand.wrapgap{flex-wrap:wrap;gap:6px}
.total{font-family:var(--display);font-size:22px;font-weight:900;color:var(--paper);font-variant-numeric:tabular-nums}
.chips{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.chip{width:58px;height:58px;border-radius:50%;border:var(--line);font-family:var(--display);font-weight:900;font-size:20px;display:grid;place-items:center;box-shadow:3px 3px 0 var(--ink);
  background-image:repeating-conic-gradient(#fff3d6 0 12deg, transparent 12deg 45deg);color:var(--ink);transition:transform .12s}
.chip:hover:not(:disabled){transform:translateY(-3px) rotate(8deg)}
.chip:disabled{opacity:.35;cursor:not-allowed}
.chip.c5{background-color:var(--tomato)}.chip.c10{background-color:#7cc6ff}.chip.c25{background-color:#8be0a4}.chip.c100{background-color:var(--butter)}
.bank{display:flex;gap:22px;justify-content:center;font-variant-numeric:tabular-nums}
.bank div{text-align:center}
.bank strong{display:block;font-family:var(--display);font-size:30px;font-weight:900;color:var(--butter);line-height:1}
.mid{display:flex;align-items:center;justify-content:center;gap:22px;flex-wrap:wrap}
.suitpick{display:flex;gap:8px;justify-content:center}
.suitpick button{width:54px;height:54px;border-radius:12px;background:var(--paper);border:var(--line);box-shadow:3px 3px 0 var(--ink);font-size:28px;color:var(--ink)}
.suitpick button.r{color:var(--red-suit)}
.suitbadge{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.suitbadge span{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:8px;background:var(--paper);border:2px solid var(--ink);color:var(--ink);font-size:18px;margin-left:6px;vertical-align:middle;letter-spacing:0}
.suitbadge span.r{color:var(--red-suit)}

.bj-shoe{--cw:34px;position:absolute;right:0;top:0;transform:rotate(8deg)}
.bj-tray{position:absolute;left:0;top:0;width:34px;height:48px;border:2px dashed #ffffff33;border-radius:5px;transform:rotate(-6deg)}
.felt{position:relative}
.stack{position:relative;width:var(--cw);height:calc(var(--cw) * 1.4)}
.stack .card{position:absolute;left:0;top:0}
.stack .under{filter:brightness(.92)}
/* Memory */
.mem{--cw:min(84px, calc((min(100vw, 780px) - 32px - 3 * 10px) / 4));position:relative;display:grid;grid-template-columns:repeat(4,var(--cw));gap:10px;justify-content:center}
.mem .card{cursor:pointer}
.mem-deck{position:absolute;left:50%;top:50%;width:2px;height:2px;pointer-events:none}
.mem .card.done{opacity:.3;cursor:default}

/* ---------- Speed ---------- */
.speed{--cw:min(100px, calc((min(100vw, 780px) - 32px - 4 * 10px) / 5));display:flex;flex-direction:column;align-items:center;gap:14px;position:relative}
.sp-modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;width:100%}
.mode{background:var(--paper);color:var(--ink);border:var(--line);border-radius:14px;box-shadow:var(--pop);padding:16px;display:flex;flex-direction:column;gap:10px}
.mode h3{font-size:32px;font-weight:900}
.mode p{margin:0;font-size:13.5px;color:#3b3546}
.mode .row{display:flex;gap:8px;flex-wrap:wrap}
.mode .btn{box-shadow:2px 2px 0 var(--ink)}
.mode.alt{background:var(--butter)}
.mode.dark{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.mode.dark p{color:var(--muted)}
.mode input{font:inherit;font-family:var(--display);font-weight:900;font-size:26px;letter-spacing:.2em;text-transform:uppercase;width:7.5ch;padding:4px 10px;border:var(--line);border-radius:10px;background:var(--paper);color:var(--ink)}
.code{font-family:var(--display);font-weight:900;font-size:64px;letter-spacing:.14em;color:var(--butter);line-height:1;text-shadow:3px 3px 0 var(--ink)}
.sp-side{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%}
.sp-side.flip{transform:rotate(180deg)}
.sp-hand{display:grid;grid-template-columns:repeat(5,var(--cw));gap:10px;justify-content:center;min-height:calc(var(--cw) * 1.4)}
.sp-hand .card{cursor:grab}
.sp-hand .card.live{box-shadow:0 0 0 3px var(--butter), 3px 4px 0 var(--ink)}
.sp-hand .card.sel{transform:translateY(-10px)}
.sp-side.flip .sp-hand .card.sel{transform:translateY(-10px)}
.sp-hand .card.nope{animation:nope .3s}
.sp-hand.fumble .card{filter:grayscale(.7) brightness(.8);cursor:not-allowed}
.slot.gap{border-color:#ffffff26}
.sp-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;font-weight:600;font-size:13px;color:var(--paper)}
.sp-meta .pill{background:var(--ink);border-radius:999px;padding:2px 10px;font-variant-numeric:tabular-nums}
.sp-meta .pill.bad{background:var(--tomato);color:var(--ink)}
.sp-meta kbd{font:inherit;font-size:11px;color:var(--muted)}
@media (hover:none){ .sp-meta kbd{display:none} }
.sp-draw{--cw:30px;display:flex;align-items:center;gap:5px;font-variant-numeric:tabular-nums}
.sp-draw .card{box-shadow:2px 2px 0 var(--ink)}
.sp-draw .n{font-size:12px;min-width:2ch}
.hint-toggle{background:none;border:2px solid #ffffff55;border-radius:999px;padding:0 9px;font-size:11.5px;font-weight:700;letter-spacing:.04em;color:var(--muted)}
.hint-toggle.on{background:var(--butter);border-color:var(--ink);color:var(--ink)}
.sp-opp{--ow:min(54px, 12vw);display:grid;grid-template-columns:repeat(5,var(--ow));gap:6px;justify-content:center;min-height:calc(var(--ow) * 1.4)}
.sp-opp .card,.sp-opp .slot{--cw:var(--ow)}
.sp-opp .card{transition:transform .2s cubic-bezier(.3,1.5,.5,1)}
.sp-opp .card.reach{transform:translateY(16px) rotate(-5deg);box-shadow:0 0 0 3px var(--tomato), 3px 4px 0 var(--ink)}
.sp-center{display:grid;grid-template-columns:repeat(4,var(--cw));gap:10px;justify-content:center;align-items:end;padding-block:6px}
.sp-pile{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px}
.sp-pile .n{font-size:11px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.sp-pile.center{cursor:pointer;padding:4px;margin:-4px}
.sp-stack{position:relative;width:var(--cw);height:calc(var(--cw) * 1.4)}
.sp-stack .card{position:absolute;left:0;top:0}
.sp-stack .under{filter:brightness(.92)}
.sp-banner{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:5}
.sp-banner span{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:clamp(56px,16vw,120px);color:var(--butter);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:5px 5px 0 var(--tomato);animation:bang .4s cubic-bezier(.3,1.6,.5,1)}
.sp-banner.small span{font-size:clamp(34px,9vw,64px)}
.sp-over{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;background:var(--paper);color:var(--ink);border:var(--line);border-radius:16px;box-shadow:var(--pop);padding:22px;max-width:420px;width:100%}
.sp-over h3{font-size:56px;font-weight:900}
.sp-over p{margin:0}

/* ---------- Hold'em ---------- */
.pk{--cw:min(74px, calc((min(100vw, 780px) - 32px - 4 * 8px) / 5));display:flex;flex-direction:column;gap:16px;align-items:center}
.pk-opps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%}
.pk-seat{background:var(--cobalt-deep);border:2px solid var(--ink);border-radius:12px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;transition:transform .15s}
.pk-seat .pk-hole{--cw:min(42px, 10vw)}
.pk-seat.turn,.pk-you.turn{box-shadow:0 0 0 3px var(--butter);transform:translateY(-2px)}
.pk-seat.folded,.pk-seat.out{opacity:.45}
.pk-seat.won,.pk-you .pk-act:not(:empty){}
.pk-hole{display:flex;gap:4px}
.pk-hole.big{--cw:min(92px, 22vw);gap:8px}
.pk-name{font-family:var(--display);font-weight:900;font-size:20px;text-transform:uppercase;line-height:1;display:flex;align-items:center;gap:6px}
.dbtn{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--paper);color:var(--ink);border:2px solid var(--ink);font-size:12px;font-family:var(--body);font-weight:700}
.pk-chips,.pk-stack{font-family:var(--display);font-weight:900;font-size:22px;color:var(--butter);font-variant-numeric:tabular-nums;line-height:1}
.pk-stack{font-size:30px}
.pk-act{font-size:12px;font-weight:600;color:var(--paper);background:var(--ink);border-radius:999px;padding:1px 9px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.pk-seat.won .pk-act,.pk-you.won .pk-act{background:var(--good);color:var(--ink)}
.pk-hn{font-size:12px;font-weight:600;color:var(--muted);text-align:center}
.pk-mid{display:flex;flex-direction:column;align-items:center;gap:8px;background:#15131c33;border:2px dashed #ffffff44;border-radius:999px;padding:14px 28px;max-width:100%}
.pk-pot{display:flex;align-items:baseline;gap:8px}
.pk-pot strong{font-family:var(--display);font-weight:900;font-size:38px;color:var(--butter);line-height:1;text-shadow:2px 2px 0 var(--ink)}
.pk-board{display:grid;grid-template-columns:repeat(5,var(--cw));gap:8px}
.pk-you{display:flex;align-items:center;gap:16px;background:var(--cobalt-deep);border:2px solid var(--ink);border-radius:14px;padding:10px 14px;transition:transform .15s}
.pk-you.folded .pk-hole{opacity:.45}
.pk-info{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-width:0}
.pk-info .pk-hn{text-align:left;color:var(--paper);font-size:13px}
.pk-ctrl{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;min-height:60px}
.pk-size{display:flex;flex-direction:column;align-items:center;gap:8px;width:min(100%,420px)}
.pk-size input{width:100%;accent-color:var(--tomato)}
.pk-quick{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.pk-quick .btn{padding:4px 10px;font-size:12.5px;box-shadow:2px 2px 0 var(--ink)}
@media (max-width:480px){ .pk-mid{border-radius:18px;padding:10px 12px} .pk-name{font-size:16px} .pk-chips{font-size:18px} }

/* ---------- Golf ---------- */
.golf{--cw:min(74px, 18vw);display:flex;flex-direction:column;gap:16px;align-items:center}
.golf-grid{display:grid;grid-template-columns:repeat(3,var(--cw));gap:8px}
.golf .live{box-shadow:0 0 0 3px var(--butter), 3px 4px 0 var(--ink)}
.golf .mid{align-items:flex-start}
.golf-held .slot{opacity:.35}

/* ---------- Ratscrew ---------- */
.rat{--cw:min(110px, 26vw);display:flex;flex-direction:column;align-items:center;gap:14px}
.rat-pile{position:relative;width:calc(var(--cw) * 1.9);height:calc(var(--cw) * 1.55);cursor:pointer;touch-action:manipulation}
.rat-pile .slot{margin:0 auto}

/* ---------- Gin Rummy ---------- */
.gin{--cw:min(68px, 16vw);display:flex;flex-direction:column;gap:16px;align-items:center}
.gin-hand{display:flex;flex-wrap:wrap;justify-content:center;gap:12px 14px;min-height:calc(var(--cw) * 1.4)}
.gin-group{display:flex;padding:4px;border-radius:12px}
.gin-group .card + .card{margin-left:calc(var(--cw) * -.48)}
.gin-group.meld{background:var(--butter);border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink)}
.gin-group.dead{background:#15131c40;border:2px dashed #ffffff55}
.gin .live{box-shadow:0 0 0 3px var(--butter), 3px 4px 0 var(--ink)}
.gin .card.sel{transform:translateY(-12px)}
.gin .hand.overlap .card + .card{margin-left:calc(var(--cw) * -.62)}
.fx-layer{position:fixed;inset:0;pointer-events:none;z-index:60}
.fx-layer .card{position:absolute}
.drag-ghost{position:fixed;z-index:70;pointer-events:none;filter:drop-shadow(5px 9px 0 #15131c55)}
.card.lifted{opacity:.22}
[data-drop]{border-radius:12px;transition:box-shadow .12s, transform .12s}
[data-drop].over{box-shadow:0 0 0 4px var(--butter), 0 0 0 7px var(--ink);transform:scale(1.04)}
@keyframes bang{from{transform:scale(.4) rotate(-12deg);opacity:0}to{transform:none;opacity:1}}
@keyframes nope{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.flash{animation:nope .4s}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<script src="vendor/peerjs.min.js"></script>
<script src="js/net.js"></script>
</head>
<body>

<div class="wrap">
  <header class="mast" id="mast">
    <h1>Shuffle Club</h1>
    <p>Ten card games on one table. Race the computer, pass the phone, or play a friend online.</p>
  </header>

  <main id="menu">
    <div class="spread" id="tiles"></div>
    <div class="ticket" id="install" hidden>
      <div><b>Take the table with you</b><span id="installhow">Add Shuffle Club to your home screen. It opens full screen and works offline.</span></div>
      <div class="row"><button class="btn primary" id="installbtn">Install</button><button class="x" id="installno">Not now</button></div>
    </div>
    <p class="note" style="margin-top:18px">Scores and bankroll are saved on this device only</p>
  </main>

  <main id="game" hidden>
    <div style="display:flex;flex-direction:column;gap:14px">
      <div class="bar">
        <button class="btn" id="back" aria-label="Back to all games">← All games</button>
        <h2 id="gtitle"></h2>
        <button class="btn primary" id="newgame">New game</button>
      </div>
      <details class="rules" id="rules"><summary>How to play</summary><div id="rulestext"></div></details>
      <div class="board" id="board"></div>
      <div class="status" id="status"></div>
    </div>
  </main>
</div>
<script>
(() => {
// ---------- Shared card helpers ----------
const SUITS = ['♠','♥','♦','♣'];
const T = '︎'; // force text (not emoji) rendering of suit glyphs
const isRed = s => s === '♥' || s === '♦';
const rankLabel = r => ({1:'A',11:'J',12:'Q',13:'K'})[r] || String(r);
function makeDeck(n = 1){ const d=[]; for(let k=0;k<n;k++) for(const s of SUITS) for(let r=1;r<=13;r++) d.push({s,r,up:false}); return d; }
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function cardEl(c, up = c.up){
  const el = document.createElement('div');
  const id = cidOf(c);
  if(!up){ el.className='card back'; el.setAttribute('aria-label','face-down card'); }
  else {
    el.className = 'card' + (isRed(c.s) ? ' red' : '');
    const L = rankLabel(c.r);
    const big = c.r > 10 ? `<span class="big court">${L}</span>` : `<span class="big${c.r===1?' ace':''}">${c.s}${T}</span>`;
    el.innerHTML = `<span class="idx">${L}<b>${c.s}${T}</b></span>${big}`;
    el.setAttribute('aria-label', `${L} of ${c.s}`);
  }
  if(id){ el.dataset.cid = id; if(lifted.has(id)) el.classList.add('lifted'); }
  return el;
}
const h = (tag, cls, html) => { const e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e; };
const store = {
  get(k, d){ try{ const v=localStorage.getItem('shuffle:'+k); return v==null?d:JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('shuffle:'+k, JSON.stringify(v)); }catch(e){} }
};
// ---------- Card motion ----------
// Tables re-render from scratch, so cards move FLIP-style: note where every known card sits, rebuild,
// then fly each card from its old spot to its new one. A card that wasn't on the table yet flies in
// from the element named by its data-from (a deck, a draw pile). Nothing ever just appears.
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
const lifted = new Set();      // card ids being dragged (drawn faded in place)
const flyFrom = new Map();     // card id -> rect it should start from on the next frame (a drag release)
let cidN = 0;
const cidOf = c => (c && c.s) ? (c._id || (c._id = 'k' + (++cidN))) : null;
const centre = r => [r.left + r.width/2, r.top + r.height/2];
let fxLayer = null;
const fxl = () => { if(!fxLayer || !fxLayer.isConnected){ fxLayer = document.createElement('div'); fxLayer.className = 'fx-layer'; document.body.appendChild(fxLayer); } return fxLayer; };
const EASE = 'cubic-bezier(.2,.75,.25,1)';

function Motion(wrap){
  let snap = new Map(), until = 0, stagger = 0, sink = null;
  function capture(){
    snap = new Map();
    wrap.querySelectorAll('[data-cid]').forEach(el => snap.set(el.dataset.cid, {r:el.getBoundingClientRect(), up:!el.classList.contains('back'), el}));
  }
  function fly(el, from, delay, flip, point){
    const to = el.getBoundingClientRect(); if(!to.width || !from.width) return;
    const [fx,fy] = centre(from), [tx,ty] = centre(to);
    const dx = fx-tx, dy = fy-ty, s = point ? .9 : from.width/to.width;
    if(Math.abs(dx)<1 && Math.abs(dy)<1 && Math.abs(s-1)<.02 && !flip) return;
    const dur = Math.round(Math.min(480, 230 + Math.hypot(dx,dy)*.3));
    const start = `translate(${dx}px,${dy}px) scale(${s})`;
    const frames = flip
      ? [{transform:start}, {transform:`translate(${dx/2}px,${dy/2}px) scale(${(s+1)/2}) scaleX(.04)`, offset:.45}, {transform:'translate(0,0)'}]
      : [{transform:start}, {transform:'translate(0,0)'}];
    el.style.zIndex = 30;
    const a = el.animate(frames, {duration:dur, delay, easing:EASE, fill:'backwards', composite:'add'});
    a.onfinish = a.oncancel = () => { el.style.zIndex = ''; };
    until = Math.max(until, performance.now() + delay + dur);
  }
  function after(){
    if(reducedMotion.matches){ flyFrom.clear(); return; }
    const anchors = {}; wrap.querySelectorAll('[data-anchor]').forEach(a => { anchors[a.dataset.anchor] = a; });
    const fresh = [], seen = new Set();
    wrap.querySelectorAll('[data-cid]').forEach((el, n) => {
      const id = el.dataset.cid, was = snap.get(id), drop = flyFrom.get(id); seen.add(id);
      if(drop){ flyFrom.delete(id); fly(el, drop, 0, false); }
      else if(was) fly(el, was.r, 0, was.up === el.classList.contains('back'));
      else if(el.dataset.from && anchors[el.dataset.from]) fresh.push([el, el.dataset.order != null ? +el.dataset.order : n]);
    });
    // An anchor marked data-point is just a spot on the table (cards keep their size), not a pile.
    fresh.sort((a,b) => a[1]-b[1]).forEach(([el], n) => { const a = anchors[el.dataset.from];
      fly(el, a.getBoundingClientRect(), n*stagger, !el.classList.contains('back'), a.dataset.point != null); });
    // Cards that left the table can be swept into a pile (a won trick, a collected stack).
    const to = sink && anchors[sink];
    if(to){
      const [sx,sy] = centre(to.getBoundingClientRect()); let n = 0;
      snap.forEach((w, id) => {
        if(seen.has(id) || !w.r.width) return;
        const g = w.el; g.classList.remove('abs','sel','live','can');
        g.style.cssText = `position:absolute;margin:0;left:${w.r.left}px;top:${w.r.top}px;--cw:${w.r.width}px`;
        fxl().appendChild(g);
        const [x,y] = centre(w.r), d = 300 + Math.min(200, Math.hypot(sx-x, sy-y)*.25), delay = (n++)*35;
        const a = g.animate([{transform:'none', opacity:1}, {transform:`translate(${sx-x}px,${sy-y}px) scale(.85) rotate(${n%2?6:-6}deg)`, opacity:.2}], {duration:d, delay, easing:EASE, fill:'both'});
        a.onfinish = a.oncancel = () => g.remove();
        until = Math.max(until, performance.now() + delay + d);
      });
    }
  }
  return {
    // Rebuild the table inside `paint`, animating everything that moved.
    run(paint){ capture(); paint(); after(); stagger = 0; sink = null; snap = new Map(); },
    deal(ms){ stagger = ms; },          // next frame: fresh cards leave their pile one after another
    sweep(anchor){ sink = anchor; },    // next frame: cards that vanish slide into this anchor
    left(){ return Math.max(0, until - performance.now()); },
    busy(){ return performance.now() < until; },
    reset(){ until = 0; }
  };
}

// Press a card and drag it onto anything marked [data-drop]. A press that barely moves is a tap.
// o.tap(), o.drop(key, rect) -> true if the move was legal, o.can() -> may this card be picked up now,
// o.group() -> the elements that travel together (a run of cards in solitaire).
function dragCard(el, o){
  el.style.touchAction = 'none';
  if(!el.hasAttribute('tabindex')) el.tabIndex = 0;
  el.addEventListener('keydown', e => { if((e.key==='Enter' || e.key===' ') && o.tap){ e.preventDefault(); e.stopPropagation(); o.tap(); } });
  el.addEventListener('pointerdown', e => {
    if(e.button > 0 || (o.can && !o.can())) return;
    e.preventDefault(); e.stopPropagation();
    const pid = e.pointerId, sx = e.clientX, sy = e.clientY;
    const els = o.group ? o.group() : [el];
    const rects = els.map(x => x.getBoundingClientRect()), ids = els.map(x => x.dataset.cid);
    const turned = !!el.closest('.flip');
    let ghost = null, over = null, targets = [], lastX = sx;
    const hit = (x, y) => {
      let best = null, bd = Infinity;
      for(const [t, r] of targets){
        const pad = 22; if(x < r.left-pad || x > r.right+pad || y < r.top-pad || y > r.bottom+pad) continue;
        const [cx, cy] = centre(r), d = Math.hypot(x-cx, y-cy); if(d < bd){ bd = d; best = t; }
      }
      return best;
    };
    const move = ev => {
      if(ev.pointerId !== pid) return;
      const dx = ev.clientX-sx, dy = ev.clientY-sy;
      if(!ghost){
        if(Math.hypot(dx, dy) < 8) return;
        ghost = document.createElement('div'); ghost.className = 'drag-ghost';
        ghost.style.left = rects[0].left + 'px'; ghost.style.top = rects[0].top + 'px';
        els.forEach((x, n) => {
          const c = x.cloneNode(true); c.classList.remove('sel','live','can','lifted','reach'); c.removeAttribute('data-cid');
          const r = rects[n];
          c.style.cssText = `position:absolute;margin:0;left:${r.left-rects[0].left}px;top:${r.top-rects[0].top}px;--cw:${r.width}px;${turned?'transform:rotate(180deg)':''}`;
          ghost.appendChild(c);
        });
        fxl().appendChild(ghost);
        ids.forEach(i => i && lifted.add(i)); els.forEach(x => x.classList.add('lifted'));
        targets = [...document.querySelectorAll('[data-drop]')].map(t => [t, t.getBoundingClientRect()]);
      }
      const tilt = Math.max(-7, Math.min(7, (ev.clientX - lastX) * .8)); lastX = ev.clientX;
      ghost.style.transform = `translate(${dx}px,${dy}px) rotate(${tilt}deg) scale(1.05)`;
      const t = hit(ev.clientX, ev.clientY);
      if(t !== over){ if(over) over.classList.remove('over'); over = t; if(t) t.classList.add('over'); }
    };
    const end = ev => {
      if(ev.pointerId !== pid) return;
      window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', end); window.removeEventListener('pointercancel', end);
      if(!ghost){ if(ev.type === 'pointerup' && o.tap) o.tap(); return; }
      if(over) over.classList.remove('over');
      ids.forEach(i => i && lifted.delete(i));
      const gr = [...ghost.children].map(c => c.getBoundingClientRect());
      let ok = false;
      if(over && ev.type === 'pointerup'){
        ids.forEach((i, n) => i && flyFrom.set(i, gr[n]));
        ok = !!o.drop(over.dataset.drop, gr[0]);
        ids.forEach(i => i && flyFrom.delete(i));
      }
      if(ok){ ghost.remove(); return; }
      // Not a legal spot: the card goes back where it came from.
      const home = ids.map(i => i && document.querySelector(`#board [data-cid="${i}"]`)).filter(Boolean);
      home.forEach(x => x.classList.add('lifted'));
      const r = home[0] ? home[0].getBoundingClientRect() : rects[0];
      const a = ghost.animate([{transform:ghost.style.transform}, {transform:`translate(${r.left-rects[0].left}px,${r.top-rects[0].top}px)`}], {duration:220, easing:EASE, fill:'forwards'});
      a.onfinish = a.oncancel = () => { ghost.remove(); home.forEach(x => x.classList.remove('lifted')); };
    };
    window.addEventListener('pointermove', move); window.addEventListener('pointerup', end); window.addEventListener('pointercancel', end);
  });
}
// Online play. Uses direct peer-to-peer tables (js/net.js); falls back to the claude.ai live room
// when the page runs as an artifact there. Resolves to null when neither is available.
let roomP = null;
const getRoom = () => roomP || (roomP =
  (window.ShuffleNet && window.ShuffleNet.available()) ? Promise.resolve(window.ShuffleNet)
  : (window.claude && window.claude.use) ? window.claude.use('room').catch(() => null)
  : Promise.resolve(null));

// ---------- Games ----------
const GAMES = {
  speed: { name:'Speed', glyph:'±1', red:true, players:'Real-time · 2 players', blurb:'Lay cards one up or one down onto the centre. Quick hands, quicker eyes.', hero:true,
    rules:`<p>Both players race at once. Play a card from your five onto a centre pile that is one higher or one lower (Aces wrap to Kings, suits don't matter). You choose the pile: drag the card onto it, or tap the card and then tap the pile.</p><p>Put a card on a pile it doesn't fit and you fumble: your hand freezes for a moment. After each play you pick up a replacement from your draw pile, one card at a time, so plan your next move while it lands.</p><p>When nobody can move, both side piles flip a fresh card onto the centre. First to play out every card wins.</p><p>Keyboard: 1 to 5 picks up a card, then ← or → (or A / D) lays it on the left or right pile. On one screen the top player uses 6 to 0, then J or L.</p>`,
    make: Speed },
  holdem: { name:"Texas Hold'em", glyph:'AK', red:true, players:'You vs 3 computer players', blurb:'No-limit poker. Two cards, five on the board, all the bluffing.',
    rules:`<p>Everyone gets two private cards; five shared cards come out over the flop (3), turn (1) and river (1). Make the best five-card hand from any of your seven.</p><p>Each round you can fold, check or call, or bet and raise. Use the slider or the quick sizes for raises. Blinds are 10 and 20 and everyone starts with 1,000. Knock out all three computer players to clear the table.</p>`,
    make: Holdem },
  ratscrew: { name:'Ratscrew', glyph:'SLAP', red:false, players:'Real-time · you vs computer', blurb:'Flip, fight with face cards, slap doubles and sandwiches.',
    rules:`<p>Take turns flipping your top card onto the pile. When someone flips a face card or Ace, the other player gets 1 chance for a Jack, 2 for a Queen, 3 for a King or 4 for an Ace to flip a face card of their own. If they can't, the face-card player takes the pile.</p><p>Anyone can slap the pile at any time when the top two cards match (a double) or the top and third cards match (a sandwich). First slap takes the pile. A wrong slap costs you a card. Win by holding all 52.</p><p>A wrong slap costs a card and keeps your hand off the pile for a moment. Keys: Enter flips, Space slaps.</p>`,
    make: Ratscrew },
  gin: { name:'Gin Rummy', glyph:'GIN', red:true, players:'You vs computer · to 100', blurb:'Draw, discard and build sets and runs. Knock low or go gin.',
    rules:`<p>You each get 10 cards. On your turn, draw from the deck or take the top discard, then throw one card away. Build melds: sets of 3 or 4 of the same rank, or runs of 3+ in one suit (Ace is low). Cards not in a meld are deadwood: Aces 1, number cards face value, faces 10.</p><p>Once your deadwood is 10 or less you can knock to end the hand. Your opponent can lay off cards onto your melds. Lower deadwood scores the difference. If they tie or beat you, that's an undercut and they get a 25 bonus. Knock with zero deadwood for gin: 25 plus their deadwood, no lay-offs. First to 100 wins.</p><p>To discard, pick a card and tap the discard pile, or drag the card onto it. Your hand groups itself: yellow trays are melds, the dashed tray is deadwood.</p>`,
    make: Gin },
  klondike: { name:'Klondike', glyph:'A–K', players:'Solo patience', blurb:'Build four suits from Ace to King.',
    rules:`<p>Move cards between the seven columns in descending order, alternating red and black. Only a King can fill an empty column. Build each foundation (top right) up by suit from Ace to King.</p><p>Drag a card (and everything on top of it) to where it should go, or tap it and then tap the pile. Tap a picked-up card again to put it back down. Tap the deck to turn over a card; when it runs out, tap again to recycle.</p>`,
    make: Klondike },
  blackjack: { name:'Blackjack', glyph:'21', players:'You vs dealer', blurb:'Get closer to 21 than the dealer without busting.',
    rules:`<p>Place a bet with the chips and deal. Number cards count face value, J/Q/K count 10, Aces count 1 or 11. Hit to take a card, Stand to hold, Double to double your bet and take exactly one more card.</p><p>The dealer draws to 17 and stands on all 17s. A two-card 21 pays 3 to 2. Four decks are shuffled together.</p>`,
    make: Blackjack },
  golf: { name:'Golf', glyph:'−2', red:true, players:'9 holes · you vs computer', blurb:'Lowest score wins. Swap, flip, and pair up your columns.',
    rules:`<p>You each have six cards face down in two rows. Turn two over to start. On your turn, draw from the deck or take the top discard, then swap it for any card in your grid. A card drawn from the deck can be thrown away instead, and then you turn one face-down card over.</p><p>When someone has all six cards face up, the other player gets one last turn. Scoring: Ace 1, number cards face value, 2s are minus 2, Jacks and Queens 10, Kings 0. Two matching cards in the same column score 0. Lowest total after nine holes wins.</p>`,
    make: Golf },
  eights: { name:'Crazy Eights', glyph:'8', red:true, players:'You vs computer', blurb:'Match suit or rank. Eights are wild.',
    rules:`<p>Play a card that matches the top of the discard pile by suit or rank: tap it, or drag it onto the pile. Any 8 can be played at any time, and you choose the next suit. If you can't play, tap the deck to draw; once you've drawn, you may pass.</p><p>First player to get rid of every card wins.</p>`,
    make: Eights },
  war: { name:'War', glyph:'VS', players:'You vs computer', blurb:'Flip, compare, collect. Ties start a war.',
    rules:`<p>The deck is split in half. Each round both players flip their top card and the higher rank takes both (Aces are high). On a tie, each player lays three cards face down and one face up; the higher face-up card wins the whole pile.</p><p>Collect all 52 cards to win.</p>`,
    make: War },
  memory: { name:'Memory', glyph:'2×', red:true, players:'Solo', blurb:'Find all eight pairs in as few turns as you can.',
    rules:`<p>Sixteen cards are dealt face down: eight matching pairs. Turn over two per move. A match stays face up; a miss flips back. Clear the table in as few moves as you can.</p>`,
    make: Memory },
};

// ---------- App shell ----------
const $ = id => document.getElementById(id);
const board = $('board'), statusEl = $('status');
let current = null;
const ui = { status(html){ statusEl.innerHTML = html; statusEl.hidden = !html; } };

function buildMenu(){
  const tiles = $('tiles');
  for(const [key,g] of Object.entries(GAMES)){
    const b = h('button','gcard' + (g.hero ? ' hero' : ''));
    b.innerHTML = `<div class="glyph${g.red && !g.hero ? ' r':''}">${g.glyph}</div>
      <div><h2>${g.name}</h2><p>${g.blurb}</p><span class="tag">${g.hero ? 'Start here · ' : ''}${g.players}</span></div>`;
    b.setAttribute('aria-label', `${g.name}: ${g.blurb}`);
    b.addEventListener('click', () => { location.hash = key; });
    tiles.appendChild(b);
  }
}
function route(){
  if(current && current.stop) current.stop();
  const key = location.hash.slice(1);
  const g = GAMES[key];
  $('mast').classList.toggle('small', !!g);
  if(!g){ $('menu').hidden=false; $('game').hidden=true; current=null; board.innerHTML=''; return; }
  $('menu').hidden=true; $('game').hidden=false;
  $('gtitle').textContent = g.name;
  $('rulestext').innerHTML = g.rules;
  $('rules').open = false;
  board.innerHTML=''; ui.status('');
  current = g.make(board, ui);
  current.newGame();
  window.scrollTo(0,0);
}
$('back').addEventListener('click', () => { location.hash = ''; });
$('newgame').addEventListener('click', () => current && current.newGame());
window.addEventListener('hashchange', route);

// ======================= SPEED =======================
// Cards are encoded as numbers 0..51 (suit*13 + rank-1) so state is tiny enough to send over the room.
const enc = c => SUITS.indexOf(c.s)*13 + c.r - 1;
const dec = n => ({ s:SUITS[Math.floor(n/13)], r:n%13 + 1, up:true, _id:'n'+n });
// Speed runs on a physical clock, the same for you, a friend and the computer (all in ms):
// a replacement card takes `refill` to pick up and `settle` to land in your hand, one card at a time;
// a hand needs `gap` between two plays; a card put on the wrong pile freezes that hand for `fumble`.
// If the pile changed under you in the last `beaten` ms (the other player got there first), the card just comes back.
const SPEED_T = { refill:420, settle:300, gap:220, fumble:850, lift:280, beaten:600 };
const SpeedRules = {
  deal(){
    const d = shuffle(makeDeck()).map(enc), z = () => [0,0,0,0,0];
    return { h:[d.splice(0,5), d.splice(0,5)], dr:[d.splice(0,15), d.splice(0,15)], sd:[d.splice(0,6), d.splice(0,6)], c:[[],[]],
      q:[[],[]], ready:[z(),z()], next:[0,0], lock:[0,0], was:[null,null], at:[0,0], phase:'deal', n:3, winner:null, seq:0 };
  },
  fits(card, top){ if(card==null || top==null) return false; const d = Math.abs(card%13 - top%13); return d===1 || d===12; },
  top(S, k){ const p = S.c[k]; return p.length ? p[p.length-1] : null; },
  anyMove(S, p){ return S.h[p].some(c => c!=null && [0,1].some(k => SpeedRules.fits(c, SpeedRules.top(S,k)))); },
  pending(S, p){ return S.q[p].length>0 && S.dr[p].length>0; },
  // Put the card in slot i on centre pile k: 'ok', 'miss' (wrong pile: fumble), 'beaten' (it fit a moment ago) or 'busy' (hand not ready).
  play(S, p, i, k, now){
    if(S.phase!=='play' || (k!==0 && k!==1)) return 'busy';
    const card = S.h[p][i];
    if(card==null || now < S.ready[p][i] || now < S.lock[p] || now < S.next[p]) return 'busy';
    if(!SpeedRules.fits(card, SpeedRules.top(S,k))){
      if(now - S.at[k] < SPEED_T.beaten && SpeedRules.fits(card, S.was[k])) return 'beaten';
      S.lock[p] = now + SPEED_T.fumble; return 'miss';
    }
    S.was[k] = SpeedRules.top(S,k); S.at[k] = now;
    S.c[k].push(card); S.h[p][i] = null; S.q[p].push(i); S.next[p] = now + SPEED_T.gap;
    if(S.h[p].every(c => c==null) && !S.dr[p].length){ S.phase='over'; S.winner=p; }
    return 'ok';
  },
  // Pick up one card from the draw pile into the oldest empty slot.
  refill(S, p, now){
    if(!SpeedRules.pending(S,p)) return false;
    const i = S.q[p].shift(); S.h[p][i] = S.dr[p].pop(); S.ready[p][i] = now + SPEED_T.settle; return true;
  },
  flip(S){
    if(!S.sd[0].length && !S.sd[1].length){
      const pool = shuffle([...S.c[0].slice(0,-1), ...S.c[1].slice(0,-1)]);
      S.c = S.c.map(p => p.slice(-1));
      if(!pool.length){ // nothing left to flip: fewest cards remaining wins
        const left = p => S.h[p].filter(c => c!=null).length + S.dr[p].length;
        S.phase='over'; S.winner = left(0)===left(1) ? -1 : (left(0) < left(1) ? 0 : 1); return;
      }
      const half = Math.ceil(pool.length/2); S.sd = [pool.slice(0,half), pool.slice(half)];
    }
    for(const k of [0,1]) if(S.sd[k].length) S.c[k].push(S.sd[k].pop());
    S.was = [null,null];
  },
  // What a screen needs to draw (also what travels online).
  view(S, now){
    const under = x => x.length>1 ? x[x.length-2] : null;
    return { h:S.h, d:S.dr.map(x=>x.length), s:S.sd.map(x=>x.length), t:S.c.map(x=>x.length?x[x.length-1]:null), u:S.c.map(under),
      cn:S.c.map(x=>x.length), ph:S.phase, n:S.n, w:S.winner, seq:S.seq, lk:S.lock.map(t => t > now) };
  }
};

function Speed(root, ui){
  const wrap = h('div','speed'); root.appendChild(wrap);
  const fx = Motion(wrap);
  const now = () => performance.now();
  let mode=null, S=null, timers=[], think=1000, keyHandler=null, view=null;
  let sel=[null,null], selAt=[0,0], hints=store.get('speed-hints', false), myLock=0;
  let cpuTimer=null, cpuLift=null; const refillT=[null,null];
  const seenWas=[null,null], seenAt=[0,0];   // guest: what each pile showed just before it last changed
  // online state
  let room=null, net=null; // net = {role:'host'|'guest', code, guestPeer, unsubs:[]}

  const clearTimers = () => { timers.forEach(t => clearTimeout(t)); timers=[]; cpuTimer=null; cpuLift=null; refillT[0]=refillT[1]=null; };
  const later = (fn, ms) => { const t=setTimeout(fn, ms); timers.push(t); return t; };
  const me = () => mode==='guest' ? 1 : 0;
  const mine = p => mode==='local' || p===me();

  function stop(){
    clearTimers();
    if(keyHandler){ window.removeEventListener('keydown', keyHandler); keyHandler=null; }

  }

  // ----- mode picker -----
  function newGame(){
    if(mode==='cpu' || mode==='local' || (mode==='host' && net && net.guestPeer)) return start(mode);
    stop(); mode=null; S=null; view=null;
    wrap.innerHTML='';
    const modes = h('div','sp-modes');
    const cpu = h('div','mode', `<h3>vs Computer</h3><p>Race a computer opponent. It picks up and lays down cards under the same rules you do. Pick how sharp it is.</p>`);
    const row = h('div','row');
    [['Chill',1450],['Quick',950],['Ruthless',560]].forEach(([t,ms],i) => { const b=h('button','btn'+(i===1?' primary':''), t); b.addEventListener('click',()=>{ think=ms; start('cpu'); }); row.appendChild(b); });
    cpu.appendChild(row);
    const local = h('div','mode alt', `<h3>Two players, one screen</h3><p>Lay a phone or tablet flat between you. The top hand is upside down for the player across the table. Both of you drag at once.</p>`);
    const lb = h('button','btn hot','Start face-off'); lb.addEventListener('click',()=>start('local')); local.appendChild(lb);
    const online = h('div','mode dark', `<h3>Online with a friend</h3><p>One of you hosts and gets a code. The other opens this page, picks Speed, and joins with it.</p>`);
    const orow = h('div','row');
    const host = h('button','btn primary','Host a table');
    const input = h('input'); input.id='joincode'; input.maxLength=4; input.placeholder='CODE'; input.setAttribute('aria-label','Table code'); input.autocomplete='off';
    const join = h('button','btn','Join');
    orow.append(host); const jrow=h('div','row'); jrow.append(input, join);
    const onote = h('p'); onote.style.fontSize='12.5px';
    online.append(orow, jrow, onote);
    host.addEventListener('click', hostGame);
    join.addEventListener('click', () => joinGame(input.value));
    input.addEventListener('keydown', e => { if(e.key==='Enter') joinGame(input.value); });
    modes.append(cpu, local, online); wrap.appendChild(modes);
    ui.status('Pick a mode to deal in.');
    getRoom().then(r => { room=r; if(!r){ host.disabled=join.disabled=input.disabled=true; onote.textContent='Online play could not load. Check your connection and reopen Speed.'; } });
  }

  // ----- local + host game loop -----
  function start(m){
    clearTimers(); mode=m; S=SpeedRules.deal(); sel=[null,null]; myLock=0; view=null; fx.reset();
    wrap.innerHTML=''; bindKeys();
    fx.deal(75); changed();              // each player picks up five from their own pile
    later(countdown, 10*75 + 700);
  }
  function countdown(){
    S.phase='count'; S.n=3; changed();
    const tick = () => { S.n--; if(S.n>0){ changed(); later(tick, 650); } else { SpeedRules.flip(S); S.phase='play'; changed(); } };
    later(tick, 650);
  }
  function changed(){
    S.seq++;
    if(S.phase==='play' && !SpeedRules.anyMove(S,0) && !SpeedRules.anyMove(S,1) && !SpeedRules.pending(S,0) && !SpeedRules.pending(S,1)){
      S.phase='stuck'; cpuLift=null;
      later(() => { if(!S || S.phase!=='stuck') return; SpeedRules.flip(S); if(S.phase!=='over') S.phase='play'; changed(); }, 1300);
    }
    view = SpeedRules.view(S, now()); draw();
    if(net && net.role==='host' && net.room) net.room.emit('state', view).catch(()=>{});
    if(mode==='cpu' && S.phase==='play') scheduleCpu();
  }
  function scheduleRefill(p){
    if(refillT[p] || !SpeedRules.pending(S,p)) return;
    refillT[p] = later(() => {
      refillT[p] = null;
      if(!S || S.phase==='over') return;

      scheduleRefill(p);
    }, SPEED_T.refill);
  }
  // A move by p (on this device, or the guest's move arriving at the host).
  function apply(p, i, k){
    const r = SpeedRules.play(S, p, i, k, now());
    if(r==='ok'){ scheduleRefill(p); changed(); }
    else if(r==='miss'){ changed(); later(() => S && S.phase!=='over' && changed(), SPEED_T.fumble + 20); }
    return r;
  }

  // ----- the computer: looks, reaches for a card, then lays it down -----
  function scheduleCpu(ms){
    if(cpuTimer || cpuLift) return;
    cpuTimer = later(cpuLook, ms != null ? ms : think*(0.75 + Math.random()*0.5));
  }
  function cpuLook(){
    cpuTimer=null;
    if(!S || S.phase!=='play' || mode!=='cpu') return;
    const t=now(), wait=Math.max(S.lock[1], S.next[1]) - t;
    if(wait>0) return scheduleCpu(wait + 150);
    const opts=[];
    S.h[1].forEach((c,i) => { if(c==null || t<S.ready[1][i]) return; [0,1].forEach(k => { if(SpeedRules.fits(c, SpeedRules.top(S,k))) opts.push([i,k]); }); });
    if(!opts.length) return scheduleCpu(think*0.45);
    const [i,k] = opts[Math.floor(Math.random()*opts.length)];
    cpuLift = {i,k}; draw();
    later(() => {
      if(!cpuLift) return; cpuLift=null;
      if(!S || S.phase!=='play') return draw();
      apply(1, i, k);       // if you beat it to that pile, the computer fumbles too
    }, SPEED_T.lift);
  }

  // ----- your hands -----
  function pick(p, i){
    if(!view || view.ph!=='play' || view.h[p][i]==null) return;
    sel[p] = sel[p]===i ? null : i; selAt[p] = now(); draw();
  }
  function tapPile(k){
    const who = [0,1].filter(p => mine(p) && sel[p]!=null).sort((a,b) => selAt[b]-selAt[a])[0];
    if(who!=null) place(who, sel[who], k);
  }
  function place(p, i, k){
    if(!view || view.ph!=='play') return false;

      if(!SpeedRules.fits(card, view.t[k])){
        const beaten = now() - seenAt[k] < SPEED_T.beaten && SpeedRules.fits(card, seenWas[k]);
        if(!beaten){ myLock = now()+SPEED_T.fumble; later(draw, SPEED_T.fumble+20); }
        sel[p] = null; fumbled(p, card); return false;
      }
      // Show the move straight away; the host's next state confirms it.
      const v = JSON.parse(JSON.stringify(view)); v.h[p][i]=null; v.u[k]=v.t[k]; v.t[k]=card; v.cn[k]++; view=v; sel[p]=null; draw(); return true;
    }
    const r = apply(p, i, k);
    if(r!=='busy') sel[p] = null;
    if(r==='ok'){ draw(); return true; }
    if(r==='miss' || r==='beaten') fumbled(p, card);
    return false;
  }
  function fumbled(p, card){
    draw();
    const el = wrap.querySelector(`[data-cid="n${card}"]`);
    if(el){ el.classList.remove('nope'); void el.offsetWidth; el.classList.add('nope'); }
  }
  function bindKeys(){
    if(keyHandler) return;
    keyHandler = e => {
      if(e.target && e.target.tagName==='INPUT') return;
      if(e.repeat || e.metaKey || e.ctrlKey || e.altKey) return;
      const key = e.key.toLowerCase(), n = '1234567890'.indexOf(key), p = me();
      const put = (who, k) => { if(sel[who]!=null){ e.preventDefault(); place(who, sel[who], k); } };
      if(n>=0 && n<5) pick(p, n);
      else if(n>=5 && mode==='local') pick(1, n-5);
      else if(key==='arrowleft' || key==='a') put(p, 0);
      else if(key==='arrowright' || key==='d') put(p, 1);
      else if(mode==='local' && key==='j') put(1, 0);
      else if(mode==='local' && key==='l') put(1, 1);
    };
    window.addEventListener('keydown', keyHandler);
  }

  // ----- drawing -----
  const draw = () => fx.run(() => render(view, me()));
  function render(v, me){
    wrap.innerHTML='';
    if(!v) return;
    if(v.ph==='over') return renderOver(v, me);
    const opp = 1-me, t = now();
    const locked = p => (v.lk && v.lk[p]) || (p===me && mode==='guest' && myLock > t);
    const fitsNow = c => v.ph==='play' && [0,1].some(k => SpeedRules.fits(c, v.t[k]));
    const left = p => v.h[p].filter(c => c!=null).length + v.d[p];
    const drawPile = p => {
      const d = h('div','sp-draw'); d.dataset.anchor = 'd'+p;
      d.append(v.d[p] ? cardEl({}, false) : h('div','slot'), h('span','n', `${v.d[p]}`));
      d.title = 'Draw pile'; return d;
    };
    const handRow = p => {
      const row = h('div','sp-hand' + (locked(p) ? ' fumble' : ''));
      for(let i=0;i<5;i++){
        const c = v.h[p][i];
        if(c==null){ row.appendChild(h('div','slot gap')); continue; }
        const el = cardEl(dec(c)); el.dataset.from = 'd'+p; el.dataset.order = i*2 + p;
        if(hints && fitsNow(c)) el.classList.add('live');
        if(sel[p]===i) el.classList.add('sel');
        el.setAttribute('role','button');
        dragCard(el, { can: () => !!view && view.ph==='play', tap: () => pick(p, i), drop: k => place(p, i, +k) });
        row.appendChild(el);
      }
      return row;
    };
    // Top: the other player (upside-down hand in local mode, card backs otherwise)
    if(mode==='local'){
      const top = h('div','sp-side top flip');
      const meta = h('div','sp-meta'); meta.append(drawPile(opp), h('span','pill', `Player 2 · ${left(opp)} left`), h('kbd', null, '6–0, then J / L'));
      top.append(handRow(opp), meta);
      wrap.appendChild(top);
    } else {
      const top = h('div','sp-side');
      const o = h('div','sp-opp');
      for(let i=0;i<5;i++){
        const c = v.h[opp][i];
        if(c==null){ o.appendChild(h('div','slot gap')); continue; }
        const el = cardEl(dec(c), false); el.dataset.from = 'd'+opp; el.dataset.order = i*2 + opp;
        if(cpuLift && cpuLift.i===i) el.classList.add('reach');
        o.appendChild(el);
      }
      const who = mode==='cpu' ? 'Computer' : 'Friend';
      const meta = h('div','sp-meta'); meta.append(drawPile(opp), h('span','pill', `${who} · ${left(opp)} left`));
      if(locked(opp)) meta.appendChild(h('span','pill bad','Fumbled'));
      top.append(meta, o);
      wrap.appendChild(top);
    }
    // Centre row: side, centre, centre, side
    const centreRow = h('div','sp-center');
    const side = k => { const p=h('div','sp-pile side'); p.dataset.anchor = 's'+k; p.append(v.s[k] ? cardEl({},false) : h('div','slot'), h('div','n', `${v.s[k]} spare`)); return p; };
    const tilt = c => ((c*37)%9 - 4) * 0.9;
    const pile = k => {
      const p = h('div','sp-pile center'); p.dataset.drop = k;
      const stack = h('div','sp-stack');
      if(v.u && v.u[k]!=null){ const u = cardEl(dec(v.u[k])); u.classList.add('under'); u.style.rotate = `${tilt(v.u[k])}deg`; stack.appendChild(u); }
      if(v.t[k]!=null){ const el = cardEl(dec(v.t[k])); el.dataset.from = 's'+k; el.style.rotate = `${tilt(v.t[k])}deg`; stack.appendChild(el); }
      else stack.appendChild(h('div','slot','?'));
      p.append(stack, h('div','n', `${v.cn[k]} played`));
      p.addEventListener('click', () => tapPile(k));
      p.setAttribute('aria-label', `${k ? 'Right' : 'Left'} centre pile`);

    // Bottom: me
    const bottom = h('div','sp-side me');
    const meta = h('div','sp-meta');
    meta.append(drawPile(me), h('span','pill', `${mode==='local'?'Player 1':'You'} · ${left(me)} left`));
    if(locked(me) && mode!=='local') meta.appendChild(h('span','pill bad','Fumbled'));
    const hb = h('button','hint-toggle' + (hints ? ' on' : ''), hints ? 'Hints on' : 'Hints off');
    hb.title = 'Glow cards that can be played'; hb.setAttribute('aria-pressed', hints);
    hb.addEventListener('click', () => { hints=!hints; store.set('speed-hints', hints); draw(); });
    meta.append(hb, h('kbd', null, mode==='local' ? '1–5, then A / D' : '1–5, then ← / →'));
    bottom.append(handRow(me), meta);
    wrap.appendChild(bottom);
    // Banners
    if(v.ph==='count'){ const b=h('div','sp-banner'); b.innerHTML=`<span>${v.n}</span>`; wrap.appendChild(b); }
    if(v.ph==='stuck'){ const b=h('div','sp-banner small'); b.innerHTML='<span>Stuck! Flip</span>'; wrap.appendChild(b); }
    if(v.ph==='wait'){ const b=h('div','sp-banner small'); b.innerHTML='<span>Paused</span>'; wrap.appendChild(b); }
    const anySel = [0,1].some(p => mine(p) && sel[p]!=null);
    const st = {
      deal: 'Picking up your five…',
      count: 'Get ready…',
      play: locked(me) && mode!=='local' ? '<span class="lose">Wrong pile. Your hand is frozen for a moment.</span>'
        : anySel ? 'Now tap the pile it goes on.' : 'Go! Drag a card onto a pile, or tap a card and then the pile.',
      stuck: 'Nobody can move. Flipping the spares…',
      wait: net && net.role==='host' ? 'Your friend left the table.' : 'The host left the table.'

  }
  const cardsLeft = (v, p) => v.h[p].filter(c => c!=null).length + v.d[p];
  function renderOver(v, me){

    else if(mode==='local'){ title=`Player ${v.w===0?1:2} wins`; line='Every card played. Run it back?'; }
    else if(v.w===me){ title='You win'; line = (mode==='cpu' ? 'Faster than the machine.' : 'You emptied your hand first.') + ` They still had ${cardsLeft(v, 1-me)} to go.`; }
    else { title = mode==='cpu' ? 'Computer wins' : 'Friend wins'; line=`So close: you had ${cardsLeft(v, me)} left. Again?`; }
    box.innerHTML = `<h3>${title}</h3><p>${line}</p>`;
    const row = h('div','controls');
    if(mode!=='guest'){ const again=h('button','btn primary big','Rematch'); again.addEventListener('click',()=>start(mode)); row.appendChild(again); }
    else row.appendChild(h('p', null, 'Waiting for the host to start a rematch…'));
    const change=h('button','btn','Change mode'); change.addEventListener('click',()=>{ S=null; mode=null; newGame(); }); row.appendChild(change);
    box.appendChild(row); wrap.appendChild(box);
