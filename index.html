  }

  // ----- online -----
  async function hostGame(){
    room = room || await getRoom(); if(!room) return;
    ui.status('Opening a table…');
    const newCode = () => Array.from({length:4}, () => 'ABCDEFGHJKMNPQRSTUVWXYZ'[Math.floor(Math.random()*23)]).join('');
    let r=null, code='';
    for(let tries=0; tries<3 && !r; tries++){ // a code can already be taken; draw another
      code = newCode();
      try{ r = await room.join('speed-' + code.toLowerCase(), {role:'host'}); }catch(e){ r=null; }
    }
    if(!r){ ui.status('Could not open a table right now. Check your connection and try again.'); return; }
    stop(); mode='host'; net={role:'host', code, room:r, guestPeer:null, unsubs:[]};
    wrap.innerHTML=''; const box=h('div','sp-over');
    box.innerHTML=`<p class="label" style="color:#3b3546">Your table code</p><div class="code">${code}</div><p>Tell your friend to open this page, choose Speed, then join with this code. The game starts as soon as they arrive.</p>`;
    wrap.appendChild(box); ui.status('Waiting for your friend…');
    net.unsubs.push(r.onPeers(ch => {
      const others = ch.peers.filter(p => !p.sameTab && p.kind==='viewer');
      if(!net.guestPeer && others.length){ net.guestPeer = others[0].peer; start('host'); }
      else if(net.guestPeer && ch.left.some(p => p.peer===net.guestPeer)){
        net.guestPeer=null; clearTimers(); if(S && S.phase!=='over'){ S.phase='wait'; view=SpeedRules.view(S, now()); draw(); }
        ui.status('Your friend left. The game starts again when someone joins with code ' + code + '.');
      }
    }));
    net.unsubs.push(r.on('act', msg => {
      if(msg.sameTab || msg.peer!==net.guestPeer || !S || S.phase!=='play') return;
      const d = msg.data || {}, i = Number.isInteger(d.i) ? d.i : -1, k = d.k;
      if(i>=0 && i<5 && (k===0 || k===1)) apply(1, i, k);
    }));
    net.unsubs.push(r.on('hello', msg => { if(!msg.sameTab && S) r.emit('state', SpeedRules.view(S, now())).catch(()=>{}); }));
  }
  async function joinGame(raw){
    const code = String(raw||'').trim().toUpperCase().replace(/[^A-Z]/g,'');
    if(code.length!==4){ ui.status('Table codes are 4 letters.'); return; }
    room = room || await getRoom(); if(!room) return;
    ui.status('Looking for table ' + code + '…');
    let r; try{ r = await room.join('speed-' + code.toLowerCase(), {role:'guest'}); }catch(e){ ui.status('Could not reach that table. Check the code, and make sure your friend is still on the code screen.'); return; }
    stop(); mode='guest'; net={role:'guest', code, room:r, unsubs:[]}; view=null; sel=[null,null]; bindKeys();
    wrap.innerHTML=''; const box=h('div','sp-over'); box.innerHTML=`<div class="code">${code}</div><p>Joined. Waiting for the host to deal…</p>`; wrap.appendChild(box);
    ui.status('Connecting to table ' + code + '…');
    let lastSeq=-1, hostPeer=null;
    net.unsubs.push(r.on('state', msg => {
      if(msg.sameTab) return; const v = msg.data; if(!validView(v)) return;
      if(hostPeer && msg.peer!==hostPeer) return; hostPeer = msg.peer;
      if(v.seq < lastSeq && v.ph!=='deal') return;
      if(v.ph==='deal' && lastSeq>v.seq){ sel=[null,null]; myLock=0; fx.deal(75); }
      else if(!view && v.ph==='deal') fx.deal(75);
      lastSeq = v.seq;
      if(sel[1]!=null && v.h[1][sel[1]]==null) sel[1]=null;
      [0,1].forEach(k => { if(view && view.t[k]!==v.t[k]){ seenWas[k]=view.t[k]; seenAt[k]=now(); } });
      view = v; draw();
    }));
    net.unsubs.push(r.onPeers(ch => {
      if(hostPeer && ch.left.some(p => p.peer===hostPeer) && view){ view = {...view, ph:'wait'}; draw(); }
    }));
    r.emit('hello', {}).catch(()=>{});
  }
  function validView(v){
    const okCard = c => Number.isInteger(c) && c>=0 && c<52;
    return v && Array.isArray(v.h) && v.h.length===2 && v.h.every(x => Array.isArray(x) && x.length===5 && x.every(c => c===null || okCard(c)))
      && Array.isArray(v.t) && v.t.every(c => c===null || okCard(c)) && Array.isArray(v.u) && v.u.every(c => c===null || okCard(c))
      && Array.isArray(v.d) && Array.isArray(v.s) && Array.isArray(v.cn)
      && ['deal','count','play','stuck','over','wait'].includes(v.ph) && Number.isInteger(v.seq);
  }
  return { newGame, stop };
}

// ======================= KLONDIKE =======================
function Klondike(root, ui){
  let S, sel, moves, won;
  const wrap = h('div','kl'); root.appendChild(wrap);
  const fx = Motion(wrap);
  const top = (a) => a[a.length-1];
  function newGame(){
    const d = shuffle(makeDeck());
    S = {stock:[], waste:[], found:[[],[],[],[]], tab:[[],[],[],[],[],[],[]]};
    for(let i=0;i<7;i++) for(let j=0;j<=i;j++){ const c=d.pop(); c.up = (j===i); S.tab[i].push(c); }
    S.stock = d; sel=null; moves=0; won=false;
    wrap.innerHTML=''; fx.deal(28); render();
  }
  const arr = src => src.type==='waste' ? S.waste : src.type==='found' ? S.found[src.i] : S.tab[src.i];
  const cardsOf = src => src.type==='tab' ? S.tab[src.i].slice(src.j) : [top(arr(src))];
  const canFound = (c,f) => f.length ? (top(f).s===c.s && top(f).r===c.r-1) : c.r===1;
  const canTab = (c,p) => { if(!p.length) return c.r===13; const t=top(p); return t.up && isRed(t.s)!==isRed(c.s) && t.r===c.r+1; };
  const same = (a,b) => a && b && a.type===b.type && a.i===b.i && a.j===b.j;
  function tryMove(src, dst){
    if(src.type===dst.type && src.i===dst.i) return false;
    const cards = cardsOf(src);
    if(!cards.length || !cards[0]) return false;
    if(dst.type==='found'){ if(cards.length!==1 || !canFound(cards[0], S.found[dst.i])) return false; }
    else if(!canTab(cards[0], S.tab[dst.i])) return false;
    arr(src).splice(-cards.length); arr(dst).push(...cards);
    S.tab.forEach(p => { if(p.length && !top(p).up) top(p).up = true; });
    moves++; return true;
  }
  function clickStock(){
    if(won) return;
    if(S.stock.length){ const c=S.stock.pop(); c.up=true; S.waste.push(c); }
    else if(S.waste.length){ S.stock = S.waste.reverse().map(c => (c.up=false, c)); S.waste=[]; }
    sel=null; moves++; render();
  }
  // You always say where a card goes: tap it, then tap the pile (or drag it there). Tapping it again puts it back down.
  function clickSpot(src, selectable){
    if(won) return;
    if(sel){
      if(same(sel, src)){ sel=null; return render(); }
      const dst = src.type==='tab' ? {type:'tab', i:src.i} : src.type==='found' ? {type:'found', i:src.i} : null;
      const ok = dst && tryMove(sel, dst);
      sel = ok ? null : (selectable ? src : null);
      return render();
    }
    if(selectable) sel = src;
    render();
  }
  function dropOn(src, key){
    if(won) return false;
    const dst = key[0]==='f' ? {type:'found', i:+key.slice(1)} : {type:'tab', i:+key.slice(1)};
    if(!tryMove(src, dst)) return false;
    sel=null; render(); return true;
  }
  const render = () => fx.run(paint);
  function paint(){
    wrap.innerHTML='';
    const row1 = h('div','row');
    // stock
    const stock = h('div','pile stock'); stock.setAttribute('role','button'); stock.setAttribute('aria-label','Deck'); stock.dataset.anchor='stock';
    stock.appendChild(S.stock.length ? cardEl(top(S.stock), false) : h('div','slot', '↻'));
    stock.appendChild(h('div','count', S.stock.length + ' left'));
    stock.addEventListener('click', clickStock); row1.appendChild(stock);
    // waste
    const waste = h('div','pile');
    if(S.waste.length){
      const el = cardEl(top(S.waste)); el.classList.add('can');
      const src={type:'waste'}; if(same(sel,src)) el.classList.add('sel');
      dragCard(el, { tap: () => clickSpot(src, true), drop: k => dropOn(src, k) });
      waste.appendChild(el);
    } else waste.appendChild(h('div','slot'));
    row1.appendChild(waste); row1.appendChild(h('div','pile'));
    // foundations
    S.found.forEach((f,i) => {
      const p = h('div','pile'); const src={type:'found', i}; p.dataset.drop = 'f'+i;
      if(f.length){ const el=cardEl(top(f)); el.classList.add('can'); if(same(sel,src)) el.classList.add('sel'); p.appendChild(el);
        dragCard(el, { tap: () => clickSpot(src, true), drop: k => dropOn(src, k) }); }
      else { const sl=h('div','slot' + (sel?' hot':''), 'A'); sl.addEventListener('click', () => clickSpot(src,false)); p.appendChild(sl); }
      row1.appendChild(p);
    });
    wrap.appendChild(row1);
    // tableau
    const row2 = h('div','row');
    S.tab.forEach((pile,i) => {
      const p = h('div','pile'); p.dataset.drop = 't'+i;
      const base = h('div','slot' + (sel && !pile.length ? ' hot':''), pile.length?'':'K');
      base.addEventListener('click', () => clickSpot({type:'tab', i, j:0}, false));
      p.appendChild(base);
      let off = 0; const els = [];
      pile.forEach((c,j) => {
        const el = cardEl(c); el.classList.add('abs'); el.style.top = `calc(var(--cw) * ${off})`;
        el.dataset.from = 'stock'; el.dataset.order = j*7 + i;   // dealt across the row, one layer at a time
        const src = {type:'tab', i, j};
        if(c.up){ el.classList.add('can');
          dragCard(el, { tap: () => clickSpot(src, true), drop: k => dropOn(src, k), group: () => els.slice(j) }); }
        if(sel && sel.type==='tab' && sel.i===i && j>=sel.j) el.classList.add('sel');
        p.appendChild(el); els.push(el);
        off += c.up ? .32 : .16;
      });
      p.style.height = `calc(var(--cw) * ${1.4 + off})`;
      row2.appendChild(p);
    });
    wrap.appendChild(row2);
    const done = S.found.reduce((n,f)=>n+f.length,0);
    if(done===52 && !won){ won = true; }
    ui.status(won ? `<span class="win">Solved in ${moves} moves. Nicely played.</span>` :
      `Moves <b>${moves}</b> · On foundations <b>${done}</b>/52 · ${sel ? 'Now tap where it goes.' : 'Drag a card, or tap it and then where it goes.'}`);
  }
  return { newGame };
}

// ======================= BLACKJACK =======================
function Blackjack(root, ui){
  let shoe=[], bank=store.get('bj-bank',500), bet=0, lastBet=25, P=[], D=[], phase='bet', result='', timer=null;
  const wrap = h('div','felt'); root.appendChild(wrap);
  const fx = Motion(wrap);
  const later = (fn, ms) => { clearTimeout(timer); timer = setTimeout(fn, ms); };
  const STEP = 430;   // the dealer's hands: one card at a time
  const draw = (up=true) => { if(shoe.length<15) shoe = shuffle(makeDeck(4)); const c=shoe.pop(); c.up=up; return c; };
  function score(hand){ let t=0,a=0; for(const c of hand){ if(!c.up) continue; let v=c.r>10?10:c.r; if(c.r===1){a++; v=11;} t+=v; } while(t>21&&a){t-=10;a--;} return {t, soft:a>0}; }
  const full = hand => score(hand.map(c=>({...c, up:true}))).t;
  function newGame(){ clearTimeout(timer); if(bank<5) bank=500; store.set('bj-bank',bank); P=[];D=[]; phase='bet'; bet=Math.min(lastBet, bank); result=''; render(); }
  function deal(){
    if(phase!=='bet' || bet<=0 || bet>bank) return;
    lastBet=bet; bank-=bet; P=[]; D=[]; phase='deal'; render();
    // You, dealer, you, dealer (face down), like a real shoe.
    const order = [() => P.push(draw()), () => D.push(draw()), () => P.push(draw()), () => D.push(draw(false))];
    const step = n => {
      if(n < order.length){ order[n](); render(); return later(() => step(n+1), STEP); }
      if(full(P)===21 || full(D)===21){ D[1].up=true; render(); return later(() => { finish(); render(); }, STEP*1.6); }
      phase='play'; render();
    };
    later(() => step(0), 120);
  }
  function hit(){
    if(phase!=='play') return;
    P.push(draw()); phase='deal'; render();
    later(() => { const t=score(P).t; if(t>21){ finish(); render(); } else if(t===21) dealerTurn(); else { phase='play'; render(); } }, STEP);
  }
  function stand(){ if(phase==='play') dealerTurn(); }
  function dbl(){
    if(phase!=='play' || bank<bet || P.length!==2) return;
    bank-=bet; bet*=2; P.push(draw()); phase='deal'; render();
    later(() => { if(score(P).t>21){ finish(); render(); } else dealerTurn(); }, STEP);
  }
  // Turn the hole card, then draw to 17 a card at a time.
  function dealerTurn(){
    phase='dealer'; D[1].up=true; render();
    const more = () => {
      if(score(D).t<17){ D.push(draw()); render(); return later(more, STEP*1.5); }
      later(() => { finish(); render(); }, STEP);
    };
    later(more, STEP*1.6);
  }
  function finish(){
    D.forEach(c=>c.up=true);
    const p=score(P).t, d=score(D).t, pBJ=p===21&&P.length===2, dBJ=d===21&&D.length===2;
    if(p>21){ result=`<span class="lose">Bust with ${p}. You lose ${bet}.</span>`; }
    else if(pBJ && !dBJ){ const w=Math.floor(bet*1.5); bank+=bet+w; result=`<span class="win">Blackjack! You win ${w}.</span>`; }
    else if(dBJ && !pBJ){ result=`<span class="lose">Dealer has blackjack. You lose ${bet}.</span>`; }
    else if(d>21){ bank+=bet*2; result=`<span class="win">Dealer busts with ${d}. You win ${bet}.</span>`; }
    else if(p>d){ bank+=bet*2; result=`<span class="win">${p} beats ${d}. You win ${bet}.</span>`; }
    else if(p===d){ bank+=bet; result=`Push at ${p}. Your bet comes back.`; }
    else { result=`<span class="lose">Dealer's ${d} beats ${p}. You lose ${bet}.</span>`; }
    phase='done'; store.set('bj-bank', bank);
  }
  function next(){
    if(phase!=='done') return;
    P=[];D=[]; phase='bet'; bet=Math.min(lastBet, bank);
    if(bank<5){ bank=500; bet=25; result='Out of chips, so the house spotted you 500.'; store.set('bj-bank',bank);}
    fx.sweep('tray'); render();
  }
  function seat(label, hand, showTotal){
    const s = h('div','seat');
    const st = score(hand);
    s.appendChild(h('div','label', label + (hand.length && showTotal ? ` · <span class="total">${st.t}${st.soft&&st.t<21?' soft':''}</span>` : '')));
    const hd = h('div','hand overlap'); hand.forEach(c => { const el=cardEl(c); el.dataset.from='shoe'; hd.appendChild(el); });
    if(!hand.length){ hd.appendChild(h('div','slot')); }
    s.appendChild(hd); return s;
  }
  const render = () => fx.run(paint);
  function paint(){
    wrap.innerHTML='';
    const shoeEl = h('div','bj-shoe'); shoeEl.dataset.anchor='shoe'; shoeEl.appendChild(cardEl({}, false)); shoeEl.title='Shoe';
    const tray = h('div','bj-tray'); tray.dataset.anchor='tray';
    wrap.append(shoeEl, tray, seat('Dealer', D, true));
    const bankRow = h('div','bank', `<div><span class="label">Bankroll</span><strong>${bank}</strong></div><div><span class="label">Bet</span><strong>${bet}</strong></div>`);
    wrap.appendChild(bankRow);
    wrap.appendChild(seat('You', P, true));
    const ctr = h('div','controls');
    const btn = (t, fn, cls='btn', dis=false) => { const b=h('button',cls,t); b.disabled=dis; b.addEventListener('click',fn); ctr.appendChild(b); return b; };
    if(phase==='bet'){
      const chips = h('div','chips');
      [5,10,25,100].forEach(v => { const c=h('button','chip c'+v, v); c.disabled = bet+v>bank; c.setAttribute('aria-label','Add '+v);
        c.addEventListener('click', () => { if(bet+v<=bank){ bet+=v; render(); } }); chips.appendChild(c); });
      wrap.appendChild(chips);
      btn('Clear bet', () => { bet=0; render(); }, 'btn', bet===0);
      btn('Deal', deal, 'btn primary', bet===0 || bet>bank);
    } else if(phase==='play' || phase==='deal' || phase==='dealer'){
      const wait = phase!=='play';
      btn('Hit', hit, 'btn primary', wait); btn('Stand', stand, 'btn', wait);
      btn('Double', dbl, 'btn', wait || P.length!==2 || bank<bet);
    } else { btn('Next hand', next, 'btn primary'); }
    wrap.appendChild(ctr);
    ui.status(phase==='bet' ? (result || 'Tap chips to set your bet, then deal.') : phase==='deal' ? 'Dealing…' : phase==='dealer' ? `Dealer plays… <b>${score(D).t}</b>` :
      phase==='play' ? `You have <b>${score(P).t}</b>. Dealer shows <b>${score(D).t}</b>.` : result);
    if(phase==='bet') result='';
  }
  return { newGame, stop(){ clearTimeout(timer); } };
}

// ======================= WAR =======================
function War(root, ui){
  let A, B, shownA, shownB, rounds, wars, msg, over, timer, auto, busy, lastWin;
  const wrap = h('div','felt'); root.appendChild(wrap);
  const fx = Motion(wrap);
  const later = (fn, ms) => { clearTimeout(timer); timer = setTimeout(fn, ms); };
  const val = c => c.r===1 ? 14 : c.r;
  function newGame(){
    clearTimeout(timer); auto=false; busy=false; lastWin=null;
    const d = shuffle(makeDeck()); A=d.slice(0,26); B=d.slice(26);
    shownA=[]; shownB=[]; rounds=0; wars=0; over=false; msg='Flip to start the first round.'; render();
  }
  // Both players turn a card. On a tie, three go down and one more comes up, a beat at a time.
  function flip(){
    if(over || busy) return;
    busy=true; rounds++;
    const pile=[], steps=[];
    let a=A.shift(), b=B.shift(); a.up=b.up=true; pile.push(a,b); steps.push([[a],[b]]);
    let winner=null, warHere=0;
    while(val(a)===val(b)){
      warHere++; wars++;
      if(!A.length || !B.length){ winner = A.length ? 'A' : 'B'; break; }
      const n = Math.min(3, A.length-1, B.length-1), da=[], db=[];
      for(let k=0;k<n;k++){ const x=A.shift(), y=B.shift(); x.up=y.up=false; pile.push(x,y); da.push(x); db.push(y); }
      if(n) steps.push([da, db]);
      a=A.shift(); b=B.shift(); a.up=b.up=true; pile.push(a,b); steps.push([[a],[b]]);
    }
    if(!winner) winner = val(a)>val(b) ? 'A' : 'B';
    if(lastWin) fx.sweep(lastWin==='A' ? 'dA' : 'dB');
    shownA=[]; shownB=[];
    const show = n => {
      shownA.push(...steps[n][0]); shownB.push(...steps[n][1]);
      if(n===0) msg = ''; else if(steps[n][0][0] && !steps[n][0][0].up) msg = warHere>1 && n>2 ? 'Double war! Three down…' : 'War! Three cards down…';
      render();
      if(n+1 < steps.length) return later(() => show(n+1), steps[n][0][0] && !steps[n][0][0].up ? 650 : 900);
      later(() => settle(winner, pile, warHere), 520);
    };
    show(0);
  }
  function settle(winner, pile, warHere){
    (winner==='A' ? A : B).push(...shuffle(pile.map(c => ({...c, up:false}))));
    lastWin = winner; busy=false;
    const tag = warHere ? (warHere>1 ? `Double war! ` : `War! `) : '';
    msg = winner==='A' ? `<span class="win">${tag}You take ${pile.length} cards.</span>` : `<span class="lose">${tag}Computer takes ${pile.length} cards.</span>`;
    if(!A.length || !B.length){ over=true; auto=false;
      msg = A.length ? `<span class="win">You collected all 52 cards in ${rounds} rounds.</span>` : `<span class="lose">The computer won after ${rounds} rounds.</span>`; }
    render();
    if(auto && !over) later(flip, 650);
  }
  function toggleAuto(){ auto=!auto; render(); if(auto && !busy) flip(); }
  function seat(label, deckN, shown, key){
    const s=h('div','seat');
    s.appendChild(h('div','label', `${label} · <span class="total">${deckN}</span> cards`));
    const row=h('div','mid');
    const dk = deckN ? cardEl({}, false) : h('div','slot'); dk.dataset.anchor = key;
    const hd=h('div','hand overlap'); shown.forEach(c => { const el=cardEl(c); el.dataset.from=key; hd.appendChild(el); });
    if(!shown.length) hd.appendChild(h('div','slot'));
    row.append(dk, hd); s.appendChild(row); return s;
  }
  const render = () => fx.run(paint);
  function paint(){
    wrap.innerHTML='';
    wrap.appendChild(seat('Computer', B.length, shownB, 'dB'));
    const ctr=h('div','controls');
    const f=h('button','btn primary','Flip'); f.disabled=over || busy || auto; f.addEventListener('click',flip);
    const a=h('button','btn', auto ? 'Stop' : 'Auto-play'); a.disabled=over; a.addEventListener('click',toggleAuto);
    ctr.append(f,a); wrap.appendChild(ctr);
    wrap.appendChild(seat('You', A.length, shownA, 'dA'));
    ui.status(`${msg || 'Flipping…'} <span style="margin-left:auto" class="label">Round ${rounds} · Wars ${wars}</span>`);
  }
  return { newGame, stop(){ clearTimeout(timer); auto=false; } };
}

// ======================= CRAZY EIGHTS =======================
// A face-up pile with the previous card peeking out underneath, so a new card has something to land on.
function pileEl(cards, opts={}){
  const st = h('div','stack');
  const n = cards.length, tilt = c => (((c.r*7 + SUITS.indexOf(c.s)*5) % 9) - 4) * .8;
  if(n>1){ const u = cardEl(cards[n-2], true); u.classList.add('under'); u.style.rotate = `${tilt(cards[n-2])}deg`; st.appendChild(u); }
  if(n){ const t = cardEl(cards[n-1], true); t.style.rotate = `${tilt(cards[n-1])}deg`; if(opts.from) t.dataset.from = opts.from; if(opts.order!=null) t.dataset.order = opts.order; st.appendChild(t); }
  else st.appendChild(h('div','slot'));
  return st;
}
function Eights(root, ui){
  let stock, discard, P, C, suit, turn, drew, choosing, over, msg, timer;
  const wrap = h('div','felt'); wrap.style.setProperty('--cw','min(72px, 17vw)'); root.appendChild(wrap);
  const fx = Motion(wrap);
  const later = (fn, ms) => { clearTimeout(timer); timer = setTimeout(fn, ms); };
  const top = () => discard[discard.length-1];
  const playable = c => c.r===8 || c.s===suit || c.r===top().r;
  function newGame(){
    clearTimeout(timer);
    stock = shuffle(makeDeck()); C=[]; P=[];
    for(let k=0;k<7;k++){ C.push(stock.pop()); P.push(stock.pop()); }
    P.forEach(c=>c.up=true);
    let first = stock.pop(); while(first.r===8){ stock.unshift(first); first=stock.pop(); }
    first.up=true; discard=[first]; suit=first.s; turn='p'; drew=0; choosing=false; over=false;
    sortHand(); msg='Your turn. Match the suit or rank.';
    wrap.innerHTML=''; fx.deal(60); render();
  }
  function sortHand(){ P.sort((a,b)=> SUITS.indexOf(a.s)-SUITS.indexOf(b.s) || a.r-b.r); }
  function refill(){ if(stock.length) return true; if(discard.length<=1) return false; const t=discard.pop(); stock=shuffle(discard.map(c=>(c.up=false,c))); discard=[t]; return true; }
  const ready = () => turn==='p' && !choosing && !over;
  function play(c, el){
    if(!ready()) return false;
    if(!playable(c)){ if(el){ el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); } return false; }
    P.splice(P.indexOf(c),1); discard.push(c);
    if(c.r===8 && P.length){ choosing=true; msg='Eight! Choose the next suit.'; render(); return true; }
    suit=c.s; endPlayer(); return true;
  }
  function chooseSuit(s){ suit=s; choosing=false; endPlayer(); }
  function drawCard(){
    if(!ready()) return;
    if(!refill()){ msg='The deck is empty. Pass your turn.'; drew=Math.max(drew,1); return render(); }
    const c=stock.pop(); c.up=true; P.push(c); drew++; sortHand();
    msg = playable(c) ? `You drew the ${rankLabel(c.r)}${c.s}. You can play it.` : `You drew the ${rankLabel(c.r)}${c.s}.`; render();
  }
  function pass(){ if(turn!=='p' || !drew || choosing || over) return; msg='You passed.'; endPlayer(true); }
  function endPlayer(){
    if(!P.length){ over=true; msg='<span class="win">You played your last card. You win!</span>'; return render(); }
    turn='c'; drew=0; render();
    later(() => cpuStep(0), 800);
  }
  // The computer plays like a person: draws one card at a time until something fits.
  function cpuStep(drawn){
    if(over) return;
    const non8 = C.filter(c=>c.r!==8 && playable(c)).sort((a,b)=> (b.s===suit)-(a.s===suit));
    const c = non8[0] || C.find(c=>c.r===8);
    const drewTxt = drawn ? `Computer drew ${drawn}. ` : '';
    if(!c){
      if(refill()){ C.push(stock.pop()); msg = drawn ? `Computer draws again…` : 'Computer draws…'; render(); return later(() => cpuStep(drawn+1), 620); }
      msg=`${drewTxt}Computer passed.`;
    } else {
      C.splice(C.indexOf(c),1); c.up=true; discard.push(c);
      if(c.r===8){ const counts={}; C.forEach(x=>{ if(x.r!==8) counts[x.s]=(counts[x.s]||0)+1; }); suit = Object.keys(counts).sort((a,b)=>counts[b]-counts[a])[0] || SUITS[Math.floor(Math.random()*4)]; msg=`${drewTxt}Computer played an 8 and chose ${suit}.`; }
      else { suit=c.s; msg=`${drewTxt}Computer played ${rankLabel(c.r)}${c.s}.`; }
    }
    if(!C.length){ over=true; msg='<span class="lose">The computer went out first.</span>'; return render(); }
    turn='p'; msg += ' Your turn.'; render();
  }
  const render = () => fx.run(paint);
  function paint(){
    wrap.innerHTML='';
    const cs=h('div','seat'); cs.appendChild(h('div','label', `Computer · <span class="total">${C.length}</span> cards`));
    const ch=h('div','hand overlap'); C.forEach((c,i)=>{ const el=cardEl(c, over); el.dataset.from='stock'; el.dataset.order=i*2; ch.appendChild(el); }); cs.appendChild(ch); wrap.appendChild(cs);
    const mid=h('div','mid');
    const st = stock.length ? cardEl({}, false) : h('div','slot','↻');
    st.style.cursor = turn==='p' && !over ? 'pointer' : 'default';
    st.setAttribute('role','button'); st.setAttribute('aria-label','Draw a card');
    st.addEventListener('click', drawCard);
    const stw=h('div','seat'); stw.style.width='auto'; stw.dataset.anchor='stock'; stw.append(st, h('div','label', `${stock.length} in deck`));
    const dw=h('div','seat'); dw.style.width='auto'; dw.dataset.drop='disc';
    dw.append(pileEl(discard, {from:'stock', order:20}), h('div','suitbadge', `Suit <span class="${isRed(suit)?'r':''}">${suit}</span>`));
    mid.append(stw, dw); wrap.appendChild(mid);
    if(choosing){ const sp=h('div','suitpick'); SUITS.forEach(s=>{ const b=h('button', isRed(s)?'r':'', s); b.setAttribute('aria-label','Choose '+s); b.addEventListener('click',()=>chooseSuit(s)); sp.appendChild(b); }); wrap.appendChild(sp); }
    const ps=h('div','seat'); ps.appendChild(h('div','label', `You · <span class="total">${P.length}</span> cards`));
    const ph=h('div','hand wrapgap');

      if(turn==='p' && !choosing && !over) el.classList.add(playable(c)?'can':'dim');

    ctr.appendChild(pb); wrap.appendChild(ctr);

  }

}

function Memory(root, ui){
  let cards, open, moves, lock, start, timer, done, flipBack, best=store.get('mem-best', null);
  const grid = h('div','mem'); root.appendChild(grid);
  const fx = Motion(grid);
  function newGame(){
    clearInterval(timer); clearTimeout(flipBack); timer=null; start=null;
    const picks = shuffle(makeDeck()).filter((c,i,a)=> a.findIndex(x=>x.r===c.r)===i).slice(0,8);
    cards = shuffle([...picks, ...picks].map((c,id)=>({c:{...c, up:true}, key:c.s+c.r, state:'down', id})));
    open=[]; moves=0; lock=false; done=false; grid.innerHTML=''; fx.deal(45); render();
  }
  const secs = () => start ? Math.floor((Date.now()-start)/1000) : 0;
  const fmt = s => `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
  function click(k){
    const it=cards[k]; if(lock || it.state!=='down' || done) return;
    if(!start){ start=Date.now(); timer=setInterval(()=>status(), 1000); }
    it.state='up'; open.push(it);
    if(open.length===2){
      moves++;
      const [a,b]=open;
      if(a.key===b.key){ a.state=b.state='done'; open=[];
        if(cards.every(x=>x.state==='done')){ done=true; clearInterval(timer); if(best==null || moves<best){ best=moves; store.set('mem-best',best); } } }
      else { lock=true; clearTimeout(flipBack); flipBack=setTimeout(()=>{ a.state=b.state='down'; open=[]; lock=false; render(); }, 1000); }
    }
    render();
  }
  function status(){
    const pairs = cards.filter(x=>x.state==='done').length/2;
    ui.status(done ? `<span class="win">All pairs found in ${moves} moves and ${fmt(secs())}.</span> <span class="label" style="margin-left:auto">Best ${best} moves</span>`
      : `Moves <b>${moves}</b> · Pairs <b>${pairs}</b>/8 · Time <b>${fmt(secs())}</b>${best!=null?` <span class="label" style="margin-left:auto">Best ${best} moves</span>`:''}`);
  }
  const render = () => fx.run(paint);
  function paint(){
    grid.innerHTML='';
    const deck = h('div','mem-deck'); deck.dataset.anchor='deck'; deck.dataset.point=''; grid.appendChild(deck);
    cards.forEach((it,k)=>{ const el=cardEl(it.c, it.state!=='down'); el.dataset.from='deck'; if(it.state==='done') el.classList.add('done'); el.setAttribute('role','button'); el.tabIndex=0;
      el.addEventListener('click',()=>click(k)); el.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); click(k);} }); grid.appendChild(el); });
    status();
  }
  return { newGame, stop(){ clearInterval(timer); clearTimeout(flipBack); } };
}

// ======================= TEXAS HOLD'EM =======================
const HAND_NAMES = ['High card','Pair','Two pair','Three of a kind','Straight','Flush','Full house','Four of a kind','Straight flush'];
const RANK_WORD = {14:'Aces',13:'Kings',12:'Queens',11:'Jacks',10:'Tens',9:'Nines',8:'Eights',7:'Sevens',6:'Sixes',5:'Fives',4:'Fours',3:'Threes',2:'Twos'};
const hv = c => c.r===1 ? 14 : c.r;
function eval5(cs){
  const v = cs.map(hv).sort((a,b)=>b-a);
  const flush = cs.every(c => c.s===cs[0].s);
  let straight = 0;
  if(new Set(v).size===5){ if(v[0]-v[4]===4) straight=v[0]; else if(v[0]===14 && v[1]===5) straight=5; }
  const cnt = {}; v.forEach(x => cnt[x]=(cnt[x]||0)+1);
  const g = Object.entries(cnt).map(([r,c]) => [c,+r]).sort((a,b)=> b[0]-a[0] || b[1]-a[1]);
  const rk = g.map(x=>x[1]);
  if(straight && flush) return [8,straight];
  if(g[0][0]===4) return [7,...rk];
  if(g[0][0]===3 && g[1][0]===2) return [6,...rk];
  if(flush) return [5,...v];
  if(straight) return [4,straight];
  if(g[0][0]===3) return [3,...rk];
  if(g[0][0]===2 && g[1][0]===2) return [2,...rk];
  if(g[0][0]===2) return [1,...rk];
  return [0,...v];
}
const cmpScore = (a,b) => { for(let i=0;i<Math.max(a.length,b.length);i++){ const d=(a[i]||0)-(b[i]||0); if(d) return d; } return 0; };
function best7(cards){
  let best=null; const n=cards.length;
  for(let a=0;a<n;a++) for(let b=a+1;b<n;b++){
    const five = cards.filter((_,i)=>i!==a && i!==b);
    if(five.length!==5) continue;
    const s = eval5(five); if(!best || cmpScore(s,best)>0) best=s;
  }
  if(n===5) best = eval5(cards);
  return best;
}
function handName(s){
  if(!s) return '';
  if(s[0]===8 && s[1]===14) return 'Royal flush';
  const w = RANK_WORD[s[1]];
  if(s[0]===1) return `Pair of ${w}`;
  if(s[0]===2) return `Two pair, ${w} and ${RANK_WORD[s[2]]}`;
  if(s[0]===3) return `Three ${w}`;
  if(s[0]===6) return `${w} full of ${RANK_WORD[s[2]]}`;
  if(s[0]===7) return `Four ${w}`;
  if(s[0]===0) return `${rankLabel(s[1]===14?1:s[1])} high`;
  return HAND_NAMES[s[0]];
}
// Monte Carlo share of the pot against `opp` random hands.
function equity(hole, board, opp, sims = 140){
  const known = new Set([...hole, ...board].map(c => c.s+c.r));
  const rest = makeDeck().filter(c => !known.has(c.s+c.r));
  let total = 0;
  for(let n=0;n<sims;n++){
    const need = 2*opp + (5-board.length);
    for(let i=0;i<need;i++){ const j=i+Math.floor(Math.random()*(rest.length-i)); [rest[i],rest[j]]=[rest[j],rest[i]]; }
    const b = board.concat(rest.slice(2*opp, need));
    const mine = best7(hole.concat(b));
    let lose=false, ties=0;
    for(let o=0;o<opp;o++){ const s = best7([rest[2*o], rest[2*o+1], ...b]); const d=cmpScore(mine,s); if(d<0){ lose=true; break; } if(d===0) ties++; }
    if(!lose) total += 1/(ties+1);
  }
  return total/sims;
}

function Holdem(root, ui){
  const wrap = h('div','pk'); root.appendChild(wrap);
  const fx = Motion(wrap);
  let dealing = false;
  const SEATS = [['You',0],['Mags',0.8],['Dutch',1.4],['Lou',0.5]];
  const SB=10, BB=20, START=1000;
  let P, dealer, deck, board, street, curBet, minRaise, turn, over, timer, raiseTo, result, handNo, busted;
  const later = (fn,ms) => { clearTimeout(timer); timer=setTimeout(fn,ms); };
  const pot = () => P.reduce((s,p)=>s+p.total,0);
  const canAct = p => !p.out && !p.folded && !p.allin;
  const needsAct = p => canAct(p) && (!p.acted || p.bet<curBet);
  const nextIdx = (i, pred) => { for(let k=1;k<=P.length;k++){ const j=(i+k)%P.length; if(pred(P[j])) return j; } return -1; };

  function newGame(){
    clearTimeout(timer); handNo=0; busted=false;
    P = SEATS.map(([name,agg],i) => ({name, agg, human:i===0, chips:START, hole:[], bet:0, total:0, folded:false, allin:false, acted:false, last:'', out:false, won:0}));
    dealer = Math.floor(Math.random()*P.length);
    newHand();
  }
  function newHand(){
    P.forEach(p => { if(p.chips<=0) p.out=true; Object.assign(p, {hole:[], bet:0, total:0, folded:p.out, allin:false, acted:false, last:'', won:0, score:null}); });
    if(P[0].out){ busted=true; return render(); }
    if(P.filter(p=>!p.out).length<2) return render();
    handNo++; dealer = nextIdx(dealer, p=>!p.out);
    deck = shuffle(makeDeck()); deck.forEach(c=>c.up=true); board=[]; street=0; over=false; result=''; raiseTo=null;
    P.forEach(p => { if(!p.out) p.hole=[deck.pop(), deck.pop()]; });
    const heads = P.filter(p=>!p.out).length===2;
    const sb = heads ? dealer : nextIdx(dealer, p=>!p.out), bb = nextIdx(sb, p=>!p.out);
    post(sb, SB, 'Small blind'); post(bb, BB, 'Big blind');
    curBet=BB; minRaise=BB;
    turn = nextIdx(bb, needsAct);
    // Last hand's cards go back to the deck, then two each come out around the table.
    dealing = true; fx.sweep('deck'); fx.deal(85); render();
    later(() => { dealing = false; proceed(); }, fx.left() + 200);
  }
  function post(i, amt, label){ const p=P[i]; const a=Math.min(amt,p.chips); p.chips-=a; p.bet+=a; p.total+=a; if(!p.chips) p.allin=true; p.last=label; }
  function act(i, type, to){
    const p=P[i]; if(over || i!==turn) return;
    if(type==='fold'){ p.folded=true; p.last='Fold'; }
    else if(type==='call'){
      const need=Math.min(curBet-p.bet, p.chips); p.chips-=need; p.bet+=need; p.total+=need; if(!p.chips) p.allin=true;
      p.last = need===0 ? 'Check' : (p.allin ? 'All in' : `Call ${need}`);
    } else {
      to = Math.min(to, p.bet+p.chips); const add = to-p.bet; p.chips-=add; p.total+=add; p.bet=to; if(!p.chips) p.allin=true;
      const opened = curBet===0;
      if(to>curBet){ minRaise = Math.max(minRaise, to-curBet); curBet=to; P.forEach(q => { if(q!==p) q.acted=false; }); }
      p.last = p.allin ? 'All in' : (opened ? `Bet ${to}` : `Raise to ${to}`);
    }
    p.acted = true;
    turn = nextIdx(i, needsAct);
    proceed();
  }
  function proceed(){
    const inHand = P.filter(p=>!p.out && !p.folded);
    if(inHand.length===1){ const w=inHand[0]; const amt=pot(); w.chips+=amt; w.won=amt; over=true; result=`${w.human?'You take':w.name+' takes'} the pot of ${amt}. Everyone else folded.`; return render(); }
    const actors = P.filter(canAct);
    if(turn<0 || !actors.some(needsAct)){ render(); return later(nextStreet, actors.length<=1 ? 1000 : 650); }
    render();
    if(!P[turn].human) later(() => bot(turn), 650 + Math.random()*500);
  }
  function nextStreet(){
    P.forEach(p => { p.bet=0; p.acted=false; if(!p.folded && !p.allin && !p.out && street<3) p.last=''; });
    curBet=0; minRaise=BB; street++;
    if(street===1) board.push(deck.pop(), deck.pop(), deck.pop());
    else if(street<=3) board.push(deck.pop());
    else return showdown();
    turn = nextIdx(dealer, needsAct);
    if(P.filter(canAct).length<2) turn=-1;
    dealing = true; fx.deal(140); render();
    later(() => { dealing = false; proceed(); }, fx.left() + 150);
  }
  function showdown(){
    const inHand = P.filter(p=>!p.out && !p.folded);
    inHand.forEach(p => p.score = best7([...p.hole, ...board]));
    const levels = [...new Set(P.filter(p=>p.total>0).map(p=>p.total))].sort((a,b)=>a-b);
    let prev=0;
    for(const L of levels){
      const amount = P.reduce((s,p)=> s + Math.min(p.total,L) - Math.min(p.total,prev), 0);
      let elig = inHand.filter(p=>p.total>=L); if(!elig.length) elig = inHand;
      prev = L;
      let top=[]; for(const p of elig){ if(!top.length || cmpScore(p.score, top[0].score)>0) top=[p]; else if(cmpScore(p.score, top[0].score)===0) top.push(p); }
      const share = Math.floor(amount/top.length); top.forEach(p => { p.chips+=share; p.won+=share; }); top[0].chips += amount - share*top.length; top[0].won += amount - share*top.length;
    }
    over=true; street=4;
    const ws = P.filter(p=>p.won>0);
    result = ws.map(p => `${p.human?'You win':p.name+' wins'} ${p.won} with ${handName(p.score).toLowerCase()}`).join(' · ') + '.';
    render();
  }
  function bot(i){
    if(over || i!==turn) return;
    const p=P[i], need=curBet-p.bet, potNow=pot();
    const opp = P.filter(q=>!q.out && !q.folded && q!==p).length;
    const eq = equity(p.hole, board, opp);
    const edge = eq*(opp+1);              // 1.0 = an average hand at this table
    const odds = need/(potNow+need || 1);
    const r = Math.random();
    const raiseSize = () => { const base = Math.max(minRaise, Math.round(potNow*(0.45+0.55*r)/10)*10); return curBet + base; };
    if(edge>1.75 || (edge>1.3 && r<0.35*p.agg) || (r<0.05*p.agg && street<3)){
      if(p.chips + p.bet > curBet) return act(i,'raise', edge>2.4 && r<0.25 ? p.bet+p.chips : raiseSize());
    }
    if(need===0) return act(i,'call');
    if(eq >= odds*0.95 || (need<=BB && edge>0.7) || r<0.04*p.agg) return act(i,'call');
    return act(i,'fold');
  }

  // ---- drawing ----
  function seatEl(p, i){
    const s = h('div','pk-seat' + (i===turn && !over && !dealing ? ' turn':'') + (p.folded&&!p.out ? ' folded':'') + (p.out ? ' out':'') + (p.won ? ' won':''));
    const cards = h('div','pk-hole');
    const show = over && street===4 && !p.folded;
    p.hole.forEach((c,k) => cards.appendChild(dealt(cardEl(c, show), i, k)));
    if(!p.hole.length) cards.appendChild(h('div','slot'));
    s.append(h('div','pk-name', `${p.name}${i===dealer?' <span class="dbtn" title="Dealer">D</span>':''}`), cards,
      h('div','pk-chips', p.out ? 'Out' : `${p.chips}`),
      h('div','pk-act', p.won ? `+${p.won}` : (p.last || (i===turn && !over && !dealing ? 'Thinking…' : '&nbsp;'))));
    if(show && p.score) s.appendChild(h('div','pk-hn', handName(p.score)));
    return s;
  }
  // Hole cards leave the deck in table order: one each starting left of the button, then a second round.
  const dealt = (el, i, k) => { el.dataset.from='deck'; el.dataset.order = k*P.length + (i - dealer - 1 + P.length) % P.length; return el; };
  const render = () => fx.run(paint);
  function paint(){
    wrap.innerHTML='';
    if(busted || P.filter(p=>!p.out).length<2){
      const box = h('div','sp-over');
      const won = !busted;
      box.innerHTML = `<h3>${won ? 'Table cleared' : 'Busted'}</h3><p>${won ? `You took every chip in ${handNo} hands.` : `You ran out of chips after ${handNo} hands.`}</p>`;
      const b=h('button','btn primary big', won ? 'New table' : 'Buy back in'); b.addEventListener('click', newGame); box.appendChild(b);
      wrap.appendChild(box); ui.status(won ? '<span class="win">Every chip is yours.</span>' : '<span class="lose">Out of chips.</span>'); return;
    }
    const opps = h('div','pk-opps'); [1,2,3].forEach(i => opps.appendChild(seatEl(P[i], i))); wrap.appendChild(opps);
    const mid = h('div','pk-mid');
    const bd = h('div','pk-board'); for(let k=0;k<5;k++){ const el = board[k] ? cardEl(board[k]) : h('div','slot'); el.dataset.from='deck'; bd.appendChild(el); }
    const pt = h('div','pk-pot', `<span class="label">Pot</span><strong>${pot()}</strong>`); pt.dataset.anchor='deck'; pt.dataset.point='';
    mid.append(pt, bd);
    wrap.appendChild(mid);
    // you
    const me = P[0];
    const you = h('div','pk-you' + (turn===0 && !over ? ' turn':'') + (me.folded ? ' folded':''));
    const hole = h('div','pk-hole big'); me.hole.forEach((c,k) => hole.appendChild(dealt(cardEl(c, true), 0, k)));
    const cur = me.hole.length && board.length>=3 ? handName(best7([...me.hole, ...board])) : (me.hole.length===2 ? (hv(me.hole[0])===hv(me.hole[1]) ? `Pocket ${RANK_WORD[hv(me.hole[0])].toLowerCase()}` : `${rankLabel(me.hole[0].r)}-${rankLabel(me.hole[1].r)}${me.hole[0].s===me.hole[1].s?' suited':''}`) : '');
    const info = h('div','pk-info', `<div class="pk-name">You${dealer===0?' <span class="dbtn">D</span>':''}</div><div class="pk-stack">${me.chips}</div><div class="pk-act">${me.won?`+${me.won}`:(me.last||'&nbsp;')}</div><div class="pk-hn">${cur}</div>`);
    you.append(hole, info); wrap.appendChild(you);
    // controls
    const ctr = h('div','pk-ctrl');
    if(over){
      const b=h('button','btn primary big','Next hand'); b.addEventListener('click', () => { if(over) newHand(); }); ctr.appendChild(b);
    } else if(dealing){
      ctr.appendChild(h('div','label','Dealing…'));
    } else if(turn===0){
      const need = curBet-me.bet, maxTo = me.bet+me.chips;
      const minTo = Math.min(maxTo, curBet + minRaise);
      if(raiseTo==null || raiseTo<minTo || raiseTo>maxTo) raiseTo = minTo;
      const row = h('div','controls');
      const fold=h('button','btn','Fold'); fold.addEventListener('click',()=>act(0,'fold'));
      const call=h('button','btn primary', need===0 ? 'Check' : (need>=me.chips ? `All in ${me.chips}` : `Call ${need}`)); call.addEventListener('click',()=>act(0,'call'));
      row.append(fold, call);
      if(maxTo > curBet){
        const rb=h('button','btn hot', raiseTo>=maxTo ? `All in ${maxTo}` : `${curBet===0?'Bet':'Raise to'} ${raiseTo}`); rb.addEventListener('click',()=>{ const t=raiseTo; raiseTo=null; act(0,'raise',t); });
        row.appendChild(rb);
        const sl = h('div','pk-size');
        const range = h('input'); range.type='range'; range.id='raise'; range.min=minTo; range.max=maxTo; range.step=10; range.value=raiseTo; range.setAttribute('aria-label','Raise amount');
        range.addEventListener('input', () => { raiseTo = Math.min(maxTo, Math.max(minTo, +range.value)); rb.textContent = raiseTo>=maxTo ? `All in ${maxTo}` : `${curBet===0?'Bet':'Raise to'} ${raiseTo}`; });
        const quick = h('div','pk-quick');
        [['Min',minTo],['½ pot', curBet + Math.round((pot()+need)/2/10)*10],['Pot', curBet + Math.round((pot()+need)/10)*10],['All in',maxTo]].forEach(([t,v]) => {
          const q=h('button','btn',t); q.addEventListener('click',()=>{ raiseTo=Math.min(maxTo,Math.max(minTo,v)); range.value=raiseTo; range.dispatchEvent(new Event('input')); }); quick.appendChild(q); });
        sl.append(range, quick); ctr.append(row, sl);
      } else ctr.appendChild(row);
    } else ctr.appendChild(h('div','label', me.folded ? 'You folded. Watching the hand play out…' : (turn<0 ? 'Dealing…' : `${P[turn].name} to act…`)));
    wrap.appendChild(ctr);
    const streetName = ['Pre-flop','Flop','Turn','River','Showdown'][street];
    ui.status(over ? result : `Hand <b>${handNo}</b> · ${streetName} · Blinds ${SB}/${BB}${curBet ? ` · To call <b>${Math.max(0,curBet-me.bet)}</b>`:''}`);
  }
  return { newGame, stop(){ clearTimeout(timer); } };
}

// ======================= SIX-CARD GOLF =======================
function Golf(root, ui){
  const wrap = h('div','golf'); root.appendChild(wrap);
  const fx = Motion(wrap);
  const HOLES = 9;
  let H, stock, discard, turn, phase, held, heldFrom, final, hole, totals, msg, timer, peeks, starter;
  const val = c => c.r===2 ? -2 : c.r===13 ? 0 : c.r>=11 ? 10 : c.r;
  const later = (fn,ms) => { clearTimeout(timer); timer=setTimeout(fn,ms); };
  function score(hand, known=false){ // known: only count face-up (unknowns as 0)
    let s=0; for(let k=0;k<3;k++){ const a=hand[k], b=hand[k+3];
      const av = (!known||a.up) ? val(a.c) : 0, bv = (!known||b.up) ? val(b.c) : 0;
      if((!known || (a.up && b.up)) && a.c.r===b.c.r) continue; s += av+bv; }
    return s;
  }
  // computer's estimate: unknown cards count as 5
  function est(hand){ let s=0; for(let k=0;k<3;k++){ const a=hand[k], b=hand[k+3]; if(a.up && b.up && a.c.r===b.c.r) continue; s += (a.up?val(a.c):5) + (b.up?val(b.c):5); } return s; }
  function newGame(){ clearTimeout(timer); hole=1; totals=[0,0]; starter=0; wrap.innerHTML=''; deal(); }
  function deal(){
    const d = shuffle(makeDeck());
    H = [0,1].map(() => d.splice(0,6).map(c => ({c:{...c, up:true}, up:false})));
    discard = [{...d.pop(), up:true}]; stock = d; held=null; heldFrom=null; final=null; peeks=0;
    phase='deal'; turn=0; msg='Dealing…';
    fx.sweep('stock'); fx.deal(55); render();
    // the computer turns two of its cards, then you pick yours
    later(() => { shuffle([0,1,2,3,4,5]).slice(0,2).forEach(k => H[1][k].up=true); phase='peek'; msg='Turn over any two of your cards to start.'; render(); }, fx.left() + 250);
  }
  const allUp = p => H[p].every(x=>x.up);
  function refill(){ if(stock.length) return; const top=discard.pop(); stock=shuffle(discard.map(c=>({...c}))); discard=[top]; }
  const mine = () => turn===0;
  function clickStock(){ if(phase!=='draw' || !mine()) return; refill(); held={...stock.pop(), up:true}; heldFrom='stock'; phase='hold'; msg='Swap it into your grid, or throw it on the discard pile.'; render(); }
  function clickDiscard(){
    if(!mine()) return;
    if(phase==='draw'){ held=discard.pop(); heldFrom='discard'; phase='hold'; msg='Tap or drag it onto the card in your grid it replaces.'; return render(); }
    if(phase==='hold' && heldFrom==='stock'){ discard.push(held); held=null;
      if(H[0].some(x=>!x.up)){ phase='flip'; msg='Now turn over one of your face-down cards.'; render(); } else endTurn(0); }
  }
  function clickMine(k){
    const x=H[0][k];
    if(phase==='peek'){ if(x.up) return; x.up=true; peeks++; if(peeks<2) return render(); phase='wait'; render(); return later(startHole, 450); }
    if(turn!==0) return;
    if(phase==='hold'){ discard.push(x.c); H[0][k]={c:held, up:true}; held=null; return endTurn(0); }
    if(phase==='flip' && !x.up){ x.up=true; return endTurn(0); }
  }
  // Drag the card you're holding (or the top discard) onto a grid card to swap, or the drawn card onto the discard.
  function dropHeld(key){
    if(turn!==0) return false;
    if(key==='disc'){ if(phase!=='hold' || heldFrom!=='stock') return false; clickDiscard(); return true; }
    const k = +key.slice(1);
    if(phase==='draw'){ held=discard.pop(); heldFrom='discard'; phase='hold'; }
    if(phase!=='hold') return false;
    clickMine(k); return true;
  }
  function startHole(){ turn=starter; if(turn===0){ phase='draw'; msg='Your turn. Draw from the deck or take the discard.'; render(); } else { phase='cpu'; msg=''; render(); later(cpu, 900); } }
  function endTurn(p){
    held=null;
    if(final===null && allUp(p)) final=p;
    const next=1-p;
    if(final!==null && next===final){ render(); return later(endRound, fx.left() + 350); }
    turn=next;
    if(turn===1){ phase='cpu'; msg=''; render(); later(cpu, 900); }
    else { phase='draw'; msg = (final===1 ? 'The computer has turned every card. This is your last turn. ' : '') + msg; render(); }
  }
  function bestSpot(hand, card){
    let best=null;
    for(let k=0;k<6;k++){ const copy=hand.map(x=>({...x})); copy[k]={c:card, up:true}; const d=est(copy)-est(hand); if(!best || d<best.d) best={k,d}; }
    return best;
  }
  const name = c => `${rankLabel(c.r)}${c.s}`;
  // The computer's turn, in two beats: pick a card up, then put it somewhere.
  function cpu(){
    const me=H[1], top=discard[discard.length-1];
    const take = bestSpot(me, top);
    if(take.d <= -3 || val(top)<=1){
      held = discard.pop(); heldFrom='discard'; msg=`Computer takes the ${name(held)}…`; render();
      return later(() => { discard.push(me[take.k].c); me[take.k]={c:held, up:true}; msg=`Computer took the ${name(top)} from the discard pile. Your turn.`; endTurn(1); }, 800);
    }
    refill(); held={...stock.pop(), up:true}; heldFrom='stock'; msg='Computer draws…'; render();
    later(() => {
      const card = held, spot=bestSpot(me, card), lastTurn = final===0;
      const down = me.map((x,k)=>x.up?-1:k).filter(k=>k>=0);
      if(spot.d < -1 || down.length===0 || lastTurn && spot.d<0){
        discard.push(me[spot.k].c); me[spot.k]={c:card, up:true}; msg=`Computer drew a card and kept it. Your turn.`;
        return endTurn(1);
      }
      discard.push(card); held=null; msg=`Computer threw away the ${name(card)}…`; render();
      later(() => {
        const k = down[Math.floor(Math.random()*down.length)]; me[k].up=true;
        msg=`Computer threw away the ${name(card)} and turned over a card. Your turn.`;
        endTurn(1);
      }, 650);
    }, 850);
  }
  function endRound(){
    H.forEach(hd => hd.forEach(x => x.up=true));
    const s=[score(H[0]), score(H[1])]; totals[0]+=s[0]; totals[1]+=s[1];
    phase='end';
    msg = s[0]<s[1] ? `<span class="win">You win the hole, ${s[0]} to ${s[1]}.</span>` : s[0]>s[1] ? `<span class="lose">Computer wins the hole, ${s[1]} to ${s[0]}.</span>` : `Tied hole at ${s[0]}.`;
    render();
  }
  function grid(p){
    const g=h('div','golf-grid');
    H[p].forEach((x,k) => {
      const el = cardEl(x.c, x.up); el.dataset.from='stock'; el.dataset.order = k*2 + p;
      const clickable = p===0 && ((phase==='peek' && !x.up) || (turn===0 && (phase==='hold' || (phase==='flip' && !x.up))));
      if(clickable){ el.classList.add('can','live'); el.setAttribute('role','button'); el.tabIndex=0; el.addEventListener('click',()=>clickMine(k)); el.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); clickMine(k);} }); }
      if(p===0) el.dataset.drop = 'g'+k;
      g.appendChild(el);
    });
    return g;
  }
  const render = () => fx.run(paint);
  function paint(){
    wrap.innerHTML='';
    const scoreLine = p => phase==='end' ? `scores ${score(H[p])}` : `showing ${score(H[p], true)}`;
    const top = h('div','seat'); top.append(h('div','label', `Computer · ${scoreLine(1)} · total ${totals[1]}`), grid(1)); wrap.appendChild(top);
    const mid = h('div','mid');
    const st = stock.length ? cardEl({}, false) : h('div','slot');
    if(turn===0 && phase==='draw'){ st.classList.add('can','live'); st.setAttribute('role','button'); st.setAttribute('aria-label','Draw from the deck'); }
    st.addEventListener('click', clickStock);

    if(canTake || canThrow){ dc.classList.add('can','live'); dc.setAttribute('role','button'); dc.setAttribute('aria-label', canTake ? 'Take the discard' : 'Throw away the drawn card'); }
    if(canTake && discard.length) dragCard(dc, { tap: clickDiscard, drop: dropHeld });
    else dc.addEventListener('click', clickDiscard);
    const col = (el, label) => { const s=h('div','seat'); s.style.width='auto'; s.append(el, h('div','label',label)); return s; };
    const sc = col(st,'Deck'); sc.dataset.anchor='stock';

    mid.append(sc, dcol);

    if(held){ hc.classList.add('sel'); if(turn===0) dragCard(hc, { drop: dropHeld }); }
    const hold = col(hc, held ? (turn===0 ? 'In your hand' : 'Computer holds') : '&nbsp;'); hold.classList.add('golf-held');
    mid.append(hold);
    wrap.appendChild(mid);
    const me = h('div','seat'); me.append(grid(0), h('div','label', `You · ${scoreLine(0)} · total ${totals[0]}`)); wrap.appendChild(me);

      else { const res = totals[0]<totals[1] ? 'You win the round' : totals[0]>totals[1] ? 'Computer wins the round' : 'All square'; ctr.appendChild(h('div','total', `${res}: ${totals[0]} to ${totals[1]}`)); const b=h('button','btn primary big','Play 9 more'); b.addEventListener('click',newGame); ctr.appendChild(b); }
      wrap.appendChild(ctr);
    }
    ui.status(`<span class="label">Hole ${hole}/${HOLES}</span> ${phase==='cpu' ? (msg || 'Computer is playing…') : msg}`);

// ======================= EGYPTIAN RATSCREW =======================
function Ratscrew(root, ui){
  const wrap = h('div','rat'); root.appendChild(wrap);
  const fx = Motion(wrap);
  // Hands need a moment to come back after a slap; a wrong slap keeps them off the pile a bit longer.
  const SLAP_GAP = 320, BAD_SLAP = 900;
  let slapAt = 0, slapLock = 0;
  const CHANCES = {1:4, 11:1, 12:2, 13:3};
  let hands, pile, turn, chances, challenger, over, msg, pv, timers=[], react=750, keyH=null, started=false;
  const later = (fn, ms) => { const t=setTimeout(fn, ms); timers.push(t); return t; };
  const clear = () => { timers.forEach(clearTimeout); timers=[]; };
  function newGame(){
    clear();
    if(!started){ return picker(); }
    const d = shuffle(makeDeck()).map(c => ({...c, up:true}));
    hands=[d.slice(0,26), d.slice(26)]; pile=[]; turn=0; chances=null; challenger=null; over=false; pv=0; slapAt=0; slapLock=0;
    msg='Your flip. Slap doubles (7, 7) and sandwiches (7, 2, 7) before the computer does.';
    bindKeys(); render();
  }
  function picker(){
    wrap.innerHTML='';
    const box = h('div','sp-over'); box.innerHTML = '<h3>Ratscrew</h3><p>How quick are the computer\'s hands?</p>';
    const row = h('div','controls');
    [['Sleepy',1100],['Sharp',750],['Lightning',480]].forEach(([t,ms],i) => { const b=h('button','btn'+(i===1?' primary':''),t); b.addEventListener('click',()=>{ react=ms; started=true; newGame(); }); row.appendChild(b); });
    box.appendChild(row); wrap.appendChild(box); ui.status('Pick a speed to deal in.');
  }
  const slappable = () => { const n=pile.length; if(n>=2 && pile[n-1].r===pile[n-2].r) return 'Double'; if(n>=3 && pile[n-1].r===pile[n-3].r) return 'Sandwich'; return null; };
  function flip(p){
    if(over || turn!==p) return;
    if(!hands[p].length) return finish(1-p);
    const c = hands[p].shift(); c.by = p; pile.push(c); pv++;
    if(CHANCES[c.r]){ chances=CHANCES[c.r]; challenger=p; turn=1-p; msg = `${p===0?'You':'Computer'} played a${c.r===1?'n Ace':' '+({11:'Jack',12:'Queen',13:'King'})[c.r]}. ${p===0?'Computer has':'You have'} ${chances} ${chances===1?'chance':'chances'} to answer with a face card.`; }
    else if(challenger!=null){
      chances--;
      if(chances===0){ turn=null; const w=challenger, v=pv; msg=`No face card. ${w===0?'You collect':'Computer collects'} the pile…`;
        later(() => { if(pv===v) take(w, `${w===0?'You':'Computer'} won the face-card fight.`); }, 1100); }
      else msg = `${chances} ${chances===1?'chance':'chances'} left.`;
    } else turn=1-p;
    if(turn!==null && !hands[turn].length && !slappable()){ const loser=turn, v=pv; later(() => { if(pv===v) finish(1-loser); }, react+300); }
    afterChange();
  }
  function take(p, why){
    hands[p].push(...pile); pile=[]; chances=null; challenger=null; turn=p; pv++; fx.sweep('d'+p);
    msg = `${why} ${p===0?'You':'Computer'} now hold${p===0?'':'s'} ${hands[p].length}.`;
    if(!hands[1-p].length) return finish(p);
    afterChange();
  }
  function slap(p){
    if(over || !pile.length) return;
    if(p===0){ const t=performance.now(); if(t < slapAt + SLAP_GAP || t < slapLock) return; slapAt = t; }
    const kind = slappable();
    if(kind) return take(p, `${kind}! ${p===0?'You':'Computer'} slapped first.`);
    if(p===0){
      slapLock = performance.now() + BAD_SLAP;
      if(hands[0].length){ pile.unshift(hands[0].shift()); msg='Bad slap. One of your cards goes under the pile, and your hand is off the table for a moment.'; pv++; afterChange(); later(() => { if(!over) render(); }, BAD_SLAP + 20); }
      else finish(1);
    }
  }
  function finish(w){ over=true; clear(); msg = w===0 ? '<span class="win">The computer is out of cards. You win!</span>' : '<span class="lose">You ran out of cards. The computer wins.</span>'; render(); }
  function afterChange(){
    render();
    const v=pv;
    if(slappable() && Math.random() > 0.12) later(() => { if(pv===v && !over) slap(1); }, react*(0.7+Math.random()*0.6));
    if(turn===1) later(() => { if(pv===v && !over) flip(1); }, 650 + Math.random()*350);
  }
  function bindKeys(){
    if(keyH) return;
    keyH = e => { if(e.repeat) { if(e.code==='Space') e.preventDefault(); return; }
      if(e.code==='Space' || e.key==='s'){ e.preventDefault(); slap(0); } else if(e.key==='Enter' || e.key==='f'){ e.preventDefault(); flip(0); } };
    window.addEventListener('keydown', keyH);
  }
  const deck = (p, label) => {
    const m = h('div','sp-meta'); const d = h('div','sp-draw'); d.dataset.anchor = 'd'+p;
    d.append(hands[p].length ? cardEl({}, false) : h('div','slot')); m.append(d, h('span','pill', `${label} · ${hands[p].length} cards`)); return m;
  };
  const render = () => fx.run(paint);
  function paint(){
    wrap.innerHTML='';
    wrap.appendChild(deck(1, 'Computer'));
    const p = h('div','rat-pile');
    const shown = pile.slice(-3);
    if(!shown.length) p.appendChild(h('div','slot'));
    shown.forEach((c,i) => { const el=cardEl(c); el.classList.add('abs'); el.style.left=`calc(var(--cw) * ${i*0.42})`; el.style.rotate=`${[-6,3,-2][i]}deg`; el.dataset.from = 'd'+(c.by||0); p.appendChild(el); });
    p.addEventListener('pointerdown', e => { e.preventDefault(); slap(0); });
    wrap.appendChild(p);
    wrap.appendChild(h('div','label', `${pile.length} in the pile${chances!=null && turn!=null ? ` · ${chances} ${chances===1?'chance':'chances'} left` : ''}`));
    const ctr = h('div','controls');
    const f = h('button','btn primary big','Flip'); f.disabled = over || turn!==0; f.addEventListener('click',()=>flip(0));
    const s = h('button','btn hot big','Slap!'); s.disabled = over || !pile.length || performance.now() < slapLock; s.addEventListener('pointerdown', e => { e.preventDefault(); slap(0); });
    ctr.append(f, s); wrap.appendChild(ctr);
    const mine = deck(0, 'You'); mine.appendChild(h('kbd', null, 'Enter flips · Space slaps · or tap the pile')); wrap.appendChild(mine);
    if(over){ const b=h('button','btn primary','Play again'); b.addEventListener('click', newGame); wrap.appendChild(b); }
    ui.status(msg);
  }
  return { newGame, stop(){ clear(); if(keyH){ window.removeEventListener('keydown', keyH); keyH=null; } } };
}

// ======================= GIN RUMMY =======================
const ginVal = c => Math.min(10, c.r);
function ginMelds(cards){
  const out = [], n = cards.length;
  // sets: 3 or 4 of a rank
  const byRank = {};
  cards.forEach((c,i) => (byRank[c.r] = byRank[c.r] || []).push(i));
  Object.values(byRank).forEach(ix => {
    if(ix.length>=3){ if(ix.length===4){ out.push(ix.slice()); for(let k=0;k<4;k++) out.push(ix.filter((_,j)=>j!==k)); } else out.push(ix.slice()); }
  });
  // runs: 3+ in a row, same suit, Ace low
  for(const s of SUITS){
    const ix = cards.map((c,i)=>i).filter(i=>cards[i].s===s).sort((a,b)=>cards[a].r-cards[b].r);
    for(let a=0;a<ix.length;a++){
      let run=[ix[a]];
      for(let b=a+1;b<ix.length && cards[ix[b]].r===cards[run[run.length-1]].r+1;b++){ run.push(ix[b]); if(run.length>=3) out.push(run.slice()); }
    }
  }
  return out.map(m => ({m, mask:m.reduce((a,i)=>a|(1<<i),0)}));
}
function ginAnalyze(cards){
  const n=cards.length, ms=ginMelds(cards); let best=null;
  const rec = (decided, dw, chosen) => {
    if(best && dw>=best.dw) return;
    let i=0; while(i<n && (decided>>i)&1) i++;
    if(i===n){ best={dw, melds:chosen.slice()}; return; }
    for(const x of ms) if(((x.mask>>i)&1) && !(x.mask&decided)){ chosen.push(x.m); rec(decided|x.mask, dw, chosen); chosen.pop(); }
    rec(decided|(1<<i), dw+ginVal(cards[i]), chosen);
  };
  rec(0,0,[]);
  const used = new Set(best.melds.flat());
  best.dead = cards.map((_,i)=>i).filter(i=>!used.has(i));
  return best;
}
// For an 11-card hand: which card to throw to leave the least deadwood.
function ginBestDiscard(hand, banned){
  let best=null;
  hand.forEach((c,i) => {
    if(banned && c===banned) return;
    const a = ginAnalyze(hand.filter((_,j)=>j!==i));
    if(!best || a.dw<best.dw || (a.dw===best.dw && ginVal(c)>ginVal(hand[best.i]))) best={i, dw:a.dw};
  });
  return best;
}

function Gin(root, ui){
  const wrap = h('div','gin'); root.appendChild(wrap);
  const fx = Motion(wrap);
  const TARGET = 100;
  let H, stock, discard, turn, phase, sel, took, score, msg, timer, starter, result, handNo;
  const later = (fn,ms) => { clearTimeout(timer); timer=setTimeout(fn,ms); };
  const sortHand = hand => hand.sort((a,b)=> SUITS.indexOf(a.s)-SUITS.indexOf(b.s) || a.r-b.r);
  function newGame(){ clearTimeout(timer); score=[0,0]; starter=0; handNo=0; wrap.innerHTML=''; deal(); }
  function deal(){
    const d = shuffle(makeDeck()).map(c=>({...c, up:true}));
    H = [[],[]]; for(let k=0;k<10;k++){ H[0].push(d.pop()); H[1].push(d.pop()); } sortHand(H[0]);
    discard=[d.pop()]; stock=d; sel=null; took=null; result=null; handNo++;
    turn=starter; phase='deal'; msg='Dealing…';
    fx.sweep('stock'); fx.deal(45); render();
    later(() => {
      phase = turn===0 ? 'draw' : 'cpu';
      msg = turn===0 ? 'Your turn. Draw from the deck or take the top discard.' : '';
      render(); if(turn===1) later(cpu, 700);
    }, fx.left() + 150);
  }
  function draw(from){
    if(turn!==0 || phase!=='draw') return;
    if(from==='stock'){ if(stock.length<=2) return endDraw(); const c=stock.pop(); H[0].push(c); took=null; msg=`You drew the ${rankLabel(c.r)}${c.s}. Pick a card to discard, or knock.`; }
    else { const c=discard.pop(); H[0].push(c); took=c; msg=`You took the ${rankLabel(c.r)}${c.s}. Pick a card to discard, or knock.`; }
    sortHand(H[0]); phase='discard'; sel=null; render();
  }
  // Throwing a card away always names the pile: pick the card, then tap the discard pile (or drag it there).
  function dropOnDiscard(i){ if(turn!==0 || phase!=='discard') return false; if(H[0][i]===took){ msg="You can't throw back the card you just picked up."; render(); return false; } sel=i; doDiscard(false); return true; }
  function select(i){ if(turn!==0 || phase!=='discard') return; if(H[0][i]===took){ msg="You can't throw back the card you just picked up."; return render(); } sel = sel===i ? null : i; render(); }
  function doDiscard(knock){
    if(sel==null) return;
    const c = H[0].splice(sel,1)[0]; sel=null;
    if(knock){ const a=ginAnalyze(H[0]); if(a.dw>10){ H[0].push(c); sortHand(H[0]); return; } discard.push(c); return showdown(0); }
    discard.push(c); took=null;
    if(stock.length<=2) return endDraw();
    turn=1; phase='cpu'; render(); later(cpu, 850);
  }
  function cpu(){
    const me=H[1], top=discard[discard.length-1];
    const now = ginAnalyze(me).dw;
    const withTop = ginBestDiscard([...me, top], top);
    let from='stock';
    if(withTop.dw < now - 2 || ginMelds([...me, top]).some(x => x.m.includes(me.length))) from='discard';
    let c;
    if(from==='discard'){ c=discard.pop(); took=c; } else { if(stock.length<=2) return endDraw(); c=stock.pop(); took=null; }
    me.push(c);
    msg = from==='discard' ? `Computer takes your ${rankLabel(c.r)}${c.s}…` : 'Computer draws…';
    render();
    later(() => cpuDiscard(from, c), 750);
  }
  function cpuDiscard(from, c){
    const me=H[1];
    const pick = ginBestDiscard(me, took);
    const thrown = me.splice(pick.i,1)[0]; discard.push(thrown);
    const what = from==='discard' ? `took your ${rankLabel(c.r)}${c.s}` : 'drew from the deck';
    const turnsIn = 20 - stock.length/2;
    if(pick.dw===0 || (pick.dw<=10 && (pick.dw<=5 || turnsIn>8))){ msg=`Computer ${what} and threw the ${rankLabel(thrown.r)}${thrown.s}.`; took=null; return showdown(1); }
    took=null;
    if(stock.length<=2) return endDraw();
    msg = `Computer ${what} and threw the ${rankLabel(thrown.r)}${thrown.s}. Your turn.`;
    turn=0; phase='draw'; render();
  }
  function endDraw(){ phase='over'; result={draw:true}; msg='The deck ran down to two cards, so this hand is a wash. No points.'; render(); }
  function showdown(k){
    const d = 1-k;
    const ka = ginAnalyze(H[k]), da = ginAnalyze(H[d]);
    const kMelds = ka.melds.map(m => m.map(i=>H[k][i]));
    let dDead = da.dead.map(i=>H[d][i]), laid=[];
    const gin = ka.dw===0;
    if(!gin){
      let changed=true;
      while(changed){ changed=false;
        for(const c of dDead.slice()){
          for(const m of kMelds){
            const isSet = m.every(x=>x.r===m[0].r);
            const rs = m.map(x=>x.r);
            const fits = isSet ? (m.length<4 && c.r===m[0].r) : (c.s===m[0].s && (c.r===Math.min(...rs)-1 || c.r===Math.max(...rs)+1));
            if(fits){ m.push(c); laid.push(c); dDead.splice(dDead.indexOf(c),1); changed=true; break; }
          }
        }
      }
    }
    const dDw = dDead.reduce((s,c)=>s+ginVal(c),0);
    let winner, pts, why;
    if(gin){ winner=k; pts=25+dDw; why='Gin! 25 bonus plus the other hand\'s deadwood'; }
    else if(ka.dw < dDw){ winner=k; pts=dDw-ka.dw; why=`Knock with ${ka.dw} against ${dDw} deadwood`; }
    else { winner=d; pts=ka.dw-dDw+25; why=`Undercut! ${dDw} deadwood beat the knock of ${ka.dw}, plus a 25 bonus`; }
    score[winner]+=pts; starter = winner;
    result = {k, gin, winner, pts, why, laid, melds:[kMelds, da.melds.map(m=>m.map(i=>H[d][i]))], dead:[ka.dead.map(i=>H[k][i]), dDead]};
    phase='over';
    const who = winner===0 ? 'You score' : 'Computer scores';
    msg = `<span class="${winner===0?'win':'lose'}">${who} ${pts}.</span> ${why}.`;
    render();
  }
  function groupsFor(hand){
    const a = ginAnalyze(hand);
    return { a, groups:[...a.melds.map(m => ({meld:true, idx:m.slice().sort((x,y)=>hand[x].r-hand[y].r)})), {meld:false, idx:a.dead}] };
  }
  function fan(cards, opts={}){
    const g = h('div','gin-group' + (opts.meld ? ' meld':'' ) + (opts.cls ? ' '+opts.cls:''));
    cards.forEach(c => { const el=cardEl(c, true); el.dataset.from='stock'; g.appendChild(el); });
    return g;
  }
  const render = () => fx.run(paint);
  function paint(){
    wrap.innerHTML='';
    const top = h('div','seat');
    top.appendChild(h('div','label', `Computer · ${score[1]} points`));
    if(phase==='over' && result && !result.draw){
      const k=result.k, melds = k===1 ? result.melds[0] : result.melds[1], dead = k===1 ? result.dead[0] : result.dead[1];
      const row=h('div','gin-hand'); melds.forEach(m=>row.appendChild(fan(m,{meld:true}))); if(dead.length) row.appendChild(fan(dead,{cls:'dead'})); top.appendChild(row);
    } else { const row=h('div','hand overlap'); H[1].forEach((c,i)=>{ const el=cardEl(c,false); el.dataset.from='stock'; el.dataset.order=i*2+1; row.appendChild(el); }); top.appendChild(row); }
    wrap.appendChild(top);
    const mid=h('div','mid');
    const st = stock.length ? cardEl({},false) : h('div','slot');
    if(turn===0 && phase==='draw'){ st.classList.add('can','live'); st.setAttribute('role','button'); st.setAttribute('aria-label','Draw from the deck'); st.addEventListener('click',()=>draw('stock')); }
    const pile = pileEl(discard, {from:'stock', order:30}), dc = pile.lastChild;
    if(turn===0 && phase==='draw' && discard.length){ dc.classList.add('can','live'); dc.setAttribute('role','button'); dc.setAttribute('aria-label','Take the discard'); dc.addEventListener('click',()=>draw('discard')); }
    if(turn===0 && phase==='discard'){ pile.classList.add('can'); pile.setAttribute('role','button'); pile.setAttribute('aria-label','Discard the picked card'); pile.addEventListener('click',()=>{ if(sel!=null) doDiscard(false); }); }
    const col=(el,label)=>{ const s=h('div','seat'); s.style.width='auto'; s.append(el, h('div','label',label)); return s; };
    const sc = col(st, `Deck · ${stock.length}`); sc.dataset.anchor='stock';
    const dcol = col(pile,'Discard'); dcol.dataset.drop='disc';
    mid.append(sc, dcol);
    wrap.appendChild(mid);
    // your hand, grouped into melds + deadwood
    const me=h('div','seat');
    let dwText='';
    if(phase==='over' && result && !result.draw){
      const k=result.k, melds = k===0 ? result.melds[0] : result.melds[1], dead = k===0 ? result.dead[0] : result.dead[1];
      const row=h('div','gin-hand'); melds.forEach(m=>row.appendChild(fan(m,{meld:true}))); if(dead.length) row.appendChild(fan(dead,{cls:'dead'})); me.appendChild(row);
      if(result.laid.length) me.appendChild(h('div','label', `Laid off: ${result.laid.map(c=>rankLabel(c.r)+c.s).join(' ')}`));
    } else {
      const {a, groups} = groupsFor(H[0]);
      const row=h('div','gin-hand');
      groups.forEach(gp => {
        if(!gp.idx.length) return;
        const g=h('div','gin-group' + (gp.meld?' meld':' dead'));
        gp.idx.forEach(i => { const el=cardEl(H[0][i]); el.dataset.from='stock'; el.dataset.order=i*2;
          if(phase==='discard' && turn===0){ el.classList.add('can'); if(H[0][i]===took) el.classList.add('dim'); el.setAttribute('role','button');
            dragCard(el, { tap: () => select(i), drop: () => dropOnDiscard(i) }); }
          if(sel===i) el.classList.add('sel'); g.appendChild(el); });
        row.appendChild(g);
      });
      me.appendChild(row);
      dwText = H[0].length===10 ? `Deadwood ${a.dw}` : '';
    }
    me.appendChild(h('div','label', `You · ${score[0]} points${dwText ? ' · '+dwText : ''}`));
    wrap.appendChild(me);
    const ctr=h('div','controls');
    if(phase==='discard' && turn===0){
      const after = sel!=null ? ginAnalyze(H[0].filter((_,j)=>j!==sel)).dw : null;
      const d=h('button','btn primary', sel==null ? 'Pick a card, then the discard pile' : `Discard ${rankLabel(H[0][sel].r)}${H[0][sel].s}`); d.disabled = sel==null; d.addEventListener('click',()=>doDiscard(false));
      const k=h('button','btn hot', after===0 ? 'Go gin!' : `Knock${after!=null ? ` (${after} deadwood)` : ''}`); k.disabled = after==null || after>10; k.addEventListener('click',()=>doDiscard(true));
      ctr.append(d,k);
    }
    if(phase==='over'){
      if(score[0]>=TARGET || score[1]>=TARGET){
        const box=h('div','sp-over'); const won=score[0]>score[1];
        box.innerHTML=`<h3>${won?'You win':'Computer wins'}</h3><p>Final score ${score[0]} to ${score[1]} after ${handNo} hands.</p>`;
        const b=h('button','btn primary big','New game'); b.addEventListener('click',newGame); box.appendChild(b); wrap.appendChild(box);
      } else { const b=h('button','btn primary big','Next hand'); b.addEventListener('click',()=>{ if(phase==='over') deal(); }); ctr.appendChild(b); }
    }
    wrap.appendChild(ctr);
    ui.status(phase==='cpu' && !/^Computer (draws|takes)/.test(msg) ? 'Computer is thinking…' : msg + ` <span class="label" style="margin-left:auto">First to ${TARGET}</span>`);
  }
  return { newGame, stop(){ clearTimeout(timer); } };
}

buildMenu(); route();
})();
</script>
<script>
// Offline support: cache the table so it opens with no signal (online play still needs a connection).
if('serviceWorker' in navigator && location.protocol !== 'file:'){
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
// Install ticket. Chrome/Edge/Android fire beforeinstallprompt; iPhone and iPad need Share > Add to Home Screen.
(() => {
  const box = document.getElementById('install'), btn = document.getElementById('installbtn');
  const how = document.getElementById('installhow'), no = document.getElementById('installno');
  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  let dismissed = false; try{ dismissed = localStorage.getItem('shuffle:installNo') === '1'; }catch(e){}
  if(standalone || dismissed) return;
  let deferred = null;
  no.addEventListener('click', () => { box.hidden = true; try{ localStorage.setItem('shuffle:installNo','1'); }catch(e){} });
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred = e; box.hidden = false; });
  window.addEventListener('appinstalled', () => { box.hidden = true; deferred = null; });
  btn.addEventListener('click', async () => {
    if(!deferred) return;
    deferred.prompt(); const r = await deferred.userChoice.catch(() => null); deferred = null;
    if(r && r.outcome === 'accepted') box.hidden = true;
  });
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if(ios){
    how.innerHTML = 'Tap <strong>Share</strong>, then <strong>Add to Home Screen</strong>. It opens full screen and works offline.';
    btn.hidden = true; box.hidden = false;
  }
})();
</script>
