<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Shuffle Club</title>
<meta name="description" content="Nine card games on one table. Race the computer, pass the phone, or play a friend online.">
<meta name="theme-color" content="#2443d6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Shuffle Club">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: a printed-poster card table. Cobalt halftone ground, cream card stock, ink outlines with hard offset shadows,
   tomato + butter as the two inks. Menu is a loose spread of oversized "game cards"; each game is one centred table column.
   Single committed look (works on any host theme). */
:root{
  --cobalt:#2443d6; --cobalt-deep:#172d9c; --dot:#3a58ec;
  --paper:#fff3d6; --paper-2:#f6e6bf; --ink:#15131c;
  --tomato:#ff4b2b; --red-suit:#d8321a; --butter:#ffd23f;
  --text:#fff8e6; --muted:#c9d1ff;
  --good:#9df2b0; --bad:#ffb4a3;
  --display:"Big Shoulders Display", "Oswald", "Arial Narrow", Impact, sans-serif;
  --body:"Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --line:3px solid var(--ink);
  --pop:4px 4px 0 var(--ink);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  background-color:var(--cobalt);
  background-image:radial-gradient(var(--dot) 1.2px, transparent 1.6px);
  background-size:9px 9px;
  color:var(--text);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-top:max(18px, calc(env(safe-area-inset-top, 0px) + 10px));padding-bottom:max(48px, calc(env(safe-area-inset-bottom, 0px) + 24px));
  -webkit-tap-highlight-color:transparent;
}
.wrap{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--butter);outline-offset:3px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;text-transform:uppercase;line-height:.9}

/* Masthead */
.mast{display:flex;align-items:flex-end;justify-content:space-between;gap:10px 18px;flex-wrap:wrap}
.mast h1{font-size:clamp(46px,11vw,92px);font-weight:900;color:var(--butter);letter-spacing:.01em;
  text-shadow:3px 3px 0 var(--ink), 6px 6px 0 var(--tomato);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill}
.mast p{margin:0 0 6px;max-width:28ch;font-weight:500;color:var(--paper)}
.mast.small h1{font-size:34px;text-shadow:2px 2px 0 var(--ink), 4px 4px 0 var(--tomato);-webkit-text-stroke:1.5px var(--ink)}
.mast.small p{display:none}

/* Menu: spread of game cards */
.spread{display:flex;flex-wrap:wrap;justify-content:center;gap:22px 18px;padding-block:8px}
.gcard{position:relative;width:min(220px, calc(50% - 9px));aspect-ratio:5/7;background:var(--paper);color:var(--ink);border:var(--line);border-radius:14px;
  box-shadow:var(--pop);text-align:left;padding:12px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;
  transition:transform .18s cubic-bezier(.3,1.6,.5,1), box-shadow .18s}
.gcard:nth-child(odd){transform:rotate(-2.5deg)} .gcard:nth-child(even){transform:rotate(2deg) translateY(6px)}
.gcard:hover,.gcard:focus-visible{transform:rotate(0) translateY(-6px);box-shadow:7px 9px 0 var(--ink)}
.gcard .glyph{font-family:var(--display);font-weight:900;font-size:clamp(64px,15vw,104px);line-height:.82;letter-spacing:-.02em}
.gcard .glyph.r{color:var(--red-suit)}
.gcard .corner{position:absolute;right:-14px;bottom:-34px;font-size:150px;line-height:1;opacity:.12;pointer-events:none}
.gcard h2{font-size:30px;font-weight:900}
.gcard p{margin:4px 0 0;font-size:12.5px;line-height:1.35;color:#3b3546}
.gcard .tag{display:inline-block;margin-top:8px;font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;border:2px solid var(--ink);border-radius:999px;padding:1px 8px}
.gcard.hero{background:var(--tomato);color:var(--ink)}
.gcard.hero p{color:var(--ink)}
.gcard.hero .tag{background:var(--butter)}
.note{color:var(--muted);font-size:13px;margin:0;text-align:center}

/* Game chrome */
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bar h2{font-size:clamp(34px,8vw,48px);font-weight:900;flex:1;min-width:0;color:var(--paper)}
.btn{background:var(--paper);color:var(--ink);border:var(--line);border-radius:10px;padding:7px 14px;font-weight:700;font-size:14px;box-shadow:3px 3px 0 var(--ink);transition:transform .08s, box-shadow .08s}
.btn:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.btn:active:not(:disabled){transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.primary{background:var(--butter)}
.btn.hot{background:var(--tomato)}
.btn.big{font-family:var(--display);font-size:24px;font-weight:900;text-transform:uppercase;padding:10px 22px;letter-spacing:.02em}
.btn:disabled{opacity:.45;cursor:not-allowed}
.status{background:var(--ink);color:var(--paper);border-radius:12px;padding:10px 14px;min-height:46px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.status b{color:var(--butter)}
.status .win,.win{color:var(--good)} .status .lose,.lose{color:var(--bad)}
details.rules{font-size:14px;background:var(--cobalt-deep);border:2px solid var(--ink);border-radius:12px;padding:8px 14px}
details.rules summary{cursor:pointer;font-weight:600}
details.rules p{margin:8px 0;max-width:65ch;color:var(--paper)}
.board{position:relative;min-height:300px}
.controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.label{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* Cards: poster style. Rank strip top-left, oversized cropped suit (or outlined court letter) bottom-right. */
.card{--h:calc(var(--cw) * 1.4);width:var(--cw);height:var(--h);border-radius:calc(var(--cw) * .1);background:var(--paper);color:var(--ink);
  position:relative;flex:none;overflow:hidden;border:2px solid var(--ink);box-shadow:2px 3px 0 #15131c66;
  font-family:var(--display);font-weight:900;user-select:none;-webkit-user-select:none;transition:transform .12s, box-shadow .12s}
.card.red{color:var(--red-suit)}
.card .idx{position:absolute;top:calc(var(--cw) * .04);left:calc(var(--cw) * .08);font-size:calc(var(--cw) * .34);line-height:1;letter-spacing:-.02em;display:flex;align-items:baseline;gap:.04em}
.card .idx b{font-family:var(--body);font-size:.66em;font-weight:400}
.card .big{position:absolute;right:calc(var(--cw) * -.1);bottom:calc(var(--cw) * -.3);font-family:var(--body);font-size:calc(var(--cw) * 1.08);line-height:1}
.card .big.court{font-family:var(--display);font-weight:900;font-size:calc(var(--cw) * 1.05);right:calc(var(--cw) * -.06);bottom:calc(var(--cw) * -.2);color:transparent;-webkit-text-stroke:2px currentColor}
.card.red .big.court{-webkit-text-stroke-color:var(--red-suit)}
.card .big.ace{right:auto;left:50%;bottom:50%;transform:translate(-50%,58%);font-size:calc(var(--cw) * .9)}
.card.back{background-color:var(--tomato);background-image:radial-gradient(var(--butter) 22%, transparent 26%);background-size:calc(var(--cw) * .16) calc(var(--cw) * .16);
  box-shadow:inset 0 0 0 calc(var(--cw) * .05) var(--paper), 2px 3px 0 #15131c66}
.card.back::after{content:"";position:absolute;inset:26% 22%;border-radius:50%;background:var(--ink);box-shadow:0 0 0 calc(var(--cw) * .04) var(--paper)}
.card.sel{box-shadow:0 0 0 3px var(--butter), 4px 6px 0 var(--ink);transform:translateY(-4px)}
.card.can{cursor:pointer}
.card.can:hover{transform:translateY(-4px)}
.card.dim{filter:saturate(.4) brightness(.8)}
.slot{width:var(--cw);height:calc(var(--cw) * 1.4);border-radius:calc(var(--cw) * .1);border:2px dashed #ffffff66;position:relative;display:grid;place-items:center;color:#ffffff88;font-family:var(--display);font-weight:900;font-size:calc(var(--cw) * .42)}
.slot.hot{border-color:var(--butter);color:var(--butter)}
.abs{position:absolute;left:0}

/* Klondike */
.kl{--cw:min(84px, calc((min(100vw, 780px) - 32px - 6 * 8px) / 7));display:flex;flex-direction:column;gap:20px}
.kl .row{display:grid;grid-template-columns:repeat(7,var(--cw));gap:8px;justify-content:center}
.kl .pile{position:relative;width:var(--cw)}
.kl .stock{cursor:pointer}
.kl .count{position:absolute;bottom:-19px;left:0;right:0;text-align:center;font-size:11px;color:var(--muted);font-family:var(--body);font-weight:600}

/* Hands (Blackjack / War / Eights) */
.felt{--cw:min(80px, 19vw);display:flex;flex-direction:column;gap:18px;align-items:center}
.seat{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%}
.hand{display:flex;justify-content:center;min-height:calc(var(--cw) * 1.4);padding-inline:calc(var(--cw) * .2)}
.hand.overlap .card + .card{margin-left:calc(var(--cw) * -.5)}
.hand.wrapgap{flex-wrap:wrap;gap:6px}
.total{font-family:var(--display);font-size:22px;font-weight:900;color:var(--paper);font-variant-numeric:tabular-nums}
.chips{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.chip{width:58px;height:58px;border-radius:50%;border:var(--line);font-family:var(--display);font-weight:900;font-size:20px;display:grid;place-items:center;box-shadow:3px 3px 0 var(--ink);
  background-image:repeating-conic-gradient(#fff3d6 0 12deg, transparent 12deg 45deg);color:var(--ink);transition:transform .12s}
.chip:hover:not(:disabled){transform:translateY(-3px) rotate(8deg)}
.chip:disabled{opacity:.35;cursor:not-allowed}
.chip.c5{background-color:var(--tomato)}.chip.c10{background-color:#7cc6ff}.chip.c25{background-color:#8be0a4}.chip.c100{background-color:var(--butter)}
.bank{display:flex;gap:22px;justify-content:center;font-variant-numeric:tabular-nums}
.bank div{text-align:center}
.bank strong{display:block;font-family:var(--display);font-size:30px;font-weight:900;color:var(--butter);line-height:1}
.mid{display:flex;align-items:center;justify-content:center;gap:22px;flex-wrap:wrap}
.suitpick{display:flex;gap:8px;justify-content:center}
.suitpick button{width:54px;height:54px;border-radius:12px;background:var(--paper);border:var(--line);box-shadow:3px 3px 0 var(--ink);font-size:28px;color:var(--ink)}
.suitpick button.r{color:var(--red-suit)}
.suitbadge{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.suitbadge span{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:8px;background:var(--paper);border:2px solid var(--ink);color:var(--ink);font-size:18px;margin-left:6px;vertical-align:middle;letter-spacing:0}
.suitbadge span.r{color:var(--red-suit)}

/* Memory */
.mem{--cw:min(84px, calc((min(100vw, 780px) - 32px - 3 * 10px) / 4));display:grid;grid-template-columns:repeat(4,var(--cw));gap:10px;justify-content:center}
.mem .card{cursor:pointer}
.mem .card.done{opacity:.3;cursor:default}

/* ---------- Speed ---------- */
.speed{--cw:min(100px, calc((min(100vw, 780px) - 32px - 4 * 10px) / 5));display:flex;flex-direction:column;align-items:center;gap:14px;position:relative}
.sp-modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;width:100%}
.mode{background:var(--paper);color:var(--ink);border:var(--line);border-radius:14px;box-shadow:var(--pop);padding:16px;display:flex;flex-direction:column;gap:10px}
.mode h3{font-size:32px;font-weight:900}
.mode p{margin:0;font-size:13.5px;color:#3b3546}
.mode .row{display:flex;gap:8px;flex-wrap:wrap}
.mode .btn{box-shadow:2px 2px 0 var(--ink)}
.mode.alt{background:var(--butter)}
.mode.dark{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.mode.dark p{color:var(--muted)}
.mode input{font:inherit;font-family:var(--display);font-weight:900;font-size:26px;letter-spacing:.2em;text-transform:uppercase;width:7.5ch;padding:4px 10px;border:var(--line);border-radius:10px;background:var(--paper);color:var(--ink)}
.code{font-family:var(--display);font-weight:900;font-size:64px;letter-spacing:.14em;color:var(--butter);line-height:1;text-shadow:3px 3px 0 var(--ink)}
.sp-side{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%}
.sp-side.flip{transform:rotate(180deg)}
.sp-hand{display:grid;grid-template-columns:repeat(5,var(--cw));gap:10px;justify-content:center}
.sp-hand .card{cursor:pointer}
.sp-hand .card.live{box-shadow:0 0 0 3px var(--butter), 3px 4px 0 var(--ink)}
.sp-hand .card.nope{animation:nope .3s}
.sp-meta{display:flex;align-items:center;gap:12px;font-weight:600;font-size:13px;color:var(--paper)}
.sp-meta .pill{background:var(--ink);border-radius:999px;padding:2px 10px;font-variant-numeric:tabular-nums}
.sp-meta kbd{font:inherit;font-size:11px;color:var(--muted)}
.sp-opp{display:flex;justify-content:center}
.sp-opp .card{--cw:min(54px, 12vw)}
.sp-opp .card + .card{margin-left:-20px}
.sp-center{display:grid;grid-template-columns:repeat(4,var(--cw));gap:10px;justify-content:center;align-items:end;padding-block:6px}
.sp-pile{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px}
.sp-pile .n{font-size:11px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.sp-pile.center .card,.sp-pile.center .slot{transform:scale(1.04)}
.sp-pile .land{animation:land .22s cubic-bezier(.3,1.7,.6,1)}
.sp-banner{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:5}
.sp-banner span{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:clamp(56px,16vw,120px);color:var(--butter);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:5px 5px 0 var(--tomato);animation:bang .4s cubic-bezier(.3,1.6,.5,1)}
.sp-banner.small span{font-size:clamp(34px,9vw,64px)}
.sp-over{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;background:var(--paper);color:var(--ink);border:var(--line);border-radius:16px;box-shadow:var(--pop);padding:22px;max-width:420px;width:100%}
.sp-over h3{font-size:56px;font-weight:900}
.sp-over p{margin:0}

/* ---------- Hold'em ---------- */
.pk{--cw:min(74px, calc((min(100vw, 780px) - 32px - 4 * 8px) / 5));display:flex;flex-direction:column;gap:16px;align-items:center}
.pk-opps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%}
.pk-seat{background:var(--cobalt-deep);border:2px solid var(--ink);border-radius:12px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;transition:transform .15s}
.pk-seat .pk-hole{--cw:min(42px, 10vw)}
.pk-seat.turn,.pk-you.turn{box-shadow:0 0 0 3px var(--butter);transform:translateY(-2px)}
.pk-seat.folded,.pk-seat.out{opacity:.45}
.pk-seat.won,.pk-you .pk-act:not(:empty){}
.pk-hole{display:flex;gap:4px}
.pk-hole.big{--cw:min(92px, 22vw);gap:8px}
.pk-name{font-family:var(--display);font-weight:900;font-size:20px;text-transform:uppercase;line-height:1;display:flex;align-items:center;gap:6px}
.dbtn{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--paper);color:var(--ink);border:2px solid var(--ink);font-size:12px;font-family:var(--body);font-weight:700}
.pk-chips,.pk-stack{font-family:var(--display);font-weight:900;font-size:22px;color:var(--butter);font-variant-numeric:tabular-nums;line-height:1}
.pk-stack{font-size:30px}
.pk-act{font-size:12px;font-weight:600;color:var(--paper);background:var(--ink);border-radius:999px;padding:1px 9px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.pk-seat.won .pk-act,.pk-you.won .pk-act{background:var(--good);color:var(--ink)}
.pk-hn{font-size:12px;font-weight:600;color:var(--muted);text-align:center}
.pk-mid{display:flex;flex-direction:column;align-items:center;gap:8px;background:#15131c33;border:2px dashed #ffffff44;border-radius:999px;padding:14px 28px;max-width:100%}
.pk-pot{display:flex;align-items:baseline;gap:8px}
.pk-pot strong{font-family:var(--display);font-weight:900;font-size:38px;color:var(--butter);line-height:1;text-shadow:2px 2px 0 var(--ink)}
.pk-board{display:grid;grid-template-columns:repeat(5,var(--cw));gap:8px}
.pk-you{display:flex;align-items:center;gap:16px;background:var(--cobalt-deep);border:2px solid var(--ink);border-radius:14px;padding:10px 14px;transition:transform .15s}
.pk-you.folded .pk-hole{opacity:.45}
.pk-info{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-width:0}
.pk-info .pk-hn{text-align:left;color:var(--paper);font-size:13px}
.pk-ctrl{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;min-height:60px}
.pk-size{display:flex;flex-direction:column;align-items:center;gap:8px;width:min(100%,420px)}
.pk-size input{width:100%;accent-color:var(--tomato)}
.pk-quick{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.pk-quick .btn{padding:4px 10px;font-size:12.5px;box-shadow:2px 2px 0 var(--ink)}
@media (max-width:480px){ .pk-mid{border-radius:18px;padding:10px 12px} .pk-name{font-size:16px} .pk-chips{font-size:18px} }

/* ---------- Golf ---------- */
.golf{--cw:min(74px, 18vw);display:flex;flex-direction:column;gap:16px;align-items:center}
.golf-grid{display:grid;grid-template-columns:repeat(3,var(--cw));gap:8px}
.golf .live{box-shadow:0 0 0 3px var(--butter), 3px 4px 0 var(--ink)}

/* ---------- Ratscrew ---------- */
.rat{--cw:min(110px, 26vw);display:flex;flex-direction:column;align-items:center;gap:14px}
.rat-pile{position:relative;width:calc(var(--cw) * 1.9);height:calc(var(--cw) * 1.55);cursor:pointer;touch-action:manipulation}
.rat-pile .slot{margin:0 auto}
.rat .land{animation:land .2s cubic-bezier(.3,1.7,.6,1)}
@keyframes land{from{transform:scale(1.35) rotate(-8deg)}to{transform:scale(1.04)}}
@keyframes bang{from{transform:scale(.4) rotate(-12deg);opacity:0}to{transform:none;opacity:1}}
@keyframes nope{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.flash{animation:nope .4s}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<script src="vendor/peerjs.min.js"></script>
<script src="js/net.js"></script>

<body>

<div class="wrap">
  <header class="mast" id="mast">
    <h1>Shuffle Club</h1>
    <p>Nine card games on one table. Race the computer, pass the phone, or play a friend online.</p>
  </header>

  <main id="menu">
    <div class="spread" id="tiles"></div>
    <p class="note" style="margin-top:18px">Prototype build · scores and bankroll are saved in this browser only</p>
  </main>

  <main id="game" hidden>
    <div style="display:flex;flex-direction:column;gap:14px">
      <div class="bar">
        <button class="btn" id="back" aria-label="Back to all games">← All games</button>
        <h2 id="gtitle"></h2>
        <button class="btn primary" id="newgame">New game</button>
      </div>
      <details class="rules" id="rules"><summary>How to play</summary><div id="rulestext"></div></details>
      <div class="board" id="board"></div>
      <div class="status" id="status"></div>
    </div>
  </main>
</div>
<script>
(() => {
// ---------- Shared card helpers ----------
const SUITS = ['♠','♥','♦','♣'];
const T = '︎'; // force text (not emoji) rendering of suit glyphs
const isRed = s => s === '♥' || s === '♦';
const rankLabel = r => ({1:'A',11:'J',12:'Q',13:'K'})[r] || String(r);
function makeDeck(n = 1){ const d=[]; for(let k=0;k<n;k++) for(const s of SUITS) for(let r=1;r<=13;r++) d.push({s,r,up:false}); return d; }
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function cardEl(c, up = c.up){
  const el = document.createElement('div');
  if(!up){ el.className='card back'; el.setAttribute('aria-label','face-down card'); return el; }
  el.className = 'card' + (isRed(c.s) ? ' red' : '');
  const L = rankLabel(c.r);
  const big = c.r > 10 ? `<span class="big court">${L}</span>` : `<span class="big${c.r===1?' ace':''}">${c.s}${T}</span>`;
  el.innerHTML = `<span class="idx">${L}<b>${c.s}${T}</b></span>${big}`;
  el.setAttribute('aria-label', `${L} of ${c.s}`);
  return el;
}
const h = (tag, cls, html) => { const e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e; };
const store = {
  get(k, d){ try{ const v=localStorage.getItem('shuffle:'+k); return v==null?d:JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('shuffle:'+k, JSON.stringify(v)); }catch(e){} }
};
// Online play. Uses direct peer-to-peer tables (js/net.js); falls back to the claude.ai live room

  (window.ShuffleNet && window.ShuffleNet.available()) ? Promise.resolve(window.ShuffleNet)
  : (window.claude && window.claude.use) ? window.claude.use('room').catch(() => null)

// ======================= SPEED =======================
// Cards are encoded as numbers 0..51 (suit*13 + rank-1) so state is tiny enough to send over the room.
const enc = c => SUITS.indexOf(c.s)*13 + c.r - 1;
const dec = n => ({ s:SUITS[Math.floor(n/13)], r:n%13 + 1, up:true });
const SpeedRules = {
  deal(){
    const d = shuffle(makeDeck()).map(enc);
    return { h:[d.splice(0,5), d.splice(0,5)], dr:[d.splice(0,15), d.splice(0,15)], sd:[d.splice(0,6), d.splice(0,6)], c:[[],[]], phase:'count', n:3, winner:null, seq:0 };
  },
  fits(card, top){ if(top==null) return false; const d = Math.abs(card%13 - top%13); return d===1 || d===12; },
  target(S, p, i){ const card=S.h[p][i]; if(card==null) return -1; for(const k of [0,1]) if(SpeedRules.fits(card, S.c[k][S.c[k].length-1])) return k; return -1; },
  anyMove(S, p){ return S.h[p].some((_,i) => SpeedRules.target(S,p,i) >= 0); },
  play(S, p, i){
    if(S.phase!=='play') return false;
    const k = SpeedRules.target(S,p,i); if(k<0) return false;
    S.c[k].push(S.h[p][i]);
    if(S.dr[p].length) S.h[p][i] = S.dr[p].pop(); else S.h[p].splice(i,1);
    if(!S.h[p].length && !S.dr[p].length){ S.phase='over'; S.winner=p; }
    return true;
  },
  flip(S){
    if(!S.sd[0].length && !S.sd[1].length){
      const pool = shuffle([...S.c[0].slice(0,-1), ...S.c[1].slice(0,-1)]);
      S.c = S.c.map(p => p.slice(-1));
      if(!pool.length){ // nothing left to flip: fewest cards remaining wins
        const left = p => S.h[p].length + S.dr[p].length;
        S.phase='over'; S.winner = left(0)===left(1) ? -1 : (left(0) < left(1) ? 0 : 1); return;
      }
      const half = Math.ceil(pool.length/2); S.sd = [pool.slice(0,half), pool.slice(half)];
    }
    for(const k of [0,1]) if(S.sd[k].length) S.c[k].push(S.sd[k].pop());
  },
  // What a screen needs to draw (also what travels online).
  view(S){ return { h:S.h, d:S.dr.map(x=>x.length), s:S.sd.map(x=>x.length), t:S.c.map(x=>x.length?x[x.length-1]:null), cn:S.c.map(x=>x.length), ph:S.phase, n:S.n, w:S.winner, seq:S.seq }; }
};

function Speed(root, ui){
  const wrap = h('div','speed'); root.appendChild(wrap);
  let mode=null, S=null, timers=[], cpuSpeed=1000, lastTops=[null,null], keyHandler=null;
  // online state
  let room=null, net=null; // net = {role:'host'|'guest', code, guestPeer, unsubs:[]}
  let guestView=null;

  const clearTimers = () => { timers.forEach(t => clearTimeout(t)); timers=[]; cpuTimer=null; };
  const later = (fn, ms) => { const t=setTimeout(fn, ms); timers.push(t); return t; };

  function stop(){
    clearTimers();
    if(keyHandler){ window.removeEventListener('keydown', keyHandler); keyHandler=null; }
    if(net){ net.unsubs.forEach(u => { try{ u(); }catch(e){} }); if(net.room) net.room.leave().catch(()=>{}); net=null; }
  }

  // ----- mode picker -----
  function newGame(){
    if(mode==='cpu' || mode==='local' || (mode==='host' && net && net.guestPeer)) return start(mode);
    stop(); mode=null; S=null; guestView=null;
    wrap.innerHTML='';
    const modes = h('div','sp-modes');
    const cpu = h('div','mode', `<h3>vs Computer</h3><p>Race a computer opponent. Pick how quick its hands are.</p>`);
    const row = h('div','row');
    [['Chill',1500],['Quick',950],['Ruthless',600]].forEach(([t,ms],i) => { const b=h('button','btn'+(i===1?' primary':''), t); b.addEventListener('click',()=>{ cpuSpeed=ms; start('cpu'); }); row.appendChild(b); });
    cpu.appendChild(row);
    const local = h('div','mode alt', `<h3>Two players, one screen</h3><p>Lay a phone or tablet flat between you. The top hand is upside down for the player across the table.</p>`);
    const lb = h('button','btn hot','Start face-off'); lb.addEventListener('click',()=>start('local')); local.appendChild(lb);
    const online = h('div','mode dark', `<h3>Online with a friend</h3><p>One of you hosts and gets a code. The other opens this page, picks Speed, and joins with it.</p>`);
    const orow = h('div','row');
    const host = h('button','btn primary','Host a table');
    const input = h('input'); input.id='joincode'; input.maxLength=4; input.placeholder='CODE'; input.setAttribute('aria-label','Table code'); input.autocomplete='off';
    const join = h('button','btn','Join');
    orow.append(host); const jrow=h('div','row'); jrow.append(input, join);
    const onote = h('p'); onote.style.fontSize='12.5px';
    online.append(orow, jrow, onote);
    host.addEventListener('click', hostGame);
    join.addEventListener('click', () => joinGame(input.value));
    input.addEventListener('keydown', e => { if(e.key==='Enter') joinGame(input.value); });
    modes.append(cpu, local, online); wrap.appendChild(modes);
    ui.status('Pick a mode to deal in.');
    getRoom().then(r => { room=r; if(!r){ host.disabled=join.disabled=input.disabled=true; onote.textContent='Online play could not load. Check your connection and reopen Speed.'; } });
  }

  // ----- local + host game loop -----
  function start(m){
    clearTimers(); mode=m; S=SpeedRules.deal(); lastTops=[null,null];
    bindKeys(); countdown();
  }
  function countdown(){
    S.phase='count'; S.n=3; changed();
    const tick = () => { S.n--; if(S.n>0){ changed(); later(tick, 700); } else { SpeedRules.flip(S); S.phase='play'; changed(); } };
    later(tick, 700);
  }
  function changed(){
    S.seq++;
    if(S.phase==='play' && !SpeedRules.anyMove(S,0) && !SpeedRules.anyMove(S,1)){
      S.phase='stuck';
      later(() => { SpeedRules.flip(S); if(S.phase!=='over') S.phase='play'; changed(); }, 1100);
    }
    render(SpeedRules.view(S), 0);
    if(net && net.role==='host' && net.room) net.room.emit('state', SpeedRules.view(S)).catch(()=>{});
    if(mode==='cpu' && S.phase==='play') scheduleCpu();
  }
  let cpuTimer=null;
  function scheduleCpu(){
    if(cpuTimer) return;
    cpuTimer = later(() => {
      cpuTimer=null;
      if(!S || S.phase!=='play' || mode!=='cpu') return;
      const opts = S.h[1].map((_,i)=>i).filter(i => SpeedRules.target(S,1,i)>=0);
      if(opts.length){ SpeedRules.play(S,1,opts[Math.floor(Math.random()*opts.length)]); changed(); }
      else scheduleCpu();
    }, cpuSpeed*(0.65 + Math.random()*0.7));
  }
  function act(p, i, el){
    if(mode==='guest'){ if(net && net.room) net.room.emit('act', {i}).catch(()=>{}); return; }
    if(!S || S.phase!=='play') return;
    if(SpeedRules.play(S,p,i)) changed();
    else if(el){ el.classList.remove('nope'); void el.offsetWidth; el.classList.add('nope'); }
  }
  function bindKeys(){
    if(keyHandler) return;
    keyHandler = e => {
      if(e.target && e.target.tagName==='INPUT') return;
      const k='1234567890'.indexOf(e.key); if(k<0) return;
      if(k<5) act(mode==='guest'?1:0, k, wrap.querySelectorAll('.sp-side.me .card')[k]);
      else if(mode==='local') act(1, k-5, wrap.querySelectorAll('.sp-side.top .card')[k-5]);
    };
    window.addEventListener('keydown', keyHandler);
  }

  // ----- drawing -----
  function render(v, me){
    const opp = 1-me;
    wrap.innerHTML='';
    if(v.ph==='over') return renderOver(v, me);
    const live = (p) => v.ph==='play' ? v.h[p].map(c => [0,1].some(k => v.t[k]!=null && SpeedRules.fits(c, v.t[k]))) : [];
    const handRow = (p, interactive) => {
      const row = h('div','sp-hand'); const lv = live(p);
      for(let i=0;i<5;i++){
        const c = v.h[p][i];
        if(c==null){ row.appendChild(h('div','slot')); continue; }
        const el = cardEl(dec(c));
        if(interactive){ if(lv[i]) el.classList.add('live'); el.setAttribute('role','button'); el.addEventListener('pointerdown', e => { e.preventDefault(); act(p, i, el); }); }
        row.appendChild(el);
      }
      return row;
    };
    const left = p => v.h[p].length + v.d[p];
    // Top: opponent (upside-down hand in local mode, card backs otherwise)
    if(mode==='local'){
      const top = h('div','sp-side top flip');
      top.append(handRow(opp, true), h('div','sp-meta', `<span class="pill">Player 2 · ${left(opp)} left</span><kbd>keys 6–0</kbd>`));
      wrap.appendChild(top);
    } else {
      const top = h('div','sp-side');
      const o = h('div','sp-opp'); for(let i=0;i<v.h[opp].length;i++) o.appendChild(cardEl({}, false));
      if(!v.h[opp].length) o.appendChild(h('div','slot'));
      const who = mode==='cpu' ? 'Computer' : 'Friend';
      top.append(h('div','sp-meta', `<span class="pill">${who} · ${left(opp)} left</span>`), o);
      wrap.appendChild(top);
    }
    // Centre row: side, centre, centre, side
    const centre = h('div','sp-center');
    const side = k => { const p=h('div','sp-pile'); p.append(v.s[k] ? cardEl({},false) : h('div','slot'), h('div','n', `${v.s[k]} spare`)); return p; };
    const pile = k => {
      const p=h('div','sp-pile center');
      const el = v.t[k]!=null ? cardEl(dec(v.t[k])) : h('div','slot','?');
      if(v.t[k]!==lastTops[k] && v.t[k]!=null) el.classList.add('land');
      p.append(el, h('div','n', `${v.cn[k]} played`)); return p;
    };
    centre.append(side(0), pile(0), pile(1), side(1));
    lastTops = v.t.slice();
    wrap.appendChild(centre);
    // Bottom: me
    const bottom = h('div','sp-side me');
    bottom.append(handRow(me, true), h('div','sp-meta', `<span class="pill">${mode==='local'?'Player 1':'You'} · ${left(me)} left</span><kbd>keys 1–5</kbd>`));
    wrap.appendChild(bottom);
    // Banners
    if(v.ph==='count'){ const b=h('div','sp-banner'); b.innerHTML=`<span>${v.n}</span>`; wrap.appendChild(b); }
    if(v.ph==='stuck'){ const b=h('div','sp-banner small'); b.innerHTML='<span>Stuck! Flip</span>'; wrap.appendChild(b); }
    if(v.ph==='wait'){ const b=h('div','sp-banner small'); b.innerHTML='<span>Paused</span>'; wrap.appendChild(b); }
    const st = { count:'Get ready…', play: mode==='local' ? 'Go! Tap a glowing card to play it.' : 'Go! Tap any glowing card to slap it down.', stuck:'Nobody can move. Flipping the spares…', wait: net && net.role==='host' ? 'Your friend left the table.' : 'The host left the table.' }[v.ph] || '';
    ui.status(`${st}${net ? ` <span class="label" style="margin-left:auto">Table ${net.code}</span>` : ''}`);
  }
  function renderOver(v, me){
    const box = h('div','sp-over');
    let title, line;
    if(v.w===-1){ title='Draw'; line='No cards left to flip and you finished level.'; }
    else if(mode==='local'){ title=`Player ${v.w===0?1:2} wins`; line='Every card played. Run it back?'; }
    else if(v.w===me){ title='You win'; line = mode==='cpu' ? 'Faster than the machine.' : 'You emptied your hand first.'; }
    else { title = mode==='cpu' ? 'Computer wins' : 'Friend wins'; line='So close. Again?'; }
    box.innerHTML = `<h3>${title}</h3><p>${line}</p>`;
    const row = h('div','controls');
    if(mode!=='guest'){ const again=h('button','btn primary big','Rematch'); again.addEventListener('click',()=>start(mode)); row.appendChild(again); }
    else row.appendChild(h('p', null, 'Waiting for the host to start a rematch…'));
    const change=h('button','btn','Change mode'); change.addEventListener('click',()=>{ S=null; mode=null; newGame(); }); row.appendChild(change);
    box.appendChild(row); wrap.appendChild(box);
    ui.status(v.w===me && mode!=='local' ? '<span class="win">Winner.</span>' : 'Round over.');
  }

  // ----- online -----
  async function hostGame(){
    room = room || await getRoom(); if(!room) return;
    ui.status('Opening a table…');
    const newCode = () => Array.from({length:4}, () => 'ABCDEFGHJKMNPQRSTUVWXYZ'[Math.floor(Math.random()*23)]).join('');
    let r=null, code='';
    for(let tries=0; tries<3 && !r; tries++){ // a code can already be taken; draw another
      code = newCode();
      try{ r = await room.join('speed-' + code.toLowerCase(), {role:'host'}); }catch(e){ r=null; }
    }
    if(!r){ ui.status('Could not open a table right now. Check your connection and try again.'); return; }
    stop(); mode='host'; net={role:'host', code, room:r, guestPeer:null, unsubs:[]};
    wrap.innerHTML=''; const box=h('div','sp-over');
    box.innerHTML=`<p class="label" style="color:#3b3546">Your table code</p><div class="code">${code}</div><p>Tell your friend to open this page, choose Speed, then join with this code. The game starts as soon as they arrive.</p>`;
    wrap.appendChild(box); ui.status('Waiting for your friend…');
    const begin = () => { mode='host'; S=SpeedRules.deal(); lastTops=[null,null]; bindKeys(); countdown(); mode='host'; };
    net.unsubs.push(r.onPeers(ch => {
      const others = ch.peers.filter(p => !p.sameTab && p.kind==='viewer');
      if(!net.guestPeer && others.length){ net.guestPeer = others[0].peer; begin(); }
      else if(net.guestPeer && ch.left.some(p => p.peer===net.guestPeer)){
        net.guestPeer=null; clearTimers(); if(S && S.phase!=='over'){ S.phase='wait'; render(SpeedRules.view(S),0); }
        ui.status('Your friend left. The game starts again when someone joins with code ' + code + '.');
      }
    }));
    net.unsubs.push(r.on('act', msg => {
      if(msg.sameTab || msg.peer!==net.guestPeer || !S || S.phase!=='play') return;
      const i = msg.data && Number.isInteger(msg.data.i) ? msg.data.i : -1;
      if(i>=0 && i<5 && SpeedRules.play(S,1,i)) changed();
    }));
    net.unsubs.push(r.on('hello', msg => { if(!msg.sameTab && S) r.emit('state', SpeedRules.view(S)).catch(()=>{}); }));
  }
  async function joinGame(raw){
    const code = String(raw||'').trim().toUpperCase().replace(/[^A-Z]/g,'');
    if(code.length!==4){ ui.status('Table codes are 4 letters.'); return; }
    room = room || await getRoom(); if(!room) return;
    ui.status('Looking for table ' + code + '…');
    let r; try{ r = await room.join('speed-' + code.toLowerCase(), {role:'guest'}); }catch(e){ ui.status('Could not reach that table. Check the code, and make sure your friend is still on the code screen.'); return; }
    stop(); mode='guest'; net={role:'guest', code, room:r, unsubs:[]}; lastTops=[null,null]; bindKeys();
    wrap.innerHTML=''; const box=h('div','sp-over'); box.innerHTML=`<div class="code">${code}</div><p>Joined. Waiting for the host to deal…</p>`; wrap.appendChild(box);
    ui.status('Connecting to table ' + code + '…');
    let lastSeq=-1, hostPeer=null;
    net.unsubs.push(r.on('state', msg => {
      if(msg.sameTab) return; const v = msg.data; if(!validView(v)) return;
      if(hostPeer && msg.peer!==hostPeer) return; hostPeer = msg.peer;
      if(v.seq < lastSeq && v.ph!=='count') return; lastSeq = v.seq;
      guestView = v; render(v, 1);
    }));
    net.unsubs.push(r.onPeers(ch => {
      if(hostPeer && ch.left.some(p => p.peer===hostPeer) && guestView){ guestView = {...guestView, ph:'wait'}; render(guestView,1); }
    }));
    r.emit('hello', {}).catch(()=>{});
  }
  function validView(v){
    const okCard = c => Number.isInteger(c) && c>=0 && c<52;
    return v && Array.isArray(v.h) && v.h.length===2 && v.h.every(x => Array.isArray(x) && x.length<=5 && x.every(okCard))
      && Array.isArray(v.t) && v.t.every(c => c===null || okCard(c)) && Array.isArray(v.d) && Array.isArray(v.s) && Array.isArray(v.cn)
      && ['count','play','stuck','over','wait'].includes(v.ph) && Number.isInteger(v.seq);
  }
  return { newGame, stop };
}

// ======================= KLONDIKE =======================
function Klondike(root, ui){
  let S, sel, moves, won;
  const wrap = h('div','kl'); root.appendChild(wrap);
  const top = (a) => a[a.length-1];
  function newGame(){
    const d = shuffle(makeDeck());
    S = {stock:[], waste:[], found:[[],[],[],[]], tab:[[],[],[],[],[],[],[]]};
    for(let i=0;i<7;i++) for(let j=0;j<=i;j++){ const c=d.pop(); c.up = (j===i); S.tab[i].push(c); }
    S.stock = d; sel=null; moves=0; won=false; render();
  }
  const arr = src => src.type==='waste' ? S.waste : src.type==='found' ? S.found[src.i] : S.tab[src.i];
  const cardsOf = src => src.type==='tab' ? S.tab[src.i].slice(src.j) : [top(arr(src))];
  const canFound = (c,f) => f.length ? (top(f).s===c.s && top(f).r===c.r-1) : c.r===1;
  const canTab = (c,p) => { if(!p.length) return c.r===13; const t=top(p); return t.up && isRed(t.s)!==isRed(c.s) && t.r===c.r+1; };
  const same = (a,b) => a && b && a.type===b.type && a.i===b.i && a.j===b.j;
  function tryMove(src, dst){
    if(src.type===dst.type && src.i===dst.i) return false;
    const cards = cardsOf(src);
    if(!cards.length || !cards[0]) return false;
    if(dst.type==='found'){ if(cards.length!==1 || !canFound(cards[0], S.found[dst.i])) return false; }
    else if(!canTab(cards[0], S.tab[dst.i])) return false;
    arr(src).splice(-cards.length); arr(dst).push(...cards);
    S.tab.forEach(p => { if(p.length && !top(p).up) top(p).up = true; });
    moves++; return true;
  }
  function toFoundation(src){ if(cardsOf(src).length!==1) return false; for(let i=0;i<4;i++) if(tryMove(src,{type:'found',i})) return true; return false; }
  function clickStock(){
    if(won) return;
    if(S.stock.length){ const c=S.stock.pop(); c.up=true; S.waste.push(c); }
    else if(S.waste.length){ S.stock = S.waste.reverse().map(c => (c.up=false, c)); S.waste=[]; }
    sel=null; moves++; render();
  }
  function clickSpot(src, selectable){
    if(won) return;
    if(sel){
      if(same(sel, src)){ toFoundation(sel); sel=null; return render(); }
      const dst = src.type==='tab' ? {type:'tab', i:src.i} : src.type==='found' ? {type:'found', i:src.i} : null;
      const ok = dst && tryMove(sel, dst);
      sel = ok ? null : (selectable ? src : null);
      return render();
    }
    if(selectable) sel = src;
    render();
  }
  function render(){
    wrap.innerHTML='';
    const row1 = h('div','row');
    // stock
    const stock = h('div','pile stock'); stock.setAttribute('role','button'); stock.setAttribute('aria-label','Deck');
    stock.appendChild(S.stock.length ? cardEl(top(S.stock), false) : h('div','slot', '↻'));
    stock.appendChild(h('div','count', S.stock.length + ' left'));
    stock.addEventListener('click', clickStock); row1.appendChild(stock);
    // waste
    const waste = h('div','pile');
    if(S.waste.length){
      const el = cardEl(top(S.waste)); el.classList.add('can');
      const src={type:'waste'}; if(same(sel,src)) el.classList.add('sel');
      el.addEventListener('click', () => clickSpot(src, true));
      el.addEventListener('dblclick', e => { e.preventDefault(); sel=null; toFoundation(src); render(); });
      waste.appendChild(el);
    } else waste.appendChild(h('div','slot'));
    row1.appendChild(waste); row1.appendChild(h('div','pile'));
    // foundations
    S.found.forEach((f,i) => {
      const p = h('div','pile'); const src={type:'found', i};
      if(f.length){ const el=cardEl(top(f)); el.classList.add('can'); if(same(sel,src)) el.classList.add('sel'); p.appendChild(el); el.addEventListener('click', () => clickSpot(src, true)); }
      else { const sl=h('div','slot' + (sel?' hot':''), 'A'); sl.addEventListener('click', () => clickSpot(src,false)); p.appendChild(sl); }
      row1.appendChild(p);
    });
    wrap.appendChild(row1);
    // tableau
    const row2 = h('div','row');
    S.tab.forEach((pile,i) => {
      const p = h('div','pile');
      const base = h('div','slot' + (sel && !pile.length ? ' hot':''), pile.length?'':'K');
      base.addEventListener('click', () => clickSpot({type:'tab', i, j:0}, false));
      p.appendChild(base);
      let off = 0;
      pile.forEach((c,j) => {
        const el = cardEl(c); el.classList.add('abs'); el.style.top = `calc(var(--cw) * ${off})`;
        const src = {type:'tab', i, j};
        if(c.up){ el.classList.add('can'); el.addEventListener('click', e => { e.stopPropagation(); clickSpot(src, true); });
          el.addEventListener('dblclick', e => { e.preventDefault(); if(j===pile.length-1){ sel=null; toFoundation(src); render(); } }); }
        if(sel && sel.type==='tab' && sel.i===i && j>=sel.j) el.classList.add('sel');
        p.appendChild(el);
        off += c.up ? .32 : .16;
      });
      p.style.height = `calc(var(--cw) * ${1.4 + off})`;
      row2.appendChild(p);
    });
    wrap.appendChild(row2);
    const done = S.found.reduce((n,f)=>n+f.length,0);
    if(done===52 && !won){ won = true; }
    ui.status(won ? `<span class="win">Solved in ${moves} moves. Nicely played.</span>` :
      `Moves <b>${moves}</b> · On foundations <b>${done}</b>/52 · ${sel ? 'Now tap where it goes.' : 'Tap a card to pick it up.'}`);
  }
  return { newGame };
}

// ======================= BLACKJACK =======================
function Blackjack(root, ui){
  let shoe=[], bank=store.get('bj-bank',500), bet=0, lastBet=25, P=[], D=[], phase='bet', result='';
  const wrap = h('div','felt'); root.appendChild(wrap);
  const draw = (up=true) => { if(shoe.length<15) shoe = shuffle(makeDeck(4)); const c=shoe.pop(); c.up=up; return c; };
  function score(hand){ let t=0,a=0; for(const c of hand){ if(!c.up) continue; let v=c.r>10?10:c.r; if(c.r===1){a++; v=11;} t+=v; } while(t>21&&a){t-=10;a--;} return {t, soft:a>0}; }
  const full = hand => score(hand.map(c=>({...c, up:true}))).t;
  function newGame(){ if(bank<5) bank=500; store.set('bj-bank',bank); P=[];D=[]; phase='bet'; bet=Math.min(lastBet, bank); result=''; render(); }
  function deal(){
    if(bet<=0 || bet>bank) return;
    lastBet=bet; bank-=bet; P=[draw(),draw()]; D=[draw(),draw(false)]; phase='play';
    if(full(P)===21 || full(D)===21) finish(); render();
  }
  function hit(){ P.push(draw()); const t=score(P).t; if(t>21) finish(); else if(t===21) return stand(); render(); }
  function stand(){ D[1].up=true; while(score(D).t<17) D.push(draw()); finish(); render(); }
  function dbl(){ if(bank<bet) return; bank-=bet; bet*=2; P.push(draw()); if(score(P).t>21){ finish(); render(); } else stand(); }
  function finish(){
    D.forEach(c=>c.up=true);
    const p=score(P).t, d=score(D).t, pBJ=p===21&&P.length===2, dBJ=d===21&&D.length===2;
    if(p>21){ result=`<span class="lose">Bust with ${p}. You lose ${bet}.</span>`; }
    else if(pBJ && !dBJ){ const w=Math.floor(bet*1.5); bank+=bet+w; result=`<span class="win">Blackjack! You win ${w}.</span>`; }
    else if(dBJ && !pBJ){ result=`<span class="lose">Dealer has blackjack. You lose ${bet}.</span>`; }
    else if(d>21){ bank+=bet*2; result=`<span class="win">Dealer busts with ${d}. You win ${bet}.</span>`; }
    else if(p>d){ bank+=bet*2; result=`<span class="win">${p} beats ${d}. You win ${bet}.</span>`; }
    else if(p===d){ bank+=bet; result=`Push at ${p}. Your bet comes back.`; }
    else { result=`<span class="lose">Dealer's ${d} beats ${p}. You lose ${bet}.</span>`; }
    phase='done'; store.set('bj-bank', bank);
  }
  function next(){ P=[];D=[]; phase='bet'; bet=Math.min(lastBet, bank); if(bank<5){ bank=500; bet=25; result='Out of chips, so the house spotted you 500.'; store.set('bj-bank',bank);} render(); }
  function seat(label, hand, showTotal){
    const s = h('div','seat');
    const st = score(hand);
    s.appendChild(h('div','label', label + (hand.length && showTotal ? ` · <span class="total">${st.t}${st.soft&&st.t<21?' soft':''}</span>` : '')));
    const hd = h('div','hand overlap'); hand.forEach(c => hd.appendChild(cardEl(c)));
    if(!hand.length){ hd.appendChild(h('div','slot')); }
    s.appendChild(hd); return s;
  }
  function render(){
    wrap.innerHTML='';
    wrap.appendChild(seat('Dealer', D, true));
    const bankRow = h('div','bank', `<div><span class="label">Bankroll</span><strong>${bank}</strong></div><div><span class="label">Bet</span><strong>${bet}</strong></div>`);
    wrap.appendChild(bankRow);
    wrap.appendChild(seat('You', P, true));
    const ctr = h('div','controls');
    const btn = (t, fn, cls='btn', dis=false) => { const b=h('button',cls,t); b.disabled=dis; b.addEventListener('click',fn); ctr.appendChild(b); return b; };
    if(phase==='bet'){
      const chips = h('div','chips');
      [5,10,25,100].forEach(v => { const c=h('button','chip c'+v, v); c.disabled = bet+v>bank; c.setAttribute('aria-label','Add '+v);
        c.addEventListener('click', () => { if(bet+v<=bank){ bet+=v; render(); } }); chips.appendChild(c); });
      wrap.appendChild(chips);
      btn('Clear bet', () => { bet=0; render(); }, 'btn', bet===0);
      btn('Deal', deal, 'btn primary', bet===0 || bet>bank);
    } else if(phase==='play'){
      btn('Hit', hit, 'btn primary'); btn('Stand', stand);
      btn('Double', dbl, 'btn', P.length!==2 || bank<bet);
    } else { btn('Next hand', next, 'btn primary'); }
    wrap.appendChild(ctr);
    ui.status(phase==='bet' ? (result || 'Tap chips to set your bet, then deal.') : phase==='play' ? `You have <b>${score(P).t}</b>. Dealer shows <b>${score(D).t}</b>.` : result);
    if(phase==='bet') result='';
  }
  return { newGame };
}

// ======================= WAR =======================
function War(root, ui){
  let A, B, shownA, shownB, rounds, wars, msg, over, timer;
  const wrap = h('div','felt'); root.appendChild(wrap);
  const val = c => c.r===1 ? 14 : c.r;
  function newGame(){
    clearInterval(timer); timer=null;
    const d = shuffle(makeDeck()); A=d.slice(0,26); B=d.slice(26);
    shownA=[]; shownB=[]; rounds=0; wars=0; over=false; msg='Flip to start the first round.'; render();
  }
  function flip(){
    if(over) return;
    rounds++;
    const pile=[]; shownA=[]; shownB=[];
    let a=A.shift(), b=B.shift(); a.up=b.up=true; pile.push(a,b); shownA.push(a); shownB.push(b);
    let winner=null, warHere=0;
    while(val(a)===val(b)){
      warHere++; wars++;
      if(!A.length || !B.length){ winner = A.length ? 'A' : 'B'; break; }
      const n = Math.min(3, A.length-1, B.length-1);
      for(let k=0;k<n;k++){ const x=A.shift(), y=B.shift(); x.up=y.up=false; pile.push(x,y); shownA.push(x); shownB.push(y); }
      a=A.shift(); b=B.shift(); a.up=b.up=true; pile.push(a,b); shownA.push(a); shownB.push(b);
    }
    if(!winner) winner = val(a)>val(b) ? 'A' : 'B';
    const won = shuffle(pile.map(c => ({...c, up:false})));
    (winner==='A' ? A : B).push(...won);
    const tag = warHere ? (warHere>1 ? `Double war! ` : `War! `) : '';
    msg = winner==='A' ? `<span class="win">${tag}You take ${pile.length} cards.</span>` : `<span class="lose">${tag}Computer takes ${pile.length} cards.</span>`;
    if(!A.length || !B.length){ over=true; clearInterval(timer); timer=null;
      msg = A.length ? `<span class="win">You collected all 52 cards in ${rounds} rounds.</span>` : `<span class="lose">The computer won after ${rounds} rounds.</span>`; }
    render();
  }
  function auto(){ if(timer){ clearInterval(timer); timer=null; render(); return; } timer=setInterval(()=>{ flip(); if(over && timer){ clearInterval(timer); timer=null; render(); } }, 260); render(); }
  function seat(label, deckN, shown){
    const s=h('div','seat');
    s.appendChild(h('div','label', `${label} · <span class="total">${deckN}</span> cards`));
    const row=h('div','mid');
    const dk = deckN ? cardEl({}, false) : h('div','slot');
    const hd=h('div','hand overlap'); shown.forEach(c=>hd.appendChild(cardEl(c)));
    if(!shown.length) hd.appendChild(h('div','slot'));
    row.append(dk, hd); s.appendChild(row); return s;
  }
  function render(){
    wrap.innerHTML='';
    wrap.appendChild(seat('Computer', B.length, shownB));
    const ctr=h('div','controls');
    const f=h('button','btn primary','Flip'); f.disabled=over || !!timer; f.addEventListener('click',flip);
    const a=h('button','btn', timer ? 'Stop' : 'Auto-play'); a.disabled=over; a.addEventListener('click',auto);
    ctr.append(f,a); wrap.appendChild(ctr);
    wrap.appendChild(seat('You', A.length, shownA));
    ui.status(`${msg} <span style="margin-left:auto" class="label">Round ${rounds} · Wars ${wars}</span>`);
  }
  return { newGame, stop(){ clearInterval(timer); } };
}

// ======================= CRAZY EIGHTS =======================
function Eights(root, ui){
  let stock, discard, P, C, suit, turn, drew, choosing, over, msg, busy;
  const wrap = h('div','felt'); wrap.style.setProperty('--cw','min(72px, 17vw)'); root.appendChild(wrap);
  const top = () => discard[discard.length-1];
  const playable = c => c.r===8 || c.s===suit || c.r===top().r;
  function newGame(){
    stock = shuffle(makeDeck()); P=stock.splice(0,7); C=stock.splice(0,7);
    P.forEach(c=>c.up=true);
    let first = stock.pop(); while(first.r===8){ stock.unshift(first); first=stock.pop(); }
    first.up=true; discard=[first]; suit=first.s; turn='p'; drew=0; choosing=false; over=false; busy=false;
    sortHand(); msg='Your turn. Match the suit or rank.'; render();
  }
  function sortHand(){ P.sort((a,b)=> SUITS.indexOf(a.s)-SUITS.indexOf(b.s) || a.r-b.r); }
  function refill(){ if(stock.length) return true; if(discard.length<=1) return false; const t=discard.pop(); stock=shuffle(discard.map(c=>(c.up=false,c))); discard=[t]; return true; }
  function play(i, el){
    if(turn!=='p' || choosing || over) return;
    const c=P[i]; if(!playable(c)){ el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); return; }
    P.splice(i,1); discard.push(c);
    if(c.r===8 && P.length){ choosing=true; msg='Eight! Choose the next suit.'; return render(); }
    suit=c.s; endPlayer();
  }
  function chooseSuit(s){ suit=s; choosing=false; endPlayer(); }
  function drawCard(){
    if(turn!=='p' || choosing || over) return;
    if(!refill()){ msg='The deck is empty. Pass your turn.'; drew=Math.max(drew,1); return render(); }
    const c=stock.pop(); c.up=true; P.push(c); drew++; sortHand();
    msg = playable(c) ? `You drew the ${rankLabel(c.r)}${c.s}. You can play it.` : `You drew the ${rankLabel(c.r)}${c.s}.`; render();
  }
  function pass(){ if(turn!=='p' || !drew) return; msg='You passed.'; endPlayer(true); }
  function endPlayer(passed){
    if(!P.length){ over=true; msg='<span class="win">You played your last card. You win!</span>'; return render(); }
    turn='c'; drew=0; render();
    setTimeout(cpu, 750);
  }
  function cpu(){
    if(over) return;
    let drawn=0;
    let pick = () => { const non8 = C.filter(c=>c.r!==8 && playable(c)); non8.sort((a,b)=> (b.s===suit)-(a.s===suit)); return non8[0] || C.find(c=>c.r===8); };
    let c = pick();
    while(!c && refill()){ const d=stock.pop(); C.push(d); drawn++; if(playable(d)) c=d; }
    const drewTxt = drawn ? `Computer drew ${drawn}. ` : '';
    if(c){
      C.splice(C.indexOf(c),1); c.up=true; discard.push(c);
      if(c.r===8){ const counts={}; C.forEach(x=>{ if(x.r!==8) counts[x.s]=(counts[x.s]||0)+1; }); suit = Object.keys(counts).sort((a,b)=>counts[b]-counts[a])[0] || SUITS[Math.floor(Math.random()*4)]; msg=`${drewTxt}Computer played an 8 and chose ${suit}.`; }
      else { suit=c.s; msg=`${drewTxt}Computer played ${rankLabel(c.r)}${c.s}.`; }
    } else msg=`${drewTxt}Computer passed.`;
    if(!C.length){ over=true; msg='<span class="lose">The computer went out first.</span>'; return render(); }
    turn='p'; msg += ' Your turn.'; render();
  }
  function render(){
    wrap.innerHTML='';
    const cs=h('div','seat'); cs.appendChild(h('div','label', `Computer · <span class="total">${C.length}</span> cards`));
    const ch=h('div','hand overlap'); C.forEach(c=>ch.appendChild(cardEl(c, over))); cs.appendChild(ch); wrap.appendChild(cs);
    const mid=h('div','mid');
    const st = stock.length ? cardEl({}, false) : h('div','slot','↻');
    st.style.cursor = turn==='p' && !over ? 'pointer' : 'default';
    st.setAttribute('role','button'); st.setAttribute('aria-label','Draw a card');
    st.addEventListener('click', drawCard);
    const stw=h('div','seat'); stw.style.width='auto'; stw.append(st, h('div','label', `${stock.length} in deck`));
    const dw=h('div','seat'); dw.style.width='auto'; dw.append(cardEl(top()), h('div','suitbadge', `Suit <span class="${isRed(suit)?'r':''}">${suit}</span>`));
    mid.append(stw, dw); wrap.appendChild(mid);
    if(choosing){ const sp=h('div','suitpick'); SUITS.forEach(s=>{ const b=h('button', isRed(s)?'r':'', s); b.setAttribute('aria-label','Choose '+s); b.addEventListener('click',()=>chooseSuit(s)); sp.appendChild(b); }); wrap.appendChild(sp); }
    const ps=h('div','seat'); ps.appendChild(h('div','label', `You · <span class="total">${P.length}</span> cards`));
    const ph=h('div','hand wrapgap');
    P.forEach((c,i)=>{ const el=cardEl(c); const ok = turn==='p' && !choosing && !over && playable(c); el.classList.add(ok?'can':'dim'); if(turn!=='p'||over) el.classList.remove('dim'); el.addEventListener('click',()=>play(i,el)); ph.appendChild(el); });
    ps.appendChild(ph); wrap.appendChild(ps);
    const ctr=h('div','controls');
    const pb=h('button','btn','Pass'); pb.disabled = turn!=='p' || !drew || choosing || over; pb.addEventListener('click',()=>pass());
    ctr.appendChild(pb); wrap.appendChild(ctr);
    ui.status(turn==='c' && !over ? 'Computer is thinking…' : msg);
  }
  return { newGame };
}

// ======================= MEMORY =======================
function Memory(root, ui){

  function newGame(){
    clearInterval(timer); timer=null; start=null;
    const picks = shuffle(makeDeck()).filter((c,i,a)=> a.findIndex(x=>x.r===c.r)===i).slice(0,8);
    cards = shuffle([...picks, ...picks].map((c,id)=>({c:{...c, up:true}, key:c.s+c.r, state:'down', id})));
    open=[]; moves=0; lock=false; done=false; render();
  }

  const fmt = s => `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
  function click(k){
    const it=cards[k]; if(lock || it.state!=='down' || done) return;

      moves++;

      if(a.key===b.key){ a.state=b.state='done'; open=[];
        if(cards.every(x=>x.state==='done')){ done=true; clearInterval(timer); if(best==null || moves<best){ best=moves; store.set('mem-best',best); } } }
      else { lock=true; setTimeout(()=>{ a.state=b.state='down'; open=[]; lock=false; render(); }, 850); }
    }
    render();
  }
  function status(){
    const pairs = cards.filter(x=>x.state==='done').length/2;
    ui.status(done ? `<span class="win">All pairs found in ${moves} moves and ${fmt(secs())}.</span> <span class="label" style="margin-left:auto">Best ${best} moves</span>`
      : `Moves <b>${moves}</b> · Pairs <b>${pairs}</b>/8 · Time <b>${fmt(secs())}</b>${best!=null?` <span class="label" style="margin-left:auto">Best ${best} moves</span>`:''}`);
  }
  function render(){
    grid.innerHTML='';

      el.addEventListener('click',()=>click(k)); el.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); click(k);} }); grid.appendChild(el); });
    status();
  }
  return { newGame, stop(){ clearInterval(timer); } };
}

const HAND_NAMES = ['High card','Pair','Two pair','Three of a kind','Straight','Flush','Full house','Four of a kind','Straight flush'];
